<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>対戦フィールド</title>
<style>
  :root{
    --gold: #c9a13b;
    --gold-light: #e8c874;
    --lacquer-red: #8f2a2a;
    --lacquer-red-dark: #6b1e1e;
    --tatami: #cbb373;
    --tatami-line: #a68f4f;
    --sky-top: #f4c9d6;
    --sky-bottom: #f9e3d3;
    --ink: #2c1a12;
    --paper: #fbf3e2;
    --indigo: #1f2f4d;
    --indigo-dark: #131f34;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  }

  /* ============================================================
     画面切り替え：.screen を重ねて、.active のものだけ見せる
  ============================================================ */
  .app{ position:relative; width:100vw; height:100vh; overflow:hidden; background:var(--indigo-dark); }
  .screen{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.45s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ============================================================
     共通パーツ
  ============================================================ */
  .kamon-btn{
    appearance:none;
    border:2px solid var(--gold);
    background:linear-gradient(180deg, var(--paper), #f0e4c8);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    letter-spacing:2px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .kamon-btn:hover{ transform:translateY(-2px); box-shadow:0 9px 18px rgba(0,0,0,0.3); }
  .kamon-btn:active{ transform:translateY(0px) scale(0.98); box-shadow:0 4px 8px rgba(0,0,0,0.25); }
  .kamon-btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }

  .back-link{
    position:absolute;
    top:20px; left:20px;
    z-index:30;
    background:rgba(20,10,8,0.4);
    color:var(--paper);
    border:1.5px solid var(--gold);
    border-radius:999px;
    padding:8px 18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
  }
  .back-link:hover{ background:rgba(20,10,8,0.6); }

  /* ============================================================
     SCREEN 1: タイトル画面
  ============================================================ */
  .title-screen{
    background:
      radial-gradient(circle at 50% 20%, rgba(232,200,116,0.18), transparent 55%),
      linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .title-screen .sun{
    position:absolute;
    top:14%;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, var(--gold-light), var(--lacquer-red) 70%);
    box-shadow:0 0 80px rgba(232,200,116,0.35);
    opacity:0.9;
  }
  .title-screen .mist{
    position:absolute; left:0; right:0; bottom:0; height:40%;
    background:linear-gradient(to top, rgba(19,31,52,0.95), transparent);
  }
  .title-screen .brand{
    position:relative;
    z-index:2;
    text-align:center;
    color:var(--paper);
  }
  .title-screen .brand .eyebrow{
    font-size:13px;
    letter-spacing:8px;
    color:var(--gold-light);
    margin-bottom:14px;
  }
  .title-screen .brand h1{
    margin:0;
    font-size:clamp(40px, 8vw, 76px);
    letter-spacing:14px;
    font-weight:900;
    color:var(--paper);
    text-shadow:0 0 30px rgba(232,200,116,0.4), 0 4px 0 var(--lacquer-red-dark);
  }
  .title-screen .brand .sub{
    margin-top:10px;
    font-size:14px;
    letter-spacing:6px;
    color:rgba(251,243,226,0.65);
  }
  .title-screen .start-btn{
    position:relative;
    z-index:2;
    margin-top:56px;
    padding:16px 56px;
    font-size:18px;
    animation:pulseGlow 2.2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 6px 14px rgba(0,0,0,0.25); }
    50%{ box-shadow:0 6px 26px rgba(232,200,116,0.55); }
  }
  .title-screen .version{
    position:absolute;
    bottom:18px; right:22px;
    color:rgba(251,243,226,0.4);
    font-size:11px;
    letter-spacing:2px;
    z-index:2;
  }

  /* ============================================================
     SCREEN 2: モード選択画面
  ============================================================ */
  .mode-screen{
    background:linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:36px;
  }
  .mode-screen .heading{
    color:var(--paper);
    text-align:center;
  }
  .mode-screen .heading .eyebrow{
    font-size:12px;
    letter-spacing:6px;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .mode-screen .heading h2{
    margin:0;
    font-size:clamp(24px, 4vw, 34px);
    letter-spacing:6px;
    font-weight:900;
  }
  .mode-grid{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    justify-content:center;
    padding:0 20px;
  }
  .mode-card{
    width:260px;
    min-height:220px;
    background:linear-gradient(180deg, rgba(251,243,226,0.06), rgba(251,243,226,0.02));
    border:2px solid var(--gold);
    border-radius:18px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--paper);
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .mode-card:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 30px rgba(0,0,0,0.35);
    border-color:var(--gold-light);
  }
  .mode-card .icon-badge{
    width:64px; height:64px;
    border-radius:50%;
    margin-bottom:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    color:#fff;
    border:3px solid var(--paper);
    box-shadow:0 6px 14px rgba(0,0,0,0.35);
  }
  .mode-card.cpu .icon-badge{ background:radial-gradient(circle at 35% 30%, #e08b8b, #a83a3a); }
  .mode-card.online .icon-badge{ background:radial-gradient(circle at 35% 30%, #8bb8e0, #3a5fa8); }
  .mode-card h3{
    margin:0 0 8px;
    font-size:17px;
    letter-spacing:3px;
  }
  .mode-card p{
    margin:0;
    font-size:12.5px;
    line-height:1.7;
    color:rgba(251,243,226,0.7);
  }

  /* ============================================================
     SCREEN 3: キャラクター編成画面
  ============================================================ */
  .roster-screen{
    background:linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:70px 20px 24px;
    overflow-y:auto;
  }
  .roster-screen .heading{
    color:var(--paper);
    text-align:center;
    margin-bottom:26px;
  }
  .roster-screen .heading .eyebrow{
    font-size:12px;
    letter-spacing:6px;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .roster-screen .heading h2{
    margin:0;
    font-size:clamp(22px, 4vw, 30px);
    letter-spacing:5px;
    font-weight:900;
  }

  .roster-slots{
    display:flex;
    gap:16px;
    margin-bottom:34px;
  }
  .roster-slot-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .seikaku-select{
    width:78px;
    font-size:10px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--gold);
    border-radius:8px;
    padding:2px 2px;
    text-align:center;
    cursor:pointer;
  }
  .roster-slot{
    width:78px; height:78px;
    border-radius:50%;
    border:3px dashed var(--gold);
    background:rgba(251,243,226,0.04);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .roster-slot.filled{
    border-style:solid;
    background:transparent;
  }
  .roster-slot .placeholder{
    color:rgba(251,243,226,0.35);
    font-size:11px;
    letter-spacing:1px;
  }
  .roster-slot .token{
    width:100%; height:100%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:24px; color:#fff;
    border:3px solid var(--paper);
    box-shadow:0 6px 14px rgba(0,0,0,0.3);
  }
  .roster-slot .order-badge{
    position:absolute;
    top:-8px; left:-8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--lacquer-red);
    border:2px solid var(--paper);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .roster-pool{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:14px;
    width:100%;
    max-width:760px;
    margin-bottom:30px;
  }
  .roster-card{
    background:rgba(251,243,226,0.05);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:14px 10px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--paper);
    transition:transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .roster-card:hover{ transform:translateY(-3px); border-color:var(--gold-light); }
  .roster-card.selected{
    border-color:#7ed957;
    background:rgba(126,217,87,0.12);
  }
  .roster-card .token{
    width:56px; height:56px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:#fff;
    border:3px solid var(--paper);
  }
  .roster-card .name{ font-size:12.5px; font-weight:700; letter-spacing:1px; }
  .roster-card .rank-badge{
    display:inline-block;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    padding:1px 8px;
    border-radius:999px;
    margin:2px 0 4px;
    color:#1a1108;
    background:var(--gold-light);
  }
  .roster-card .rank-badge.rank-S{ background:linear-gradient(135deg,#ffe27a,#ff9d3d); color:#3a1a00; }
  .roster-card .rank-badge.rank-A{ background:#f0c46a; }
  .roster-card .rank-badge.rank-B{ background:#cfe08b; }
  .roster-card .rank-badge.rank-C{ background:#9fd2e0; }
  .roster-card .rank-badge.rank-D{ background:#b8b8d0; }
  .roster-card .rank-badge.rank-E{ background:#c9a3a3; }
  .roster-card .stat{ font-size:10.5px; color:rgba(251,243,226,0.6); }

  .roster-footer{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .roster-footer .count{
    color:var(--paper);
    font-size:13px;
    letter-spacing:1px;
  }
  .roster-footer .count strong{ color:var(--gold-light); font-size:16px; }

  /* ============================================================
     SCREEN 4: 対戦フィールド（既存の実装）
  ============================================================ */
  .battle-screen .stage{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 42%, var(--sky-bottom) 42%);
  }

  .battle-screen .floor{
    position:absolute;
    left:50%;
    top:38%;
    width:180%;
    height:60%;
    margin-left:-90%;
    background:
      repeating-linear-gradient(100deg, transparent 0 40px, var(--tatami-line) 40px 43px),
      repeating-linear-gradient(80deg, transparent 0 40px, var(--tatami-line) 40px 43px),
      var(--tatami);
    clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
    box-shadow: inset 0 0 200px rgba(0,0,0,0.2);
    z-index:1;
  }

  .battle-screen .horizon-haze{
    position:absolute;
    left:0; right:0; top:34%;
    height:10%;
    background:linear-gradient(to bottom, rgba(249,227,211,0.9), rgba(249,227,211,0));
    pointer-events:none;
    z-index:2;
  }
  .battle-screen .vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 12vw rgba(0,0,0,0.4);
    pointer-events:none;
    z-index:20;
  }

  .battle-screen .backdrop{
    position:absolute;
    left:50%;
    top:4%;
    transform:translateX(-50%);
    z-index:3;
  }
  .battle-screen .backdrop .arch{
    width:34vw;
    max-width:520px;
    height:14vw;
    max-height:150px;
    border:1.2vw solid var(--lacquer-red);
    border-bottom:none;
    border-radius:60% 60% 0 0 / 100% 100% 0 0;
    background:rgba(143,42,42,0.15);
  }

  .battle-screen .pillar{
    position:absolute;
    top:6%;
    width:1.6vw;
    max-width:26px;
    height:22vh;
    background:linear-gradient(var(--lacquer-red), var(--lacquer-red-dark));
    border-radius:6px;
    z-index:3;
  }
  .battle-screen .pillar.left{left:5%;}
  .battle-screen .pillar.right{right:5%;}

  .battle-screen .slot{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    top:0; left:0;
    transform:translate(-50%, -50%);
    z-index:10;
    transition: left 0.5s cubic-bezier(.4,.1,.3,1),
                top 0.5s cubic-bezier(.4,.1,.3,1);
    will-change: left, top;
  }
  .battle-screen .slot.party-member{
    pointer-events:none;
  }
  /* 必殺技ゲージ選択モード中は、満タンの味方キャラをタップできるようにする */
  .battle-screen .slot.party-member.ult-selectable{
    pointer-events:auto;
  }

  .battle-screen .token{
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    border:4px solid var(--paper);
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
    transition: width 0.5s cubic-bezier(.4,.1,.3,1),
                height 0.5s cubic-bezier(.4,.1,.3,1),
                font-size 0.5s cubic-bezier(.4,.1,.3,1),
                box-shadow 0.5s ease;
  }

  .battle-screen .nameplate{
    margin-top:8px;
    background:var(--paper);
    color:var(--ink);
    padding:2px 10px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    border:2px solid var(--gold);
    white-space:nowrap;
    transition: opacity 0.3s ease, font-size 0.5s ease;
  }

  .battle-screen .hpbar{
    margin-top:6px;
    width:80px;
    height:8px;
    background:rgba(0,0,0,0.25);
    border-radius:4px;
    overflow:visible;
    border:1px solid rgba(0,0,0,0.3);
    transition: width 0.5s ease, opacity 0.3s ease, margin-top 0.5s ease;
    position:relative;
  }
  .battle-screen .hpbar > div:last-child{
    height:100%;
    max-width:100%;
    border-radius:3px;
    overflow:hidden;
    background:linear-gradient(90deg,#f2a0c4,#d84a8c);
  }

  /* ---- 必殺技ゲージ（しずく型、体力バーの左に少し重ねる） ---- */
  .battle-screen .ultgauge{
    position:absolute;
    left:-11px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    z-index:2;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    transition: width 0.5s ease, height 0.5s ease, left 0.5s ease;
  }
  .battle-screen .ultgauge svg{ width:100%; height:100%; display:block; }
  .battle-screen .ultgauge .ult-bg{
    fill:rgba(10,20,40,0.55);
    stroke:rgba(255,255,255,0.5);
    stroke-width:3;
  }
  .battle-screen .ultgauge .ult-fill{
    fill:#4fa3f0;
  }
  .battle-screen .ultgauge clipPath rect{
    transition: y 0.1s linear, height 0.1s linear;
  }

  .battle-screen .enemy .token{ width:64px; height:64px; font-size:22px; }
  .battle-screen .enemy .nameplate{ font-size:11px; }
  .battle-screen .enemy .hpbar{ width:56px; }

  .battle-screen .slot.enemy-member{ pointer-events:auto; cursor:pointer; }

  .battle-screen .enemy-member.state-front .token{ width:88px; height:88px; font-size:26px; }
  .battle-screen .enemy-member.state-front .nameplate{ font-size:13px; opacity:1; }

  /* 敵キャラは体力メーター・必殺技ゲージを表示しない */
  .battle-screen .enemy-member .hpbar,
  .battle-screen .enemy-member .ultgauge{
    display:none;
  }

  /* 敵の後衛は表示しない */
  .battle-screen .enemy-member.state-reserve{
    display:none;
  }
  .battle-screen .enemy-member.dead{ cursor:not-allowed; }

  /* ---- 気絶＝青い人魂化演出 ---- */
  @keyframes soulFloat{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-8px) rotate(3deg); }
  }
  @keyframes soulFlicker{
    0%,100%{ opacity:0.85; }
    50%{ opacity:1; }
  }
  .slot.dead .token{
    width:34px !important;
    height:34px !important;
    font-size:0 !important;
    background:radial-gradient(circle at 40% 30%, #d8ecff, #5aa8e8 55%, #2f6fb0 100%) !important;
    border-color:#bfe3ff;
    box-shadow:0 0 14px 4px rgba(90,170,255,0.65), 0 8px 14px rgba(0,0,0,0.3);
    color:transparent;
    position:relative;
    filter:none;
    opacity:1;
    animation:soulFloat 2.4s ease-in-out infinite, soulFlicker 1.6s ease-in-out infinite;
    /* 人魂らしい丸い雫型に */
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .slot.dead .token::before{
    content:'';
    position:absolute;
    top:14%; left:50%;
    width:22%; height:22%;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
    transform:translateX(-50%);
    filter:blur(1px);
  }
  .slot.dead .token::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
  }
  .slot.dead .nameplate{ opacity:0.55; }
  .slot.dead .hpbar{ opacity:0.4; }

  .battle-screen .party-member.state-front .token{ width:110px; height:110px; font-size:32px; }
  .battle-screen .party-member.state-front .nameplate{ font-size:15px; opacity:1; }
  .battle-screen .party-member.state-front .hpbar{ width:100px; opacity:1; }

  /* ---- バフ／デバフのオーラ ---- */
  @keyframes auraBuffPulse{
    0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 14px 5px rgba(255,183,59,0.8), 0 0 26px 10px rgba(255,140,20,0.45); }
    50%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 20px 8px rgba(255,200,90,0.95), 0 0 36px 14px rgba(255,150,30,0.6); }
  }
  @keyframes auraDebuffPulse{
    0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 14px 5px rgba(120,70,150,0.75), 0 0 26px 10px rgba(70,35,95,0.5); }
    50%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 18px 7px rgba(140,85,170,0.85), 0 0 32px 12px rgba(85,45,115,0.6); }
  }
  .slot.aura-buff .token{
    animation: auraBuffPulse 1.6s ease-in-out infinite;
  }
  .slot.aura-debuff .token{
    animation: auraDebuffPulse 1.8s ease-in-out infinite;
  }
  /* デバフのオーラを優先表示（同時付与時はデバフのアニメーションのみ有効） */
  .slot.aura-buff.aura-debuff .token{
    animation: auraDebuffPulse 1.8s ease-in-out infinite;
  }

  .battle-screen .party-member.state-reserve .token{
    width:34px; height:34px; font-size:13px;
    border:2px solid var(--gold-light);
    box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  .battle-screen .party-member.state-reserve .nameplate{ opacity:0; font-size:0; padding:0; border:0; margin-top:0; }
  /* 後衛でも体力メーターは表示したままにする（小さいトークンに合わせて縮小） */
  .battle-screen .party-member.state-reserve .hpbar{ width:36px; height:5px; margin-top:4px; opacity:1; }
  .battle-screen .party-member.state-reserve .ultgauge{ width:12px; height:14.5px; left:-7px; }

  /* キャラの色バリエーション（画面共通で使用） */
  .c-purple{ background:radial-gradient(circle at 35% 30%, #b98ee0, #7b3fb0); }
  .c-cream { background:radial-gradient(circle at 35% 30%, #fff3d6, #e0b45c); }
  .c-green { background:radial-gradient(circle at 35% 30%, #a8e6a1, #4c9a4c); }
  .c-red   { background:radial-gradient(circle at 35% 30%, #e08b8b, #a83a3a); }
  .c-blue  { background:radial-gradient(circle at 35% 30%, #8bb8e0, #3a5fa8); }
  .c-orange{ background:radial-gradient(circle at 35% 30%, #f0b878, #c47a2f); }
  .c-teal  { background:radial-gradient(circle at 35% 30%, #8fe0d0, #2f9c86); }
  .c-pink  { background:radial-gradient(circle at 35% 30%, #f0a8c8, #c4477f); }
  .c-yellow{ background:radial-gradient(circle at 35% 30%, #fff0a0, #d4b32c); }
  .c-navy  { background:radial-gradient(circle at 35% 30%, #7fa8e0, #23407a); }

  .battle-screen .command-bar{
    position:absolute;
    left:50%;
    bottom:3%;
    transform:translateX(-50%);
    width:220px;
    height:50px;
    border-radius:30px;
    z-index:14;
    cursor:grab;
    user-select:none;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .battle-screen .command-bar.dragging{
    cursor:grabbing;
  }
  .battle-screen .command-bar.locked{
    cursor:not-allowed;
  }

  /* ---- 回転タイマーのリング（ドラッグ中の4秒カウント） ---- */
  /* 後衛キャラのアイコンと被らないよう、command-barのさらに上に配置する */
  .battle-screen .timer-ring{
    position:absolute;
    left:50%; bottom:100%;
    margin-bottom:14px;
    width:48px; height:48px;
    transform:translateX(-50%) rotate(-90deg);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.2s ease;
    z-index:16;
  }
  .battle-screen .timer-ring.visible{ opacity:1; }
  .battle-screen .timer-ring-bg{
    fill:none;
    stroke:rgba(0,0,0,0.35);
    stroke-width:8;
  }
  .battle-screen .timer-ring-fg{
    fill:none;
    stroke:var(--gold-light);
    stroke-width:8;
    stroke-linecap:round;
    stroke-dasharray:276.5;
    stroke-dashoffset:0;
    transition:stroke 0.2s ease;
  }
  .battle-screen .timer-ring-fg.urgent{
    stroke:#e05a4e;
  }
  .battle-screen .timer-ring-fg.cooldown{
    stroke:#7a8aa0;
  }

  /* ---- カウントダウン数字（残り3秒を切ったら表示）。リングの中央に重ねる ---- */
  .battle-screen .timer-countdown{
    position:absolute;
    left:50%; bottom:100%;
    margin-bottom:14px;
    width:48px; height:48px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:900;
    color:var(--paper);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    z-index:17;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .battle-screen .timer-countdown.visible{ opacity:1; }
  .battle-screen .timer-countdown.urgent{ color:#ff9d8f; }

  /* ---- クールタイム中のラベル表示 ---- */
  .battle-screen .cooldown-label{
    position:absolute;
    left:50%;
    bottom:100%;
    margin-bottom:70px;
    transform:translateX(-50%);
    background:rgba(30,15,10,0.75);
    color:var(--paper);
    border:2px solid #7a8aa0;
    border-radius:20px;
    padding:6px 18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    white-space:nowrap;
    z-index:16;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .battle-screen .cooldown-label.visible{ opacity:1; }

  /* ---- 右下のコマンドボタン（おはらい／アイテム） ---- */
  .battle-screen .action-menu{
    position:absolute;
    right:3%;
    bottom:3%;
    z-index:15;
    display:flex;
    gap:10px;
  }
  /* ---- 左下のコマンドボタン（わざ／ねらう） ---- */
  .battle-screen .action-menu-left{
    position:absolute;
    left:3%;
    bottom:3%;
    z-index:15;
    display:flex;
    gap:10px;
  }
  .battle-screen .action-menu button,
  .battle-screen .action-menu-left button{
    appearance:none;
    border:none;
    border-radius:14px;
    padding:12px 18px;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;
    color:var(--paper);
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    cursor:pointer;
    font-family:inherit;
  }
  .battle-screen .action-menu button:active{
    transform:translateY(1px);
  }
  .battle-screen .action-menu-left button:active{
    transform:translateY(1px);
  }
  .battle-screen .action-menu-left .btn-waza{
    background:linear-gradient(180deg,#e2564a,#b8352b);
  }
  .battle-screen .action-menu-left .btn-nerau{
    background:linear-gradient(180deg,#4a90d9,#2c5f9e);
  }
  .battle-screen .action-menu .btn-oharai{
    background:linear-gradient(180deg,#9a6ad0,#6a3f9c);
  }
  .battle-screen .action-menu .btn-item{
    background:linear-gradient(180deg,#9aa1ab,#6c727b);
    cursor:not-allowed;
    opacity:0.65;
  }

  .battle-screen .turn-label{
    position:absolute;
    top:2%;
    left:50%;
    transform:translateX(-50%);
    color:var(--lacquer-red-dark);
    font-size:13px;
    font-weight:700;
    letter-spacing:4px;
    background:var(--paper);
    padding:4px 16px;
    border-radius:12px;
    border:2px solid var(--gold);
    z-index:15;
  }

  /* ---- 動作確認用ログパネル ---- */
  .battle-screen .battle-log{
    position:absolute;
    top:8%;
    right:14px;
    width:210px;
    max-height:34%;
    overflow-y:auto;
    background:rgba(10,10,20,0.55);
    border:1.5px solid var(--gold);
    border-radius:10px;
    padding:8px 10px;
    font-size:11px;
    line-height:1.6;
    color:var(--paper);
    z-index:20;
  }
  .battle-screen .battle-log .log-line{ opacity:0.9; }
  .battle-screen .battle-log .log-line.miss{ color:#9fd2ff; }
  .battle-screen .battle-log .log-line.dead{ color:#ff9d9d; font-weight:700; }
  .battle-screen .battle-log .log-line.critical{ color:#ffd54a; font-weight:700; }
  .battle-screen .battle-log .log-line.heal{ color:#8fe3a0; font-weight:700; }

  .battle-screen .enemy{ cursor:pointer; }
  .battle-screen .enemy.dead{ cursor:not-allowed; }
  .battle-screen .enemy.target-hint{ filter:drop-shadow(0 0 8px var(--gold-light)); }

  /* ---- 行動種類の吹き出し（物理攻撃以外の行動時に表示） ---- */
  @keyframes actionBubbleIn{
    0%{ opacity:0; transform:translate(-50%, 6px) scale(0.85); }
    15%{ opacity:1; transform:translate(-50%, 0) scale(1.05); }
    25%{ transform:translate(-50%, 0) scale(1); }
    85%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%, -6px) scale(0.95); }
  }
  .battle-screen .action-bubble{
    position:absolute;
    left:50%;
    bottom:100%;
    margin-bottom:8px;
    transform:translate(-50%, 0);
    white-space:nowrap;
    background:var(--paper);
    color:var(--ink);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:4px 12px;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    z-index:26;
    pointer-events:none;
    animation:actionBubbleIn 1.6s ease forwards;
  }
  .battle-screen .action-bubble::after{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--gold);
  }
  .battle-screen .action-bubble::before{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%) translateY(-2px);
    border:5px solid transparent;
    border-top-color:var(--paper);
    z-index:1;
  }

  /* ---- 被ダメージ数値のポップアップ表示 ---- */
  @keyframes damagePopUp{
    0%{ opacity:0; transform:translate(-50%, 0) scale(0.6); }
    12%{ opacity:1; transform:translate(-50%, -6px) scale(1.15); }
    22%{ transform:translate(-50%, -10px) scale(1); }
    75%{ opacity:1; transform:translate(-50%, -34px) scale(1); }
    100%{ opacity:0; transform:translate(-50%, -46px) scale(0.95); }
  }
  .battle-screen .damage-popup{
    position:absolute;
    left:50%;
    top:20%;
    transform:translate(-50%, 0);
    white-space:nowrap;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
    text-shadow:
      -1.5px -1.5px 0 #8f1414, 1.5px -1.5px 0 #8f1414,
      -1.5px  1.5px 0 #8f1414, 1.5px  1.5px 0 #8f1414,
      0 3px 6px rgba(0,0,0,0.5);
    font-size:20px;
    z-index:27;
    pointer-events:none;
    animation:damagePopUp 1s ease-out forwards;
  }
  .battle-screen .damage-popup.critical{
    font-size:26px;
    color:#ffe14a;
    text-shadow:
      -1.5px -1.5px 0 #a86a00, 1.5px -1.5px 0 #a86a00,
      -1.5px  1.5px 0 #a86a00, 1.5px  1.5px 0 #a86a00,
      0 0 10px rgba(255,210,60,0.85), 0 3px 6px rgba(0,0,0,0.5);
  }
  .battle-screen .damage-popup.heal{
    color:#8fe3a0;
    text-shadow:
      -1.5px -1.5px 0 #14521f, 1.5px -1.5px 0 #14521f,
      -1.5px  1.5px 0 #14521f, 1.5px  1.5px 0 #14521f,
      0 3px 6px rgba(0,0,0,0.5);
  }
  .battle-screen .damage-popup.miss{
    font-size:16px;
    color:#cfe6ff;
    text-shadow:
      -1.5px -1.5px 0 #123a5c, 1.5px -1.5px 0 #123a5c,
      -1.5px  1.5px 0 #123a5c, 1.5px  1.5px 0 #123a5c,
      0 3px 6px rgba(0,0,0,0.5);
  }

  /* ---- 攻撃対象を示す三角矢印 ---- */
  .battle-screen .target-arrow{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    line-height:1;
    color:#ff5252;
    text-shadow:0 0 6px rgba(255,82,82,0.8), 0 2px 2px rgba(0,0,0,0.5);
    z-index:25;
    animation:arrowBounce 0.6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes arrowBounce{
    0%{ transform:translateX(-50%) translateY(0); }
    100%{ transform:translateX(-50%) translateY(6px); }
  }

  /* ============================================================
     必殺技ゲージタップ選択 & 必殺技チャージ・ミニゲーム
  ============================================================ */
  .battle-screen .ult-select-hint{
    position:absolute;
    top:2%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,10,8,0.75);
    color:var(--gold-light);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:6px 18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    z-index:40;
    white-space:nowrap;
  }

  .battle-screen .action-menu-left .btn-waza.ult-armed{
    animation:pulseGlow 1s ease-in-out infinite;
  }

  .slot.ult-ready .ultgauge{
    animation:ultReadyPulse 1s ease-in-out infinite;
  }
  @keyframes ultReadyPulse{
    0%,100%{ filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4)) drop-shadow(0 0 2px rgba(255,220,120,0.6)); }
    50%{ filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4)) drop-shadow(0 0 10px rgba(255,220,120,0.95)); }
  }
  .slot.ult-selectable{
    cursor:pointer;
  }
  .slot.ult-selectable .token{
    animation:ultSelectablePulse 0.9s ease-in-out infinite;
  }
  @keyframes ultSelectablePulse{
    0%,100%{ box-shadow:0 0 0 rgba(255,220,120,0); transform:scale(1); }
    50%{ box-shadow:0 0 18px 4px rgba(255,220,120,0.85); transform:scale(1.05); }
  }

  .ult-overlay{
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(5,8,16,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .ult-overlay.active{
    opacity:1;
    pointer-events:auto;
  }
  .ult-overlay .ult-title{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold-light);
    font-size:22px;
    font-weight:900;
    letter-spacing:8px;
    text-shadow:0 0 16px rgba(232,200,116,0.6);
    z-index:2;
  }
  .ult-overlay .ult-caster-name{
    position:absolute;
    top:16%;
    left:50%;
    transform:translateX(-50%);
    color:var(--paper);
    font-size:13px;
    letter-spacing:3px;
    z-index:2;
  }
  .ult-overlay .ult-ring-wrap{
    position:relative;
    width:min(58vh, 320px);
    height:min(58vh, 320px);
  }
  .ult-overlay .ult-frame{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:5px solid var(--gold);
    background:radial-gradient(circle at 50% 40%, rgba(40,30,20,0.9), rgba(10,8,14,0.95));
    box-shadow:0 0 40px rgba(232,200,116,0.35), inset 0 0 30px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .ult-overlay .ult-progress-ring{
    position:absolute;
    inset:-5px;
    width:calc(100% + 10px);
    height:calc(100% + 10px);
    pointer-events:none;
    transform:rotate(-90deg);
  }
  .ult-overlay .ult-progress-bg{
    fill:none; stroke:rgba(255,255,255,0.15); stroke-width:5;
  }
  .ult-overlay .ult-progress-fg{
    fill:none; stroke:var(--gold-light); stroke-width:5; stroke-linecap:round;
    transition:stroke-dashoffset 0.15s linear;
  }
  .ult-overlay .ult-instruction{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    color:var(--paper);
    font-size:14px;
    font-weight:700;
    letter-spacing:2px;
    background:rgba(20,10,8,0.6);
    border:1.5px solid var(--gold);
    border-radius:12px;
    padding:6px 20px;
    white-space:nowrap;
    z-index:2;
  }

  /* ---- 「打て！」黄色円盤 ---- */
  .ult-disc{
    position:absolute;
    width:34px; height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6c8, #e8c020 65%, #b98d10);
    box-shadow:0 0 10px rgba(255,220,80,0.8);
    transform:translate(-50%,-50%);
    cursor:pointer;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .ult-disc.hit{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.8);
  }

  /* ---- 「なぞれ！」なぞり描画 ---- */
  .ult-trace-svg{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .ult-trace-target{ fill:none; stroke:rgba(255,255,255,0.35); stroke-width:4; stroke-dasharray:6 6; }
  .ult-trace-drawn{ fill:none; stroke:var(--gold-light); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }

  /* ---- 「回せ！」回転 ---- */
  .ult-spin-svg{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  .ult-spin-dot{ fill:var(--gold-light); }
  .ult-spin-track{ fill:none; stroke:rgba(255,255,255,0.2); stroke-width:4; }

  /* ---- 「合わせろ！」時計あわせ ---- */
  .ult-clock-svg{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .ult-clock-face{ fill:none; stroke:rgba(255,255,255,0.25); stroke-width:2; }
  .ult-clock-num{ fill:rgba(255,255,255,0.55); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
  .ult-clock-num.glow{
    fill:var(--gold-light);
    text-shadow:0 0 10px rgba(255,220,120,0.9);
    animation:ultClockGlow 0.6s ease-in-out infinite;
  }
  @keyframes ultClockGlow{
    0%,100%{ opacity:1; }
    50%{ opacity:0.5; }
  }
  .ult-clock-hand{
    stroke:var(--gold-light); stroke-width:4; stroke-linecap:round;
    cursor:grab;
    filter:drop-shadow(0 0 4px rgba(255,220,120,0.8));
  }

  /* ---- 必殺技発動演出 ---- */
  .ult-cast-banner{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    z-index:60;
    text-align:center;
    opacity:0;
    pointer-events:none;
  }
  .ult-cast-banner.show{
    animation:ultBannerIn 2.2s ease forwards;
  }
  @keyframes ultBannerIn{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.6); }
    12%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    20%{ transform:translate(-50%,-50%) scale(1); }
    85%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1); }
  }
  .ult-cast-banner .who{
    font-size:14px;
    letter-spacing:4px;
    color:var(--gold-light);
    margin-bottom:6px;
    text-shadow:0 0 10px rgba(0,0,0,0.8);
  }
  .ult-cast-banner .name{
    font-size:clamp(26px, 5vw, 44px);
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 20px rgba(232,200,116,0.9), 0 4px 6px rgba(0,0,0,0.8);
  }

  /* ============================================================
     「ねらう」：スコープでターゲットにピンを刺す機能
  ============================================================ */
  .battle-screen .action-menu-left .btn-nerau.nerau-armed{
    animation:pulseGlow 1s ease-in-out infinite;
  }

  /* ねらうモード中は敵の体力バーを表示する */
  .battle-screen .stage.nerau-active .enemy-member .hpbar{
    display:block !important;
  }

  .battle-screen .nerau-scope{
    position:absolute;
    width:120px;
    height:120px;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    z-index:90;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .battle-screen .nerau-scope.visible{
    opacity:1;
  }
  .battle-screen .nerau-scope svg{ width:100%; height:100%; display:block; overflow:visible; }
  .battle-screen .nerau-scope .scope-ring{
    fill:rgba(80,160,255,0.16);
    stroke:#4fa3f0;
    stroke-width:3;
    transition:fill 0.15s ease, stroke 0.15s ease;
  }
  .battle-screen .nerau-scope.locked-on .scope-ring{
    fill:rgba(255,70,70,0.22);
    stroke:#ff4646;
  }
  .battle-screen .nerau-scope .scope-cross line{
    stroke:#ff4646;
    stroke-width:2.4;
  }
  .battle-screen .nerau-scope .scope-tick{
    stroke:#4fa3f0;
    stroke-width:2;
    transition:stroke 0.15s ease;
  }
  .battle-screen .nerau-scope.locked-on .scope-tick{
    stroke:#ff4646;
  }

  /* 敵に刺さる赤いピン */
  @keyframes pinDropIn{
    0%{ transform:translate(-50%, -140%) scale(0.6); opacity:0; }
    60%{ transform:translate(-50%, -100%) scale(1.15); opacity:1; }
    100%{ transform:translate(-50%, -100%) scale(1); opacity:1; }
  }
  .battle-screen .target-pin{
    position:absolute;
    left:50%;
    top:6%;
    width:20px;
    height:20px;
    transform:translate(-50%, -100%);
    z-index:24;
    pointer-events:none;
    animation:pinDropIn 0.35s ease-out;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,0.5));
  }
  .battle-screen .target-pin svg{ width:100%; height:100%; display:block; }

  /* ねらうモード中、敵キャラをホバー/ピン留め対象として少し目立たせる */
  .battle-screen .stage.nerau-active .enemy-member:not(.dead){
    filter:drop-shadow(0 0 6px rgba(79,163,240,0.5));
  }
  .battle-screen .stage.nerau-active .enemy-member.nerau-hover:not(.dead){
    filter:drop-shadow(0 0 12px rgba(255,70,70,0.9));
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============================================================
       SCREEN 1: タイトル画面
  ============================================================ -->
  <div class="screen title-screen active" id="screen-title">
    <div class="sun"></div>
    <div class="mist"></div>
    <div class="brand">
      <div class="eyebrow">和 風 対 戦 ゲ ー ム</div>
      <h1>剣影絵巻</h1>
      <div class="sub">KEN'EI EMAKI</div>
    </div>
    <button class="kamon-btn start-btn" data-goto="screen-mode">はじめる</button>
    <div class="version">Ver 0.1</div>
  </div>

  <!-- ============================================================
       SCREEN 2: モード選択画面（CPU戦 / オンライン対戦）

document.querySelectorAll('[data-goto]').forEach(el => {
  el.addEventListener('click', () => {
    if(el.hasAttribute('disabled')) return;
    if(el.dataset.mode){ selectedMode = el.dataset.mode; updateModeLabel(); }
    showScreen(el.dataset.goto);
  });
});

============================================================ */

//   ①サボりやすさ性格：行動時に「サボる」を選びやすいかどうかを決める
//   ②行動性格：キャラ編成時にプレイヤーが選ぶ。得意な行動（物理/妖術攻撃・
//     デバフとりつき・バフとりつき・ガード）の出やすさと、ステータス補正が変わる

// ①サボりやすさ性格：超まじめ(0%)～ビビリ(80%)の7段階。値は「サボりを選ぶ確率」

function getSlackPersonality(id){

}

// ②行動性格：「特化」は対応する行動を約75%、「重視」は約50%の確率で選ぶ。
//   残りの確率は、その行動以外の3行動に均等に配分する。
//   possess時にバフ狙いかデバフ狙いかも性格で決まる（possessBias）。
//   bonuses はキャラ編成時に加算されるステータス補正。
//   hpScaling が true の性格（動じない・しんちょう）は、自身の残りHP割合が

function getActionPersonality(id){
  return ACTION_PERSONALITIES.find(p => p.id === id) || null;

// 行動性格から、このターンの行動選択の確率テーブル（physical/magic/guard/possess の4つ、合計1.0）を作る。
// hpScaling な性格は、残りHP割合が低いほど mainAction（ガード）の比率が上がる
// （満タン時は定義通りの確率、瀕死時はさらに+20%ポイント程度まで上乗せ、上限95%）。
function buildActionRateTable(actor){
  const ALL_ACTIONS = ['physical', 'magic', 'guard', 'possess'];
  const p = actor.actionSeikaku;
  if(!p){
    return { physical:0.25, magic:0.25, guard:0.25, possess:0.25 };
  }
  let mainRate = p.mainRate;
  if(p.hpScaling){
    const hpRatio = actor.maxHp > 0 ? Math.max(0, Math.min(1, actor.hp / actor.maxHp)) : 1;
    const bonus = (1 - hpRatio) * 0.20; // HPが減るほど最大+20%ポイント
    mainRate = Math.min(0.95, p.mainRate + bonus);
  }
  const others = ALL_ACTIONS.filter(a => a !== p.mainAction);
  const otherRate = (1 - mainRate) / others.length;
  const table = {};
  ALL_ACTIONS.forEach(a => { table[a] = (a === p.mainAction) ? mainRate : otherRate; });
  return table;
}


// 選ばれた行動性格のステータス補正を、キャラの基礎ステータス（およびmaxHp）に加算する
function applyPersonalityBonuses(baseStats, baseHp, actionPersonalityId){
  const stats = { chikara: baseStats.chikara, mamori: baseStats.mamori, youjutsu: baseStats.youjutsu, subayasa: baseStats.subayasa };
  let hp = baseHp;
  const p = getActionPersonality(actionPersonalityId);
  if(p && p.bonuses){
    if(p.bonuses.chikara) stats.chikara += p.bonuses.chikara;
    if(p.bonuses.mamori) stats.mamori += p.bonuses.mamori;
    if(p.bonuses.youjutsu) stats.youjutsu += p.bonuses.youjutsu;
    if(p.bonuses.subayasa) stats.subayasa += p.bonuses.subayasa;
    if(p.bonuses.hp) hp += p.bonuses.hp;
  }
  return { stats, hp };
}

const MAX_ROSTER = 6;
let selectedIds = []; // 選ばれた順が、そのまま「前衛→後衛」の並びになる
let actionSeikakuMap = {}; // charId -> 行動性格id（編成時にプレイヤーが選択）
const DEFAULT_ACTION_SEIKAKU = 'tanki';

// CPU（対戦相手）側のキャラクター。プレイヤー側と同じく6体で、前衛3体・後衛3体を編成する。
// 敵の編成は、プレイヤーと同じ characterPool（実在するキャラクター）からランダムに選ぶ。
// プレイヤーが選んだキャラとはなるべく被らないようにし、候補が足りない場合のみ被りを許容する。
function pickEnemyPool(excludeIds){
  const excluded = new Set(excludeIds || []);
  const candidates = characterPool.filter(c => !excluded.has(c.id));
  const pool = candidates.length >= MAX_ROSTER ? candidates : characterPool.slice();
  // シャッフルして先頭 MAX_ROSTER 体を採用する
  const shuffled = pool.map(c => ({ c, r: Math.random() })).sort((a, b) => a.r - b.r).map(x => x.c);
  return shuffled.slice(0, MAX_ROSTER);
}

const rosterSlotsEl = document.getElementById('rosterSlots');
const rosterPoolEl = document.getElementById('rosterPool');
const selectedCountEl = document.getElementById('selectedCount');
const toBattleBtn = document.getElementById('toBattleBtn');

function renderRosterSlots(){
  rosterSlotsEl.innerHTML = '';
  for(let i=0;i<MAX_ROSTER;i++){
    const wrapEl = document.createElement('div');
    wrapEl.className = 'roster-slot-wrap';
    const slotEl = document.createElement('div');
    const charId = selectedIds[i];
    if(charId){
      const c = characterPool.find(x => x.id === charId);
      slotEl.className = 'roster-slot filled';
      slotEl.innerHTML = `
        <div class="order-badge">${i < 3 ? '前' : '後'}${(i % 3) + 1}</div>
        <div class="token ${c.cls}">${c.label}</div>
      `;
      wrapEl.appendChild(slotEl);

      const currentSeikaku = actionSeikakuMap[charId] || DEFAULT_ACTION_SEIKAKU;
      const select = document.createElement('select');
      select.className = 'seikaku-select';
      select.innerHTML = ACTION_PERSONALITIES.map(p =>
        `<option value="${p.id}" ${p.id === currentSeikaku ? 'selected' : ''}>${p.name}</option>`
      ).join('');
      select.addEventListener('click', (e) => e.stopPropagation());
      select.addEventListener('change', (e) => {
        actionSeikakuMap[charId] = e.target.value;
      });
      wrapEl.appendChild(select);
    } else {
      slotEl.className = 'roster-slot';
      slotEl.innerHTML = `<div class="placeholder">${i+1}</div>`;
      wrapEl.appendChild(slotEl);
    }
    rosterSlotsEl.appendChild(wrapEl);
  }
}

function renderRosterPool(){
  rosterPoolEl.innerHTML = '';
  characterPool.forEach(c => {
    const isSelected = selectedIds.includes(c.id);
    const card = document.createElement('div');
    card.className = 'roster-card' + (isSelected ? ' selected' : '');
    card.innerHTML = `
      <div class="token ${c.cls}">${c.label}</div>
      <div class="name">${c.name}</div>
      <div class="rank-badge rank-${c.rank}">${c.rank}</div>
      ${c.no ? `<div class="stat">No.${c.no}${c.zoku ? ' / ' + c.zoku : ''}</div>` : ''}
      <div class="stat">ちから ${c.stats.chikara} / まもり ${c.stats.mamori}</div>
      <div class="stat">ようじゅつ ${c.stats.youjutsu} / すばやさ ${c.stats.subayasa}</div>
    `;
    card.addEventListener('click', () => toggleCharacter(c.id));
    rosterPoolEl.appendChild(card);
  });
}

function toggleCharacter(id){
  const idx = selectedIds.indexOf(id);
  if(idx >= 0){
    selectedIds.splice(idx, 1);
    delete actionSeikakuMap[id];
  } else {
    if(selectedIds.length >= MAX_ROSTER) return; // 満員
    selectedIds.push(id);
    if(!actionSeikakuMap[id]) actionSeikakuMap[id] = DEFAULT_ACTION_SEIKAKU;
  }
  renderRosterSlots();
  renderRosterPool();
  selectedCountEl.textContent = selectedIds.length;
  toBattleBtn.disabled = selectedIds.length < 3; // 前衛3体分は最低限必要
}

  if(battleInitialized) return;
