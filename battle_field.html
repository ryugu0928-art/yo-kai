      if(currentOharaiMinigameCleanup){ currentOharaiMinigameCleanup(); currentOharaiMinigameCleanup = null; }
      oharaiOverlay.classList.remove('active');
      clearOharaiFrameContent();
      onOharaiComplete(actor);
    }

    if(Math.random() < OHARAI_LUCKY_CHANCE){
      startOharaiLuckyMinigame(finishOharai);
      return;

    const kind = OHARAI_MINIGAMES[Math.floor(Math.random() * OHARAI_MINIGAMES.length)];
    if(kind === 'spin') startOharaiSpinMinigame(finishOharai);
    else if(kind === 'crush') startOharaiCrushMinigame(finishOharai);
    else if(kind === 'mash') startOharaiMashMinigame(finishOharai);
    else startOharaiSlashMinigame(finishOharai);

  // ---- 「連打！」：紫の氷塊をアイスピックでつつく。ランダムな急所を突くと大ダメージ ----
  function startOharaiMashMinigame(onComplete){
    oharaiOverlayTitle.textContent = 'おはらい「連打！」';
    oharaiInstruction.textContent = '氷をアイスピックでつつこう！';
    const NEEDED_DAMAGE = 22;   // 通常ヒットの合計換算値でクリアに必要な量
    const NORMAL_HIT = 1;
    const WEAKPOINT_HIT = 4;    // 急所ヒットは大きく進む
    const WEAKPOINT_COUNT = 3;  // 見た目ではわからない急所の数
    const WEAKPOINT_RADIUS = 16; // 判定半径(px, フレーム座標系)
    const FRAME_SIZE = 320;
    let damage = 0;
    let finished = false;

    const ice = document.createElement('div');
    ice.className = 'oharai-ice-block';
    oharaiFrame.appendChild(ice);

    const pick = document.createElement('div');
    pick.className = 'oharai-icepick';
    pick.textContent = '🧊';
    oharaiFrame.appendChild(pick);

    // 見た目ではわからないランダムな急所座標を生成
    const weakpoints = [];
    for(let i = 0; i < WEAKPOINT_COUNT; i++){
      weakpoints.push({
        x: 60 + Math.random() * (FRAME_SIZE - 120),
        y: 60 + Math.random() * (FRAME_SIZE - 120),
        used: false
      });
    }

    function showHitEffect(x, y, isWeak){
      const fx = document.createElement('div');
      fx.className = isWeak ? 'oharai-ice-crack weak' : 'oharai-ice-crack';
      fx.style.left = x + 'px';
      fx.style.top = y + 'px';
      oharaiFrame.appendChild(fx);
      setTimeout(() => { if(fx.parentNode) fx.parentNode.removeChild(fx); }, isWeak ? 500 : 300);
      if(isWeak){
        oharaiInstruction.textContent = '急所ヒット！ 効果てきめん！';
        ice.classList.add('crit-flash');
        setTimeout(() => ice.classList.remove('crit-flash'), 220);
        setTimeout(() => { if(!finished) oharaiInstruction.textContent = '氷をアイスピックでつつこう！'; }, 500);
      }
    }

    function onDown(ev){
      ev.preventDefault();
      if(finished) return;
      const rect = oharaiFrame.getBoundingClientRect();
      const x = ((ev.clientX - rect.left) / rect.width) * FRAME_SIZE;
      const y = ((ev.clientY - rect.top) / rect.height) * FRAME_SIZE;

      pick.style.left = x + 'px';
      pick.style.top = y + 'px';
      pick.classList.add('jab');
      setTimeout(() => pick.classList.remove('jab'), 120);

      let hitWeak = false;
      for(const wp of weakpoints){
        if(wp.used) continue;
        const dx = x - wp.x, dy = y - wp.y;
        if(Math.sqrt(dx*dx + dy*dy) <= WEAKPOINT_RADIUS){
          wp.used = true;
          hitWeak = true;
          break;
        }
      }

      damage += hitWeak ? WEAKPOINT_HIT : NORMAL_HIT;
      showHitEffect(x, y, hitWeak);
      setOharaiProgress(damage / NEEDED_DAMAGE);

      // ダメージが蓄積するほど氷にヒビが増えていく演出
      const crackStage = Math.min(3, Math.floor((damage / NEEDED_DAMAGE) * 3));
      ice.classList.toggle('cracked-1', crackStage >= 1);
      ice.classList.toggle('cracked-2', crackStage >= 2);
      ice.classList.toggle('cracked-3', crackStage >= 3);

      if(damage >= NEEDED_DAMAGE){
        finished = true;
        cleanup();
        shatterIceAndComplete();
      }
    }
    oharaiFrame.addEventListener('pointerdown', onDown);

    // 紫の氷を割って砕け散らせてからおはらい完了とする
    function shatterIceAndComplete(){
      oharaiInstruction.textContent = '氷が割れた！';
      pick.style.display = 'none';
      ice.classList.add('shatter');

      // 割れた瞬間に飛び散る氷の破片を生成
      const SHARD_COUNT = 14;
      for(let i = 0; i < SHARD_COUNT; i++){
        const shard = document.createElement('div');
        shard.className = 'oharai-ice-shard';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 90;
        shard.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
        shard.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
        shard.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        shard.style.left = (50 + (Math.random()*30 - 15)) + '%';
        shard.style.top = (50 + (Math.random()*30 - 15)) + '%';
        oharaiFrame.appendChild(shard);
      }
      setOharaiProgress(1);
      setTimeout(onComplete, 550);
    }

    function cleanup(){
      oharaiFrame.removeEventListener('pointerdown', onDown);
    }
    currentOharaiMinigameCleanup = cleanup;
  }

  // ---- 「斬れ！」：枠内のくすんだ鎖を何本かスワイプで断ち切る。切れ目を狙えば一発 ----
  function startOharaiSlashMinigame(onComplete){
    oharaiOverlayTitle.textContent = 'おはらい「斬れ！」';
    oharaiInstruction.textContent = '鎖をまたぐようにスワイプして斬ろう！';
    const MIN_DISTANCE = 60;   // これ未満の移動距離はスワイプと認めない
    const MAX_DURATION = 600;  // これより時間がかかったスワイプは認めない（ms）
    const FRAME_SIZE = 320;
    const CHAIN_COUNT = 3 + Math.floor(Math.random() * 2); // 3〜4本
    const CHAIN_COLORS = ['#6b6458', '#5c6b5e', '#5f5a6b', '#6b5c52', '#565f6b'];
    let finished = false;
    let chainsRemaining = CHAIN_COUNT;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${FRAME_SIZE} ${FRAME_SIZE}`);
    svg.classList.add('oharai-slash-svg');
    oharaiFrame.appendChild(svg);

    // ---- 鎖を生成：枠内にランダムな向きで配置。各鎖はいくつかのリンクに分割し、
    //      そのうち1つの区間を「切れ目」として、そこを斬れば一発で切断できる。
    const chains = [];
    function buildChain(){
      const margin = 46;
      const cx = margin + Math.random() * (FRAME_SIZE - margin*2);
      const cy = margin + Math.random() * (FRAME_SIZE - margin*2);
      const angle = Math.random() * Math.PI;
      const length = 150 + Math.random() * 70;
      const dx = Math.cos(angle), dy = Math.sin(angle);
      const x1 = cx - dx*length/2, y1 = cy - dy*length/2;
      const x2 = cx + dx*length/2, y2 = cy + dy*length/2;

      const LINK_COUNT = 6;
      const cutIndex = Math.floor(Math.random() * LINK_COUNT); // この区間が切れ目
      const color = CHAIN_COLORS[Math.floor(Math.random() * CHAIN_COLORS.length)];

      const group = document.createElementNS(svgNS, 'g');
      group.classList.add('oharai-chain-group');
      const links = [];
      let hitsNeeded = 3; // 通常は複数回スワイプで断ち切る
      let hitsTaken = 0;
      let severed = false;

      for(let i = 0; i < LINK_COUNT; i++){
        const t0 = i / LINK_COUNT, t1 = (i+1) / LINK_COUNT;
        const lx1 = x1 + (x2-x1)*t0, ly1 = y1 + (y2-y1)*t0;
        const lx2 = x1 + (x2-x1)*t1, ly2 = y1 + (y2-y1)*t1;
        const link = document.createElementNS(svgNS, 'line');
        link.setAttribute('x1', lx1); link.setAttribute('y1', ly1);
        link.setAttribute('x2', lx2); link.setAttribute('y2', ly2);
        link.classList.add('oharai-chain-link');
        link.style.stroke = color;
        if(i === cutIndex) link.classList.add('cutpoint');
        group.appendChild(link);
        links.push({ el: link, x1: lx1, y1: ly1, x2: lx2, y2: ly2, isCut: i === cutIndex });
      }
      svg.appendChild(group);

      chains.push({ group, links, x1, y1, x2, y2, hitsNeeded, hitsTaken: 0, severed: false });
    }
    for(let i = 0; i < CHAIN_COUNT; i++) buildChain();

    function segmentsIntersect(p1, p2, p3, p4){
      function cross(ax,ay,bx,by){ return ax*by - ay*bx; }
      const d1x = p2[0]-p1[0], d1y = p2[1]-p1[1];
      const d2x = p4[0]-p3[0], d2y = p4[1]-p3[1];
      const denom = cross(d1x, d1y, d2x, d2y);
      if(Math.abs(denom) < 1e-6) return false;
      const t = cross(p3[0]-p1[0], p3[1]-p1[1], d2x, d2y) / denom;
      const u = cross(p3[0]-p1[0], p3[1]-p1[1], d1x, d1y) / denom;
      return t >= 0 && t <= 1 && u >= 0 && u <= 1;
    }

    function severChain(chain){
      chain.severed = true;
      chain.group.classList.add('severed');
      chainsRemaining--;
      setOharaiProgress((CHAIN_COUNT - chainsRemaining) / CHAIN_COUNT);
      if(chainsRemaining <= 0){
        finished = true;
        cleanup();
        setTimeout(onComplete, 250);
      }
    }

    let startPt = null;
    let startTime = 0;

    function svgPoint(ev){
      const rect = svg.getBoundingClientRect();
      const x = ((ev.clientX - rect.left) / rect.width) * FRAME_SIZE;
      const y = ((ev.clientY - rect.top) / rect.height) * FRAME_SIZE;
      return [x, y];
    }
    function onDown(ev){
      if(finished) return;
      startPt = svgPoint(ev);
      startTime = performance.now();
    }
    function onUp(ev){
      if(finished || !startPt) return;
      const endPt = svgPoint(ev);
      const dt = performance.now() - startTime;
      const dx = endPt[0]-startPt[0], dy = endPt[1]-startPt[1];
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist >= MIN_DISTANCE && dt <= MAX_DURATION){
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', startPt[0]); line.setAttribute('y1', startPt[1]);
        line.setAttribute('x2', endPt[0]); line.setAttribute('y2', endPt[1]);
        line.classList.add('oharai-slash-line');
        svg.appendChild(line);
        setTimeout(() => { if(line.parentNode) line.parentNode.removeChild(line); }, 350);

        // このスワイプが跨いだ鎖のリンクを判定
        chains.forEach(chain => {
          if(chain.severed) return;
          let crossedCut = false;
          let crossedAny = false;
          chain.links.forEach(link => {
            if(segmentsIntersect(startPt, endPt, [link.x1, link.y1], [link.x2, link.y2])){
              crossedAny = true;
              if(link.isCut) crossedCut = true;
            }
          });
          if(crossedCut){
            // 切れ目をピンポイントで斬った → 一発で切断
            severChain(chain);
          } else if(crossedAny){
            chain.hitsTaken++;
            chain.group.classList.add('nicked');
            setTimeout(() => chain.group.classList.remove('nicked'), 150);
            if(chain.hitsTaken >= chain.hitsNeeded){
              severChain(chain);
            }
          }
        });
      }
      startPt = null;
    }
    svg.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);

    function cleanup(){
      svg.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointerup', onUp);
    }
    currentOharaiMinigameCleanup = cleanup;
  }

  // ---- 「超ラッキー！」：低確率で出現。モヤは無く、金色オーブをタップするだけで完了 ----
  function startOharaiLuckyMinigame(onComplete){
    oharaiOverlayTitle.textContent = 'おはらい「超ラッキー！」';
    oharaiInstruction.textContent = '光るオーブをタップ！';
    // このミニゲームだけはモヤをあらかじめ完全に晴らしておく
    if(oharaiMist) oharaiMist.style.opacity = '0';
    oharaiProgressFg.style.strokeDashoffset = '0';

    const orb = document.createElement('div');
    orb.className = 'oharai-lucky-orb';
    oharaiFrame.appendChild(orb);

    let finished = false;
    function onDown(ev){
      ev.stopPropagation();
      if(finished) return;
      finished = true;
      cleanup();
      setTimeout(onComplete, 150);
    }
    orb.addEventListener('pointerdown', onDown);

    function cleanup(){
      orb.removeEventListener('pointerdown', onDown);
    }
    currentOharaiMinigameCleanup = cleanup;
  }

  logLine('自動戦闘を開始します。前衛キャラがすばやさ順に行動します。');
  battleLoopTimerId = setTimeout(processTurnQueue, TURN_INTERVAL_MS);
}
</script>
<script>
  // ============================================================
  // スマホを横向きにしたら全画面表示にする
  // （全画面APIはユーザー操作の中でしか呼べないブラウザが多いため、
  //   画面の向き変化イベントに加えて、最初のタップ・クリックでも試みる）
  // ============================================================
  (function(){
    function isLandscape(){
      if(screen.orientation && screen.orientation.type){
        return screen.orientation.type.indexOf('landscape') === 0;
      }
      return window.innerWidth > window.innerHeight;
    }
    function requestFullscreenSafe(){
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if(req && !document.fullscreenElement && !document.webkitFullscreenElement){
        req.call(el).catch(() => {});
      }
    }
    function exitFullscreenSafe(){
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if(exit && (document.fullscreenElement || document.webkitFullscreenElement)){
        exit.call(document).catch(() => {});
      }
    }
    function handleOrientationChange(){
      if(isLandscape()){
        requestFullscreenSafe();
      } else {
        exitFullscreenSafe();
      }
    }
    if(screen.orientation && screen.orientation.addEventListener){
      screen.orientation.addEventListener('change', handleOrientationChange);
    } else {
      window.addEventListener('orientationchange', handleOrientationChange);
    }
    // 一部のブラウザは向き変化イベントの中でrequestFullscreenを拒否するため、
    // 最初のタップ／クリック時にも横向きなら全画面化を試みる。
    ['touchend', 'click'].forEach(evt => {
      window.addEventListener(evt, function onceHandler(){
        if(isLandscape()) requestFullscreenSafe();
      }, { once:true, passive:true });
    });
    // 起動時点ですでに横向きだった場合にも備える
    window.addEventListener('load', () => { if(isLandscape()) requestFullscreenSafe(); });
  })();
</script>
