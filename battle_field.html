<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>対戦フィールド</title>
<style>
  :root{
    --gold: #c9a13b;
    --gold-light: #e8c874;
    --lacquer-red: #8f2a2a;
    --lacquer-red-dark: #6b1e1e;
    --tatami: #cbb373;
    --tatami-line: #a68f4f;
    --sky-top: #f4c9d6;
    --sky-bottom: #f9e3d3;
    --ink: #2c1a12;
    --paper: #fbf3e2;
    --indigo: #1f2f4d;
    --indigo-dark: #131f34;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  }

  /* ============================================================
     画面切り替え：.screen を重ねて、.active のものだけ見せる
  ============================================================ */
  .app{ position:relative; width:100vw; height:100vh; overflow:hidden; background:var(--indigo-dark); }
  .screen{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.45s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ============================================================
     共通パーツ
  ============================================================ */
  .kamon-btn{
    appearance:none;
    border:2px solid var(--gold);
    background:linear-gradient(180deg, var(--paper), #f0e4c8);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    letter-spacing:2px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .kamon-btn:hover{ transform:translateY(-2px); box-shadow:0 9px 18px rgba(0,0,0,0.3); }
  .kamon-btn:active{ transform:translateY(0px) scale(0.98); box-shadow:0 4px 8px rgba(0,0,0,0.25); }
  .kamon-btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }

  .back-link{
    position:absolute;
    top:20px; left:20px;
    z-index:30;
    background:rgba(20,10,8,0.4);
    color:var(--paper);
    border:1.5px solid var(--gold);
    border-radius:999px;
    padding:8px 18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
  }
  .back-link:hover{ background:rgba(20,10,8,0.6); }

  /* ============================================================
     SCREEN 1: タイトル画面
  ============================================================ */
  .title-screen{
    background:
      radial-gradient(circle at 50% 20%, rgba(232,200,116,0.18), transparent 55%),
      linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .title-screen .sun{
    position:absolute;
    top:14%;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, var(--gold-light), var(--lacquer-red) 70%);
    box-shadow:0 0 80px rgba(232,200,116,0.35);
    opacity:0.9;
  }
  .title-screen .mist{
    position:absolute; left:0; right:0; bottom:0; height:40%;
    background:linear-gradient(to top, rgba(19,31,52,0.95), transparent);
  }
  .title-screen .brand{
    position:relative;
    z-index:2;
    text-align:center;
    color:var(--paper);
  }
  .title-screen .brand .eyebrow{
    font-size:13px;
    letter-spacing:8px;
    color:var(--gold-light);
    margin-bottom:14px;
  }
  .title-screen .brand h1{
    margin:0;
    font-size:clamp(40px, 8vw, 76px);
    letter-spacing:14px;
    font-weight:900;
    color:var(--paper);
    text-shadow:0 0 30px rgba(232,200,116,0.4), 0 4px 0 var(--lacquer-red-dark);
  }
  .title-screen .brand .sub{
    margin-top:10px;
    font-size:14px;
    letter-spacing:6px;
    color:rgba(251,243,226,0.65);
  }
  .title-screen .start-btn{
    position:relative;
    z-index:2;
    margin-top:56px;
    padding:16px 56px;
    font-size:18px;
    animation:pulseGlow 2.2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 6px 14px rgba(0,0,0,0.25); }
    50%{ box-shadow:0 6px 26px rgba(232,200,116,0.55); }
  }
  .title-screen .version{
    position:absolute;
    bottom:18px; right:22px;
    color:rgba(251,243,226,0.4);
    font-size:11px;
    letter-spacing:2px;
    z-index:2;
  }

  /* ============================================================
     SCREEN 2: モード選択画面
  ============================================================ */
  .mode-screen{
    background:linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:36px;
  }
  .mode-screen .heading{
    color:var(--paper);
    text-align:center;
  }
  .mode-screen .heading .eyebrow{
    font-size:12px;
    letter-spacing:6px;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .mode-screen .heading h2{
    margin:0;
    font-size:clamp(24px, 4vw, 34px);
    letter-spacing:6px;
    font-weight:900;
  }
  .mode-grid{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    justify-content:center;
    padding:0 20px;
  }
  .mode-card{
    width:260px;
    min-height:220px;
    background:linear-gradient(180deg, rgba(251,243,226,0.06), rgba(251,243,226,0.02));
    border:2px solid var(--gold);
    border-radius:18px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--paper);
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .mode-card:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 30px rgba(0,0,0,0.35);
    border-color:var(--gold-light);
  }
  .mode-card .icon-badge{
    width:64px; height:64px;
    border-radius:50%;
    margin-bottom:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    color:#fff;
    border:3px solid var(--paper);
    box-shadow:0 6px 14px rgba(0,0,0,0.35);
  }
  .mode-card.cpu .icon-badge{ background:radial-gradient(circle at 35% 30%, #e08b8b, #a83a3a); }
  .mode-card.online .icon-badge{ background:radial-gradient(circle at 35% 30%, #8bb8e0, #3a5fa8); }
  .mode-card h3{
    margin:0 0 8px;
    font-size:17px;
    letter-spacing:3px;
  }
  .mode-card p{
    margin:0;
    font-size:12.5px;
    line-height:1.7;
    color:rgba(251,243,226,0.7);
  }

  /* ============================================================
     SCREEN 3: キャラクター編成画面
  ============================================================ */
  .roster-screen{
    background:linear-gradient(to bottom, var(--indigo) 0%, var(--indigo-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:70px 20px 24px;
    overflow-y:auto;
  }
  /* flexコンテナの子要素はデフォルトで縮小されうるため、
     縦に並ぶ全ブロックを明示的に縮小禁止にして高さ崩れ・重なりを防ぐ */
  .roster-screen > *{
    flex-shrink:0;
  }
  .roster-screen .heading{
    color:var(--paper);
    text-align:center;
    margin-bottom:26px;
  }
  .roster-screen .heading .eyebrow{
    font-size:12px;
    letter-spacing:6px;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .roster-screen .heading h2{
    margin:0;
    font-size:clamp(22px, 4vw, 30px);
    letter-spacing:5px;
    font-weight:900;
  }

  .roster-slots{
    position:relative;
    width:400px;
    height:460px;
    margin:0 auto 20px;
    overflow:visible;
    flex-shrink:0;
  }
  .roster-slots-center{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    pointer-events:none;
  }
  .roster-slots-center .ring{
    position:absolute;
    top:50%; left:50%;
    border-radius:50%;
    border:1.5px dashed rgba(232,200,116,0.25);
    transform:translate(-50%, -50%);
  }
  .roster-slots-center .ring.single{ width:260px; height:260px; }
  .roster-zoku-bridges{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    pointer-events:none;
    z-index:1; /* 中央のガイドリングより上、トークン本体より下 */
    overflow:visible;
  }
  .roster-slot-wrap{
    position:absolute;
    top:0; left:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    transform:translate(-50%, -50%);
  }
  .seikaku-select{
    width:78px;
    font-size:10px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--gold);
    border-radius:8px;
    padding:2px 2px;
    text-align:center;
    cursor:pointer;
  }
  .equip-select{
    width:78px;
    font-size:10px;
    font-family:inherit;
    color:var(--ink);
    background:#e8e0c8;
    border:1.5px solid var(--gold);
    border-radius:8px;
    padding:2px 2px;
    text-align:center;
    cursor:pointer;
  }
  .roster-slot{
    width:78px; height:78px;
    border-radius:50%;
    border:3px dashed var(--gold);
    background:rgba(251,243,226,0.04);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .roster-slot.filled{
    border-style:solid;
    background:transparent;
  }
  .roster-slot .placeholder{
    color:rgba(251,243,226,0.35);
    font-size:11px;
    letter-spacing:1px;
  }
  .roster-slot .token{
    width:100%; height:100%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:24px; color:#fff;
    border:3px solid var(--paper);
    box-shadow:0 6px 14px rgba(0,0,0,0.3);
  }
  .roster-slot .order-badge{
    position:absolute;
    top:-8px; left:-8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--lacquer-red);
    border:2px solid var(--paper);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .roster-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:18px;
    flex-shrink:0;
  }
  .sort-control{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:rgba(251,243,226,0.75);
    letter-spacing:1px;
    flex-shrink:0;
  }
  .sort-control select{
    font-family:inherit;
    font-size:12.5px;
    color:var(--paper);
    background:rgba(255,255,255,0.06);
    border:1.5px solid var(--gold);
    border-radius:10px;
    padding:6px 10px;
    cursor:pointer;
  }
  .sort-control select:focus{ outline:none; border-color:var(--gold-light); }
  .view-mode-switch{
    display:flex;
    gap:0;
    border:1.5px solid var(--gold);
    border-radius:20px;
    overflow:hidden;
    flex-shrink:0;
  }
  .view-mode-btn{
    display:inline-block;
    font-family:inherit;
    font-size:12px;
    line-height:1.6;
    letter-spacing:1px;
    color:var(--paper);
    background:transparent;
    border:none;
    padding:8px 22px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .view-mode-btn.active{
    background:var(--gold);
    color:var(--indigo-dark);
    font-weight:700;
  }
  .roster-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    max-width:760px;
    margin-bottom:30px;
  }
  .roster-list-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(251,243,226,0.05);
    border:1.5px solid var(--gold);
    border-radius:12px;
    padding:8px 16px;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .roster-list-row:hover{ border-color:var(--gold-light); }
  .roster-list-row.selected{
    background:rgba(232,200,116,0.16);
    border-color:var(--gold-light);
  }
  .roster-list-row .token{
    width:42px; height:42px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#fff;
    border:2px solid var(--paper);
  }
  .roster-list-row .name{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--paper);
    width:110px;
    flex-shrink:0;
  }
  .roster-list-row .rank-badge{
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:10px;
    font-weight:700;
    flex-shrink:0;
  }
  .roster-list-row .stat{
    font-size:11px;
    color:rgba(251,243,226,0.6);
    white-space:nowrap;
  }
  .roster-pool{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:14px;
    width:100%;
    max-width:760px;
    margin-top:20px;
    margin-bottom:30px;
  }
  .roster-card{
    background:rgba(251,243,226,0.05);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:14px 10px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--paper);
    transition:transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .roster-card:hover{ transform:translateY(-3px); border-color:var(--gold-light); }
  .roster-card.selected{
    border-color:#7ed957;
    background:rgba(126,217,87,0.12);
  }
  .roster-card .token{
    width:56px; height:56px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:#fff;
    border:3px solid var(--paper);
  }
  .roster-card .name{ font-size:12.5px; font-weight:700; letter-spacing:1px; }
  .roster-card .rank-badge{
    display:inline-block;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    padding:1px 8px;
    border-radius:999px;
    margin:2px 0 4px;
    color:#1a1108;
    background:var(--gold-light);
  }
  .roster-card .rank-badge.rank-S{ background:linear-gradient(135deg,#ffe27a,#ff9d3d); color:#3a1a00; }
  .roster-card .rank-badge.rank-A{ background:#f0c46a; }
  .roster-card .rank-badge.rank-B{ background:#cfe08b; }
  .roster-card .rank-badge.rank-C{ background:#9fd2e0; }
  .roster-card .rank-badge.rank-D{ background:#b8b8d0; }
  .roster-card .rank-badge.rank-E{ background:#c9a3a3; }
  .roster-list-row .rank-badge.rank-S{ background:linear-gradient(135deg,#ffe27a,#ff9d3d); color:#3a1a00; }
  .roster-list-row .rank-badge.rank-A{ background:#f0c46a; }
  .roster-list-row .rank-badge.rank-B{ background:#cfe08b; }
  .roster-list-row .rank-badge.rank-C{ background:#9fd2e0; }
  .roster-list-row .rank-badge.rank-D{ background:#b8b8d0; }
  .roster-list-row .rank-badge.rank-E{ background:#c9a3a3; }
  .roster-card .stat{ font-size:10.5px; color:rgba(251,243,226,0.6); }

  .roster-footer{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .roster-footer .count{
    color:var(--paper);
    font-size:13px;
    letter-spacing:1px;
  }
  .roster-footer .count strong{ color:var(--gold-light); font-size:16px; }

  /* ============================================================
     SCREEN 4: 対戦フィールド（既存の実装）
  ============================================================ */
  .battle-screen .stage{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 42%, var(--sky-bottom) 42%);
  }

  .battle-screen .floor{
    position:absolute;
    left:50%;
    top:38%;
    width:180%;
    height:60%;
    margin-left:-90%;
    background:
      repeating-linear-gradient(100deg, transparent 0 40px, var(--tatami-line) 40px 43px),
      repeating-linear-gradient(80deg, transparent 0 40px, var(--tatami-line) 40px 43px),
      var(--tatami);
    clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
    box-shadow: inset 0 0 200px rgba(0,0,0,0.2);
    z-index:1;
  }

  .battle-screen .horizon-haze{
    position:absolute;
    left:0; right:0; top:34%;
    height:10%;
    background:linear-gradient(to bottom, rgba(249,227,211,0.9), rgba(249,227,211,0));
    pointer-events:none;
    z-index:2;
  }
  .battle-screen .vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 12vw rgba(0,0,0,0.4);
    pointer-events:none;
    z-index:20;
  }

  /* ============================================================
     妖術攻撃の技名別エフェクト演出
  ============================================================ */
  #magicFxLayer{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:18; /* キャラより上、ビネットより下 */
  }
  .magic-fx{ position:absolute; will-change:transform, opacity; }
  /* 大滝の術／水流の術：画面上から勢いよく流れ落ちる水の柱 */
  .magic-fx-waterfall{
    width:38px;
    background:linear-gradient(to bottom, rgba(210,240,255,0.1), rgba(120,190,240,0.85) 30%, rgba(70,150,220,0.95));
    border-radius:0 0 40% 40% / 0 0 60% 60%;
    box-shadow:0 0 18px 6px rgba(120,200,255,0.6);
  }
  .magic-fx-splash{
    width:90px; height:36px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(210,240,255,0.9), rgba(120,190,240,0.1) 70%);
  }
  /* いん石の術／落石の術：斜め上から落下する岩塊 */
  .magic-fx-rock{
    width:26px; height:26px;
    border-radius:34% 66% 60% 40% / 50% 40% 60% 50%;
    background:radial-gradient(circle at 35% 30%, #b08a5f, #6b4a2f 70%);
    box-shadow:0 0 10px 2px rgba(80,50,20,0.6);
  }
  /* 吹雪の術／氷結の術：四方から収束する氷片 */
  .magic-fx-ice{
    width:16px; height:16px;
    background:linear-gradient(135deg, #eafcff, #9fe3f7);
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    box-shadow:0 0 8px 2px rgba(160,230,255,0.8);
  }
  /* れんごくの術：足元から立ち上る炎 */
  .magic-fx-flame{
    width:20px; height:34px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:linear-gradient(to top, #ff7a00, #ffd23f 60%, rgba(255,210,63,0));
    filter:blur(0.3px);
  }
  /* 嵐の術：対象を取り巻く風の渦 */
  .magic-fx-wind{
    width:70px; height:70px;
    border-radius:50%;
    border:5px solid rgba(210,255,220,0.75);
    border-top-color:transparent;
    border-bottom-color:transparent;
  }
  /* 雷神の術：空から落ちる稲妻 */
  .magic-fx-bolt{
    width:10px;
    background:linear-gradient(to bottom, rgba(255,255,200,0.2), #fff8a0 40%, #fff);
    clip-path:polygon(40% 0%, 100% 0%, 55% 45%, 90% 45%, 20% 100%, 40% 55%, 0% 55%);
    box-shadow:0 0 20px 8px rgba(255,240,150,0.8);
  }
  /* 死神の術：対象を斬りつける暗い斬撃 */
  .magic-fx-slash{
    width:140px; height:10px;
    background:linear-gradient(90deg, rgba(120,0,160,0), #cfa8ff 45%, #6a1fb0 55%, rgba(120,0,160,0));
    box-shadow:0 0 14px 4px rgba(150,60,220,0.7);
  }
  /* 回復の術／極楽の術：柔らかい光の粒子が舞い上がる */
  .magic-fx-light{
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle, #fff9d8, #ffe27a 70%, rgba(255,226,122,0));
    box-shadow:0 0 10px 3px rgba(255,226,122,0.8);
  }
  /* 吸収の術など：小さな玉が対象からキャラへ飛んでHPを吸い取る */
  .magic-fx-orb{
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle, #ffe0f0, #ff6fae 70%, rgba(255,111,174,0));
    box-shadow:0 0 10px 3px rgba(255,111,174,0.8);
  }
  /* 汎用（未分類の妖術）：対象を中心に弾ける魔法陣風のバースト */
  .magic-fx-burst{
    width:90px; height:90px;
    border-radius:50%;
    border:4px solid rgba(230,200,255,0.8);
    box-shadow:0 0 16px 4px rgba(230,200,255,0.6);
  }

  .battle-screen .backdrop{
    position:absolute;
    left:50%;
    top:4%;
    transform:translateX(-50%);
    z-index:3;
  }
  .battle-screen .backdrop .arch{
    width:34vw;
    max-width:520px;
    height:14vw;
    max-height:150px;
    border:1.2vw solid var(--lacquer-red);
    border-bottom:none;
    border-radius:60% 60% 0 0 / 100% 100% 0 0;
    background:rgba(143,42,42,0.15);
  }

  .battle-screen .pillar{
    position:absolute;
    top:6%;
    width:1.6vw;
    max-width:26px;
    height:22vh;
    background:linear-gradient(var(--lacquer-red), var(--lacquer-red-dark));
    border-radius:6px;
    z-index:3;
  }
  .battle-screen .pillar.left{left:5%;}
  .battle-screen .pillar.right{right:5%;}

  .battle-screen .slot{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    top:0; left:0;
    transform:translate(-50%, -50%);
    z-index:10;
    transition: left 0.5s cubic-bezier(.4,.1,.3,1),
                top 0.5s cubic-bezier(.4,.1,.3,1);
    will-change: left, top;
  }
  .battle-screen .slot.party-member{
    pointer-events:none;
  }
  /* 必殺技ゲージ選択モード中は、満タンの味方キャラをタップできるようにする */
  .battle-screen .slot.party-member.ult-selectable{
    pointer-events:auto;
    z-index:20;
  }

  .battle-screen .token{
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    border:4px solid var(--paper);
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
    transition: width 0.5s cubic-bezier(.4,.1,.3,1),
                height 0.5s cubic-bezier(.4,.1,.3,1),
                font-size 0.5s cubic-bezier(.4,.1,.3,1),
                box-shadow 0.5s ease;
  }

  .battle-screen .nameplate{
    margin-top:8px;
    background:var(--paper);
    color:var(--ink);
    padding:2px 10px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    border:2px solid var(--gold);
    white-space:nowrap;
    transition: opacity 0.3s ease, font-size 0.5s ease;
  }

  .battle-screen .hpbar{
    margin-top:6px;
    width:80px;
    height:8px;
    background:rgba(0,0,0,0.25);
    border-radius:4px;
    overflow:visible;
    border:1px solid rgba(0,0,0,0.3);
    transition: width 0.5s ease, opacity 0.3s ease, margin-top 0.5s ease;
    position:relative;
  }
  .battle-screen .hpbar > div:last-child{
    height:100%;
    max-width:100%;
    border-radius:3px;
    overflow:hidden;
    background:linear-gradient(90deg,#f2a0c4,#d84a8c);
  }

  /* ---- 必殺技ゲージ（しずく型、体力バーの左に少し重ねる） ---- */
  .battle-screen .ultgauge{
    position:absolute;
    left:-11px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    z-index:2;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    transition: width 0.5s ease, height 0.5s ease, left 0.5s ease;
  }
  .battle-screen .ultgauge svg{ width:100%; height:100%; display:block; }
  .battle-screen .ultgauge .ult-bg{
    fill:rgba(10,20,40,0.55);
    stroke:rgba(255,255,255,0.5);
    stroke-width:3;
  }
  .battle-screen .ultgauge .ult-fill{
    fill:#4fa3f0;
  }
  .battle-screen .ultgauge.debuffed .ult-fill{
    fill:#8a4fd6;
  }
  .battle-screen .ultgauge.debuffed .ult-bg{
    stroke:rgba(180,140,230,0.7);
  }
  .battle-screen .ultgauge clipPath rect{
    transition: y 0.1s linear, height 0.1s linear;
  }

  .battle-screen .enemy .token{ width:64px; height:64px; font-size:22px; }
  .battle-screen .enemy .nameplate{ font-size:11px; }
  .battle-screen .enemy .hpbar{ width:56px; }

  .battle-screen .slot.enemy-member{ pointer-events:auto; cursor:pointer; }

  .battle-screen .enemy-member.state-front .token{ width:88px; height:88px; font-size:26px; }
  .battle-screen .enemy-member.state-front .nameplate{ font-size:13px; opacity:1; }

  /* 敵キャラは体力メーター・必殺技ゲージを表示しない */
  .battle-screen .enemy-member .hpbar,
  .battle-screen .enemy-member .ultgauge{
    display:none;
  }

  /* 敵の後衛は表示しない */
  .battle-screen .enemy-member.state-reserve{
    display:none;
  }
  .battle-screen .enemy-member.dead{ cursor:not-allowed; }

  /* ---- 気絶＝青い人魂化演出 ---- */
  @keyframes soulFloat{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-8px) rotate(3deg); }
  }
  @keyframes soulFlicker{
    0%,100%{ opacity:0.85; }
    50%{ opacity:1; }
  }
  .slot.dead .token{
    width:34px !important;
    height:34px !important;
    font-size:0 !important;
    background:radial-gradient(circle at 40% 30%, #d8ecff, #5aa8e8 55%, #2f6fb0 100%) !important;
    border-color:#bfe3ff;
    box-shadow:0 0 14px 4px rgba(90,170,255,0.65), 0 8px 14px rgba(0,0,0,0.3);
    color:transparent;
    position:relative;
    filter:none;
    opacity:1;
    animation:soulFloat 2.4s ease-in-out infinite, soulFlicker 1.6s ease-in-out infinite;
    /* 人魂らしい丸い雫型に */
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .slot.dead .token::before{
    content:'';
    position:absolute;
    top:14%; left:50%;
    width:22%; height:22%;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
    transform:translateX(-50%);
    filter:blur(1px);
  }
  .slot.dead .token::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
  }
  .slot.dead .nameplate{ opacity:0.55; }
  .slot.dead .hpbar{ opacity:0.4; }

  .battle-screen .party-member.state-front .token{ width:110px; height:110px; font-size:32px; }
  .battle-screen .party-member.state-front .nameplate{ font-size:15px; opacity:1; }
  .battle-screen .party-member.state-front .hpbar{ width:100px; opacity:1; }

  /* ---- バフ／デバフのオーラ ---- */
  @keyframes auraBuffPulse{
    0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 14px 5px rgba(255,183,59,0.8), 0 0 26px 10px rgba(255,140,20,0.45); }
    50%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 20px 8px rgba(255,200,90,0.95), 0 0 36px 14px rgba(255,150,30,0.6); }
  }
  @keyframes auraDebuffPulse{
    0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 14px 5px rgba(120,70,150,0.75), 0 0 26px 10px rgba(70,35,95,0.5); }
    50%{ box-shadow:0 8px 18px rgba(0,0,0,0.35), 0 0 18px 7px rgba(140,85,170,0.85), 0 0 32px 12px rgba(85,45,115,0.6); }
  }
  .slot.aura-buff .token{
    animation: auraBuffPulse 1.6s ease-in-out infinite;
  }
  .slot.aura-debuff .token{
    animation: auraDebuffPulse 1.8s ease-in-out infinite;
  }
  /* デバフのオーラを優先表示（同時付与時はデバフのアニメーションのみ有効） */
  .slot.aura-buff.aura-debuff .token{
    animation: auraDebuffPulse 1.8s ease-in-out infinite;
  }

  .battle-screen .party-member.state-reserve .token{
    width:34px; height:34px; font-size:13px;
    border:2px solid var(--gold-light);
    box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  .battle-screen .party-member.state-reserve .nameplate{ opacity:0; font-size:0; padding:0; border:0; margin-top:0; }
  /* 後衛でも体力メーターは表示したままにする（小さいトークンに合わせて縮小） */
  .battle-screen .party-member.state-reserve .hpbar{ width:36px; height:5px; margin-top:4px; opacity:1; }
  .battle-screen .party-member.state-reserve .ultgauge{ width:12px; height:14.5px; left:-7px; }

  /* キャラの色バリエーション（画面共通で使用） */
  .c-purple{ background:radial-gradient(circle at 35% 30%, #b98ee0, #7b3fb0); }
  .c-cream { background:radial-gradient(circle at 35% 30%, #fff3d6, #e0b45c); }
  .c-green { background:radial-gradient(circle at 35% 30%, #a8e6a1, #4c9a4c); }
  .c-red   { background:radial-gradient(circle at 35% 30%, #e08b8b, #a83a3a); }
  .c-blue  { background:radial-gradient(circle at 35% 30%, #8bb8e0, #3a5fa8); }
  .c-orange{ background:radial-gradient(circle at 35% 30%, #f0b878, #c47a2f); }
  .c-teal  { background:radial-gradient(circle at 35% 30%, #8fe0d0, #2f9c86); }
  .c-pink  { background:radial-gradient(circle at 35% 30%, #f0a8c8, #c4477f); }
  .c-yellow{ background:radial-gradient(circle at 35% 30%, #fff0a0, #d4b32c); }
  .c-navy  { background:radial-gradient(circle at 35% 30%, #7fa8e0, #23407a); }

  .battle-screen .command-bar{
    position:absolute;
    left:50%;
    bottom:3%;
    transform:translateX(-50%);
    width:220px;
    height:50px;
    border-radius:30px;
    z-index:14;
    cursor:grab;
    user-select:none;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* おはらい・必殺技の選択モード中は、後衛トークンをタップできるように
     コマンドバー自身のヒットテストを無効化する（見た目はそのまま） */
  .battle-screen .command-bar.selection-passthrough{
    pointer-events:none;
  }
  .battle-screen .command-bar.dragging{
    cursor:grabbing;
  }
  .battle-screen .command-bar.locked{
    cursor:not-allowed;
  }

  /* ---- 回転タイマーのリング（ドラッグ中の4秒カウント） ---- */
  /* 後衛キャラのアイコンと被らないよう、command-barのさらに上に配置する */
  .battle-screen .timer-ring{
    position:absolute;
    left:50%; bottom:100%;
    margin-bottom:14px;
    width:48px; height:48px;
    transform:translateX(-50%) rotate(-90deg);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.2s ease;
    z-index:16;
  }
  .battle-screen .timer-ring.visible{ opacity:1; }
  .battle-screen .timer-ring-bg{
    fill:none;
    stroke:rgba(0,0,0,0.35);
    stroke-width:8;
  }
  .battle-screen .timer-ring-fg{
    fill:none;
    stroke:var(--gold-light);
    stroke-width:8;
    stroke-linecap:round;
    stroke-dasharray:276.5;
    stroke-dashoffset:0;
    transition:stroke 0.2s ease;
  }
  .battle-screen .timer-ring-fg.urgent{
    stroke:#e05a4e;
  }
  .battle-screen .timer-ring-fg.cooldown{
    stroke:#7a8aa0;
  }

  /* ---- カウントダウン数字（残り3秒を切ったら表示）。リングの中央に重ねる ---- */
  .battle-screen .timer-countdown{
    position:absolute;
    left:50%; bottom:100%;
    margin-bottom:14px;
    width:48px; height:48px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:900;
    color:var(--paper);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    z-index:17;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .battle-screen .timer-countdown.visible{ opacity:1; }
  .battle-screen .timer-countdown.urgent{ color:#ff9d8f; }

  /* ---- クールタイム中のラベル表示 ---- */
  .battle-screen .cooldown-label{
    position:absolute;
    left:50%;
    bottom:100%;
    margin-bottom:70px;
    transform:translateX(-50%);
    background:rgba(30,15,10,0.75);
    color:var(--paper);
    border:2px solid #7a8aa0;
    border-radius:20px;
    padding:6px 18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    white-space:nowrap;
    z-index:16;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .battle-screen .cooldown-label.visible{ opacity:1; }

  /* ---- 右下のコマンドボタン（おはらい／アイテム） ---- */
  .battle-screen .action-menu{
    position:absolute;
    right:3%;
    bottom:3%;
    z-index:15;
    display:flex;
    gap:10px;
  }
  /* ---- 左下のコマンドボタン（わざ／ねらう） ---- */
  .battle-screen .action-menu-left{
    position:absolute;
    left:3%;
    bottom:3%;
    z-index:15;
    display:flex;
    gap:10px;
  }
  .battle-screen .action-menu button,
  .battle-screen .action-menu-left button{
    appearance:none;
    border:none;
    border-radius:14px;
    padding:12px 18px;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;
    color:var(--paper);
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    cursor:pointer;
    font-family:inherit;
  }
  .battle-screen .action-menu button:active{
    transform:translateY(1px);
  }
  .battle-screen .action-menu-left button:active{
    transform:translateY(1px);
  }
  .battle-screen .action-menu-left .btn-waza{
    background:linear-gradient(180deg,#e2564a,#b8352b);
  }
  .battle-screen .action-menu-left .btn-nerau{
    background:linear-gradient(180deg,#4a90d9,#2c5f9e);
  }
  .battle-screen .action-menu .btn-oharai{
    background:linear-gradient(180deg,#9a6ad0,#6a3f9c);
  }
  .battle-screen .action-menu .btn-item{
    background:linear-gradient(180deg,#9aa1ab,#6c727b);
    cursor:not-allowed;
    opacity:0.65;
  }

  .battle-screen .turn-label{
    position:absolute;
    top:2%;
    left:50%;
    transform:translateX(-50%);
    color:var(--lacquer-red-dark);
    font-size:13px;
    font-weight:700;
    letter-spacing:4px;
    background:var(--paper);
    padding:4px 16px;
    border-radius:12px;
    border:2px solid var(--gold);
    z-index:15;
  }

  /* ---- 動作確認用ログパネル ---- */
  .battle-screen .battle-log{
    position:absolute;
    top:8%;
    right:14px;
    width:210px;
    max-height:34%;
    overflow-y:auto;
    background:rgba(10,10,20,0.55);
    border:1.5px solid var(--gold);
    border-radius:10px;
    padding:8px 10px;
    font-size:11px;
    line-height:1.6;
    color:var(--paper);
    z-index:20;
  }
  .battle-screen .battle-log .log-line{ opacity:0.9; }
  .battle-screen .battle-log .log-line.miss{ color:#9fd2ff; }
  .battle-screen .battle-log .log-line.dead{ color:#ff9d9d; font-weight:700; }
  .battle-screen .battle-log .log-line.critical{ color:#ffd54a; font-weight:700; }
  .battle-screen .battle-log .log-line.heal{ color:#8fe3a0; font-weight:700; }

  .battle-screen .enemy{ cursor:pointer; }
  .battle-screen .enemy.dead{ cursor:not-allowed; }
  .battle-screen .enemy.target-hint{ filter:drop-shadow(0 0 8px var(--gold-light)); }

  /* ---- 行動種類の吹き出し（物理攻撃以外の行動時に表示） ---- */
  @keyframes actionBubbleIn{
    0%{ opacity:0; transform:translate(-50%, 6px) scale(0.85); }
    15%{ opacity:1; transform:translate(-50%, 0) scale(1.05); }
    25%{ transform:translate(-50%, 0) scale(1); }
    85%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%, -6px) scale(0.95); }
  }
  .battle-screen .action-bubble{
    position:absolute;
    left:50%;
    bottom:100%;
    margin-bottom:8px;
    transform:translate(-50%, 0);
    white-space:nowrap;
    background:var(--paper);
    color:var(--ink);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:4px 12px;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    z-index:26;
    pointer-events:none;
    animation:actionBubbleIn 1.6s ease forwards;
  }
  .battle-screen .action-bubble::after{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--gold);
  }
  .battle-screen .action-bubble::before{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%) translateY(-2px);
    border:5px solid transparent;
    border-top-color:var(--paper);
    z-index:1;
  }

  /* ---- 被ダメージ数値のポップアップ表示 ---- */
  @keyframes damagePopUp{
    0%{ opacity:0; transform:translate(-50%, 0) scale(0.6); }
    12%{ opacity:1; transform:translate(-50%, -6px) scale(1.15); }
    22%{ transform:translate(-50%, -10px) scale(1); }
    75%{ opacity:1; transform:translate(-50%, -34px) scale(1); }
    100%{ opacity:0; transform:translate(-50%, -46px) scale(0.95); }
  }
  .battle-screen .damage-popup{
    position:absolute;
    left:50%;
    top:20%;
    transform:translate(-50%, 0);
    white-space:nowrap;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
    text-shadow:
      -1.5px -1.5px 0 #8f1414, 1.5px -1.5px 0 #8f1414,
      -1.5px  1.5px 0 #8f1414, 1.5px  1.5px 0 #8f1414,
      0 3px 6px rgba(0,0,0,0.5);
    font-size:20px;
    z-index:27;
    pointer-events:none;
    animation:damagePopUp 1s ease-out forwards;
  }
  .battle-screen .damage-popup.critical{
    font-size:26px;
    color:#ffe14a;
    text-shadow:
      -1.5px -1.5px 0 #a86a00, 1.5px -1.5px 0 #a86a00,
      -1.5px  1.5px 0 #a86a00, 1.5px  1.5px 0 #a86a00,
      0 0 10px rgba(255,210,60,0.85), 0 3px 6px rgba(0,0,0,0.5);
  }
  .battle-screen .damage-popup.heal{
    color:#8fe3a0;
    text-shadow:
      -1.5px -1.5px 0 #14521f, 1.5px -1.5px 0 #14521f,
      -1.5px  1.5px 0 #14521f, 1.5px  1.5px 0 #14521f,
      0 3px 6px rgba(0,0,0,0.5);
  }
  .battle-screen .damage-popup.miss{
    font-size:16px;
    color:#cfe6ff;
    text-shadow:
      -1.5px -1.5px 0 #123a5c, 1.5px -1.5px 0 #123a5c,
      -1.5px  1.5px 0 #123a5c, 1.5px  1.5px 0 #123a5c,
      0 3px 6px rgba(0,0,0,0.5);
  }

  /* ---- とりつき演出：自分から対象へオーラの玉が飛んでいく ---- */
  .battle-screen .possess-orb{
    position:absolute;
    width:22px; height:22px;
    border-radius:50%;
    z-index:23;
    pointer-events:none;
    transform:translate(-50%, -50%);
    transition:left 0.55s cubic-bezier(.3,.6,.2,1),
               top 0.55s cubic-bezier(.3,.6,.2,1),
               transform 0.25s ease,
               opacity 0.25s ease;
  }
  .battle-screen .possess-orb.buff{
    background:radial-gradient(circle at 35% 30%, #fff6c8, #ffb73b 55%, #c47a10);
    box-shadow:0 0 10px 4px rgba(255,183,59,0.9), 0 0 22px 10px rgba(255,140,20,0.55);
  }
  .battle-screen .possess-orb.debuff{
    background:radial-gradient(circle at 35% 30%, #e2c6f5, #7846a0 55%, #40204f);
    box-shadow:0 0 10px 4px rgba(140,85,170,0.9), 0 0 22px 10px rgba(85,45,115,0.55);
  }
  .battle-screen .possess-orb.arrived{
    opacity:0;
    transform:translate(-50%, -50%) scale(2.4);
  }
  @keyframes possessOrbWobble{
    0%,100%{ margin-left:0; }
    50%{ margin-left:6px; }
  }
  .battle-screen .possess-orb .possess-orb-core{
    width:100%; height:100%;
    border-radius:50%;
    animation:possessOrbWobble 0.28s ease-in-out infinite;
  }

  /* ---- 攻撃対象を示す三角矢印 ---- */
  .battle-screen .target-arrow{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    line-height:1;
    color:#ff5252;
    text-shadow:0 0 6px rgba(255,82,82,0.8), 0 2px 2px rgba(0,0,0,0.5);

  .battle-screen .nerau-scope .scope-ring{

  /* 敵に刺さる赤いピン */

<script>
/* ============================================================
   画面遷移まわり
============================================================ */
const screens = [...document.querySelectorAll('.screen')];
function showScreen(id){
  screens.forEach(s => s.classList.toggle('active', s.id === id));
  if(id === 'screen-battle') initBattleIfNeeded();
}
document.querySelectorAll('[data-goto]').forEach(el => {
  el.addEventListener('click', () => {
    if(el.hasAttribute('disabled')) return;
    if(el.dataset.mode){ selectedMode = el.dataset.mode; updateModeLabel(); }
    showScreen(el.dataset.goto);
  });
});

/* ============================================================
   SCREEN 2: モード選択の状態
============================================================ */
let selectedMode = 'cpu';
function updateModeLabel(){
  const label = document.getElementById('modeLabel');
  label.textContent = 'MODE：' + (selectedMode === 'cpu' ? 'CPU戦' : 'オンライン対戦');
}

/* ============================================================
   SCREEN 3: キャラクター編成
============================================================ */
// ============================================================
// 性格システム
//   ①サボりやすさ性格：行動時に「サボる」を選びやすいかどうかを決める
//   ②行動性格：キャラ編成時にプレイヤーが選ぶ。得意な行動（物理/妖術攻撃・
//     デバフとりつき・バフとりつき・ガード）の出やすさと、ステータス補正が変わる
// ============================================================

// ①サボりやすさ性格：超まじめ(0%)～ビビリ(80%)の7段階。値は「サボりを選ぶ確率」
const SLACK_PERSONALITIES = [
  { id:'chomajime', name:'超まじめ',   rate:0.000 },
  { id:'majime',    name:'まじめ',     rate:0.025 },
  { id:'sunao',     name:'すなお',     rate:0.10  },
  { id:'kimama',    name:'気まま',     rate:0.25  },
  { id:'zubora',    name:'ずぼら',     rate:0.40  },
  { id:'chozubora', name:'超ずぼら',   rate:0.55  },
  { id:'bibiri',    name:'ビビリ',     rate:0.80  },
];
function getSlackPersonality(id){
  return SLACK_PERSONALITIES.find(p => p.id === id) || SLACK_PERSONALITIES[2]; // 既定は「すなお」
}

// ②行動性格：「特化」は対応する行動を約75%、「重視」は約50%の確率で選ぶ。
//   残りの確率は、その行動以外の3行動に均等に配分する。
//   possess時にバフ狙いかデバフ狙いかも性格で決まる（possessBias）。
//   bonuses はキャラ編成時に加算されるステータス補正。
//   hpScaling が true の性格（動じない・しんちょう）は、自身の残りHP割合が
//   低いほど mainAction（ガード）を選ぶ確率がさらに上がる。
const ACTION_PERSONALITIES = [
  { id:'araku',    name:'荒くれ',     desc:'攻撃特化',           mainAction:'physical', mainRate:0.75, possessBias:0.5,
    bonuses:{ chikara:26 } },
  { id:'tanki',    name:'短気',       desc:'攻撃重視',           mainAction:'physical', mainRate:0.50, possessBias:0.5,
    bonuses:{ chikara:9, hp:18 } },
  { id:'zunouteki',name:'ずのう的',   desc:'妖術攻撃特化',       mainAction:'magic',    mainRate:0.75, possessBias:0.5,
    bonuses:{ youjutsu:26 } },
  { id:'reisei',   name:'れいせい',   desc:'妖術攻撃重視',       mainAction:'magic',    mainRate:0.50, possessBias:0.5,
    bonuses:{ youjutsu:13, subayasa:13 } },
  { id:'nasakebukai', name:'情け深い', desc:'妖術回復特化',      mainAction:'possess',  mainRate:0.75, possessBias:0.9,
    bonuses:{ hp:52 } },
  { id:'yasashii', name:'やさしい',   desc:'妖術回復重視',       mainAction:'possess',  mainRate:0.50, possessBias:0.75,
    bonuses:{ hp:18, youjutsu:9 } },
  { id:'hidou',    name:'非道',       desc:'デバフとりつき特化', mainAction:'possess',  mainRate:0.75, possessBias:0.05,
    bonuses:{ subayasa:26 } },
  { id:'iyarashii',name:'いやらしい', desc:'デバフとりつき重視', mainAction:'possess',  mainRate:0.50, possessBias:0.2,
    bonuses:{ subayasa:13, chikara:13 } },
  { id:'kenshinteki', name:'けんしん的', desc:'バフとりつき特化', mainAction:'possess',  mainRate:0.75, possessBias:0.95,
    bonuses:{ chikara:13, mamori:13 } },
  { id:'kyoryokuteki', name:'協力的', desc:'バフとりつき重視',   mainAction:'possess',  mainRate:0.50, possessBias:0.8,
    bonuses:{ hp:18, subayasa:9 } },
  { id:'dojinai',  name:'動じない',   desc:'ガード特化',         mainAction:'guard',    mainRate:0.75, possessBias:0.5, hpScaling:true,
    bonuses:{ mamori:26 } },
  { id:'shinchou', name:'しんちょう', desc:'ガード重視',         mainAction:'guard',    mainRate:0.50, possessBias:0.5, hpScaling:true,
    bonuses:{ mamori:13, youjutsu:13 } },
];
function getActionPersonality(id){
  return ACTION_PERSONALITIES.find(p => p.id === id) || null;
}

// キャラ本来（生まれつき）の行動の出やすさ。行動性格に関わらずキャラごとに決まっている土台の傾向。
// 値は「重み」で、4つの合計が1.0になるよう各キャラに設定する（未設定キャラは均等0.25ずつ）。
const DEFAULT_BASE_ACTION_TENDENCY = { physical:0.25, magic:0.25, guard:0.25, possess:0.25 };
function getBaseActionTendency(charDef){
  return (charDef && charDef.baseActionTendency) || DEFAULT_BASE_ACTION_TENDENCY;
}

// 行動性格から、このターンの行動選択の確率テーブル（physical/magic/guard/possess の4つ、合計1.0）を作る。
// キャラ本来の行動傾向（baseActionTendency）と、プレイヤーが選ぶ行動性格の補正（mainAction/mainRate）を
// 合成する：まずキャラ本来の重みを土台にし、そこへ行動性格の主行動ぶんの重みを上乗せしてから正規化する。
// hpScaling な性格は、残りHP割合が低いほど mainAction（ガード）の上乗せ幅がさらに大きくなる
// （満タン時は定義通りの確率、瀕死時はさらに+20%ポイント程度まで上乗せ、上限95%）。
function buildActionRateTable(actor){
  const ALL_ACTIONS = ['physical', 'magic', 'guard', 'possess'];
  const base = getBaseActionTendency(actor.charDef);
  const p = actor.actionSeikaku;

  // 行動性格が無い場合は、キャラ本来の傾向をそのまま使う
  if(!p){
    const sum = ALL_ACTIONS.reduce((s, a) => s + (base[a] || 0), 0) || 1;
    const table = {};
    ALL_ACTIONS.forEach(a => { table[a] = (base[a] || 0) / sum; });
    return table;
  }

  let mainRate = p.mainRate;
  if(p.hpScaling){
    const hpRatio = actor.maxHp > 0 ? Math.max(0, Math.min(1, actor.hp / actor.maxHp)) : 1;
    const bonus = (1 - hpRatio) * 0.20; // HPが減るほど最大+20%ポイント
    mainRate = Math.min(0.95, p.mainRate + bonus);
  }

  // キャラ本来の重み（合計1.0に正規化）を土台とし、行動性格の主行動に mainRate ぶんの重みを加算する。
  // こうすることで「素で得意な行動」と「編成時に選んだ行動性格」の両方の影響が反映される。
  const baseSum = ALL_ACTIONS.reduce((s, a) => s + (base[a] || 0), 0) || 1;
  const combined = {};
  ALL_ACTIONS.forEach(a => { combined[a] = (base[a] || 0) / baseSum; });
  combined[p.mainAction] = (combined[p.mainAction] || 0) + mainRate;

  const total = ALL_ACTIONS.reduce((s, a) => s + combined[a], 0) || 1;
  const table = {};
  ALL_ACTIONS.forEach(a => { table[a] = combined[a] / total; });
  return table;
}


// 選ばれた行動性格のステータス補正を、キャラの基礎ステータス（およびmaxHp）に加算する
// ============================================================
// 装備システム
// キャラの装備枠は通常1枠。種類ごとに上げるステータスの傾向が決まっている。
//   腕輪(udewa)  : ちから  を上げる
//   指輪(yubiwa) : ようじゅつ を上げる
//   バッジ(badge): すばやさ を上げる
//   お守り(omamori): まもり を上げる
//   魂(tamashii) : ステータスではなく特殊効果を付与する
// ステータス系の装備は bonuses（各ステータスへの加算値）を持つ。
// 魂などの特殊効果系は effect（効果の種類・値）を持ち、バトル側のロジックで参照する想定。
// ※ 装備ごとの詳細な数値・効果は後で詰める前提の暫定値。
const EQUIPMENT_LIST = [
  { id:'none', name:'なし', type:'none', desc:'装備しない' },

  { id:'udewa_1', name:'てつの腕輪', type:'udewa', desc:'ちからが少し上がる', bonuses:{ chikara:10 } },
  { id:'udewa_2', name:'こがねの腕輪', type:'udewa', desc:'ちからが上がる', bonuses:{ chikara:20 } },

  { id:'yubiwa_1', name:'みずの指輪', type:'yubiwa', desc:'ようじゅつが少し上がる', bonuses:{ youjutsu:10 } },
  { id:'yubiwa_2', name:'ほしくずの指輪', type:'yubiwa', desc:'ようじゅつが上がる', bonuses:{ youjutsu:20 } },

  { id:'badge_1', name:'かぜのバッジ', type:'badge', desc:'すばやさが少し上がる', bonuses:{ subayasa:10 } },
  { id:'badge_2', name:'いなずまのバッジ', type:'badge', desc:'すばやさが上がる', bonuses:{ subayasa:20 } },

  { id:'omamori_1', name:'いしのお守り', type:'omamori', desc:'まもりが少し上がる', bonuses:{ mamori:10 } },
  { id:'omamori_2', name:'こんてつのお守り', type:'omamori', desc:'まもりが上がる', bonuses:{ mamori:20 } },

  { id:'tamashii_1', name:'いかりの魂', type:'tamashii', desc:'HPが低いほど、こうげきの威力が上がる', effect:{ kind:'lowHpAttackUp' } },
  { id:'tamashii_2', name:'まもりの魂', type:'tamashii', desc:'せんとう開始時、じぶんに小さなシールドをはる', effect:{ kind:'startBattleShield' } },

const EQUIPMENT_TYPE_LABELS = {
  none:'なし', udewa:'腕輪', yubiwa:'指輪', badge:'バッジ', omamori:'お守り', tamashii:'魂',
};

function getEquipment(id){
  return EQUIPMENT_LIST.find(e => e.id === id) || EQUIPMENT_LIST[0];
}

// キャラが指定の種類の魂（装備の特殊効果）を持っているかどうかを判定する共通ヘルパー。
// c.equipment は startBattleField でプレイヤー側にのみ付与される想定（CPU側は未設定=undefinedで安全に false になる）。
function hasEquipEffect(c, kind){
  return !!(c && c.equipment && c.equipment.effect && c.equipment.effect.kind === kind);
}

// 装備セレクト用のHTML（種類ごとにoptgroupでまとめる）を組み立てる
function buildEquipmentOptionsHtml(selectedId){
  const types = ['udewa', 'yubiwa', 'badge', 'omamori', 'tamashii'];
  let html = `<option value="none" ${selectedId === 'none' ? 'selected' : ''}>装備なし</option>`;
  types.forEach(type => {
    const items = EQUIPMENT_LIST.filter(e => e.type === type);
    if(items.length === 0) return;
    html += `<optgroup label="${EQUIPMENT_TYPE_LABELS[type]}">`;
    items.forEach(e => {
      html += `<option value="${e.id}" ${e.id === selectedId ? 'selected' : ''}>${e.name}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

// 装備によるステータス加算・特殊効果を、既存のstats/hpに合成する。
// 行動性格の合成（applyPersonalityBonuses）と同様のパターンで、こちらは装備ぶんだけを別途加算する。
function applyEquipmentBonuses(stats, equipmentId){
  const eq = getEquipment(equipmentId);
  const result = { ...stats };
  if(eq && eq.bonuses){
    if(eq.bonuses.chikara) result.chikara += eq.bonuses.chikara;
    if(eq.bonuses.mamori) result.mamori += eq.bonuses.mamori;
    if(eq.bonuses.youjutsu) result.youjutsu += eq.bonuses.youjutsu;
    if(eq.bonuses.subayasa) result.subayasa += eq.bonuses.subayasa;
  }
  return result;
}

function applyPersonalityBonuses(baseStats, baseHp, actionPersonalityId){
  const stats = { chikara: baseStats.chikara, mamori: baseStats.mamori, youjutsu: baseStats.youjutsu, subayasa: baseStats.subayasa };
  let hp = baseHp;
  const p = getActionPersonality(actionPersonalityId);
  if(p && p.bonuses){
    if(p.bonuses.chikara) stats.chikara += p.bonuses.chikara;
    if(p.bonuses.mamori) stats.mamori += p.bonuses.mamori;
    if(p.bonuses.youjutsu) stats.youjutsu += p.bonuses.youjutsu;
    if(p.bonuses.subayasa) stats.subayasa += p.bonuses.subayasa;
    if(p.bonuses.hp) hp += p.bonuses.hp;
  }
  return { stats, hp };
}

const MAX_ROSTER = 6;

// 種族ごとのイメージカラー（種族タグの色分け・陣形バッジなどに使用。トップレベルで定義し、
// 編成画面（renderRosterPool等）とバトル本体（startBattleField内）の両方から参照できるようにする）
const ZOKU_COLORS = {
  'イサマシ族': '#e53935', // 赤
  'フシギ族':   '#fbc02d', // 黄
  'ゴーケツ族': '#fb8c00', // 橙

  'ニョロロン族': '#26c6da', // 水
};

let selectedIds = []; // 選ばれた順が、そのまま「前衛→後衛」の並びになる
let actionSeikakuMap = {}; // charId -> 行動性格id（編成時にプレイヤーが選択）
let equipMap = {}; // charId -> 装備id（編成時にプレイヤーが選択。装備枠は1枠）

// CPU（対戦相手）側のキャラクター。プレイヤー側と同じく6体で、前衛3体・後衛3体を編成する。
// 敵の編成は、プレイヤーと同じ characterPool（実在するキャラクター）からランダムに選ぶ。
// プレイヤーが選んだキャラとはなるべく被らないようにし、候補が足りない場合のみ被りを許容する。
function pickEnemyPool(excludeIds){
  const excluded = new Set(excludeIds || []);
  const candidates = characterPool.filter(c => !excluded.has(c.id));
  const pool = candidates.length >= MAX_ROSTER ? candidates : characterPool.slice();
  // シャッフルして先頭 MAX_ROSTER 体を採用する
  const shuffled = pool.map(c => ({ c, r: Math.random() })).sort((a, b) => a.r - b.r).map(x => x.c);
  return shuffled.slice(0, MAX_ROSTER);
}

const rosterSlotsEl = document.getElementById('rosterSlots');

// サークルスロットの配置半径
const ROSTER_CIRCLE = {
  centerX: 200, centerY: 200,
  radius: 130, // 6体全員をこの半径の円周上に等間隔で配置する
};

// スロット番号(0〜5)から、円周上の(x, y)座標を計算する。
// 6体を1つの円の上に、真上を起点に60度おきで均等配置する。
function getRosterSlotPosition(i){
  const angleDeg = -90 + i * 60;
  const angleRad = angleDeg * Math.PI / 180;
  return {
    x: ROSTER_CIRCLE.centerX + ROSTER_CIRCLE.radius * Math.cos(angleRad),
    y: ROSTER_CIRCLE.centerY + ROSTER_CIRCLE.radius * Math.sin(angleRad),
  };
}

function renderRosterSlots(){
  // 中心のガイドリングは残し、スロットだけ作り直す
  rosterSlotsEl.querySelectorAll('.roster-slot-wrap').forEach(el => el.remove());
  for(let i=0;i<MAX_ROSTER;i++){
    const wrapEl = document.createElement('div');
    wrapEl.className = 'roster-slot-wrap';
    const pos = getRosterSlotPosition(i);
    wrapEl.style.left = pos.x + 'px';
    wrapEl.style.top = pos.y + 'px';
    const slotEl = document.createElement('div');
    const charId = selectedIds[i];
    if(charId){
      const c = characterPool.find(x => x.id === charId);
      slotEl.className = 'roster-slot filled';
      slotEl.innerHTML = `
        <div class="order-badge">${i < 3 ? '前' : '後'}${(i % 3) + 1}</div>
        <div class="token ${c.cls}">${c.label}</div>
      `;
      wrapEl.appendChild(slotEl);

      const currentSeikaku = actionSeikakuMap[charId] || DEFAULT_ACTION_SEIKAKU;
      const select = document.createElement('select');
      select.className = 'seikaku-select';
      select.innerHTML = ACTION_PERSONALITIES.map(p =>
        `<option value="${p.id}" ${p.id === currentSeikaku ? 'selected' : ''}>${p.name}</option>`
      ).join('');
      select.addEventListener('click', (e) => e.stopPropagation());
      select.addEventListener('change', (e) => {
        actionSeikakuMap[charId] = e.target.value;
      });
      wrapEl.appendChild(select);

      // 装備セレクト（装備枠は1枠。種類ごとにoptgroupでまとめる）
      const currentEquip = equipMap[charId] || 'none';
      const equipSelect = document.createElement('select');
      equipSelect.className = 'equip-select';
      equipSelect.innerHTML = buildEquipmentOptionsHtml(currentEquip);
      equipSelect.addEventListener('click', (e) => e.stopPropagation());
      equipSelect.addEventListener('change', (e) => {
        equipMap[charId] = e.target.value;
      });
      wrapEl.appendChild(equipSelect);
    } else {
      slotEl.className = 'roster-slot';
      slotEl.innerHTML = `<div class="placeholder">${i+1}</div>`;
      wrapEl.appendChild(slotEl);
    }
    rosterSlotsEl.appendChild(wrapEl);
  }
  renderRosterZokuBridges();
  // 円の下端に、実際に描画された一番下のスロット（トークン＋バッジ＋行動性格セレクト込み）が
  // どこまではみ出るかを実測し、その分だけコンテナの高さを確保する。
  // これにより、固定値のズレやレイアウト崩れがあっても下のカード一覧と重ならないようにする。
  requestAnimationFrame(() => {
    let maxBottom = 0;
    rosterSlotsEl.querySelectorAll('.roster-slot-wrap').forEach(el => {
      const bottom = el.offsetTop + el.offsetHeight;
      if(bottom > maxBottom) maxBottom = bottom;
    });
    if(maxBottom > 0){
      rosterSlotsEl.style.height = (maxBottom + 24) + 'px'; // 余白24pxを追加
    }
  });
}

// サークルスロット上で、同じ種族のキャラが隣り合って編成された時に、
// そのキャラ同士の間をその種族のイメージカラーの「橋」（線）でつなぐ。
// 円周上で物理的に隣接しているスロット同士（i と i+1、末尾5→0も含めて円形に一周）を対象にする。
const SVG_NS = 'http://www.w3.org/2000/svg';
function renderRosterZokuBridges(){
  const svg = document.getElementById('rosterZokuBridges');
  if(!svg) return;
  svg.innerHTML = '';
  for(let i = 0; i < MAX_ROSTER; i++){
    const j = (i + 1) % MAX_ROSTER;
    const idA = selectedIds[i];
    const idB = selectedIds[j];
    if(!idA || !idB) continue;
    const cA = characterPool.find(x => x.id === idA);
    const cB = characterPool.find(x => x.id === idB);
    if(!cA || !cB || !cA.zoku || cA.zoku !== cB.zoku) continue;
    const color = ZOKU_COLORS[cA.zoku];
    if(!color) continue;
    const posA = getRosterSlotPosition(i);
    const posB = getRosterSlotPosition(j);
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', posA.x);
    line.setAttribute('y1', posA.y);
    line.setAttribute('x2', posB.x);
    line.setAttribute('y2', posB.y);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '7');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', '0.85');
    svg.appendChild(line);
  }
}

// キャラクター一覧の並び順。追加順(characterPool定義順)を基準に、種族順・ランク順・名前順に並び替えられる。
let rosterSortMode = 'added';
const RANK_ORDER = { S:0, A:1, B:2, C:3, D:4, E:5 };
// 種族順で使う並び順（五十音順ではなく、この順序で固定する）
const ZOKU_ORDER_LIST = ['イサマシ族', 'フシギ族', 'ゴーケツ族', 'プリチー族', 'ポカポカ族', 'ウスラカゲ族', 'ブキミー族', 'ニョロロン族'];
function getZokuOrderIndex(zoku){
  const idx = ZOKU_ORDER_LIST.indexOf(zoku);
  return idx === -1 ? ZOKU_ORDER_LIST.length : idx; // リストにない種族は末尾へ
}

// 現在の並び順設定に従って characterPool を並び替えた配列を返す（元の配列は変更しない）。
function getSortedCharacterPool(){
  const list = characterPool.slice();
  switch(rosterSortMode){
    case 'zoku':
      // 種族を指定の順序（ZOKU_ORDER_LIST）でグループ化し、同じ種族内はNo.順
      list.sort((a, b) => getZokuOrderIndex(a.zoku) - getZokuOrderIndex(b.zoku) || (a.no ?? 0) - (b.no ?? 0));
      break;
    case 'rank':
      // ランクが高い(S)順。同ランク内は種族順（ZOKU_ORDER_LIST）、さらにその中はNo.順
      list.sort((a, b) =>
        (RANK_ORDER[a.rank] ?? 99) - (RANK_ORDER[b.rank] ?? 99) ||
        getZokuOrderIndex(a.zoku) - getZokuOrderIndex(b.zoku) ||
        (a.no ?? 0) - (b.no ?? 0)
      );
      break;
    case 'name':
      // キャラ名の五十音順
      list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      break;
    case 'added':
    default:
      // 追加順（characterPool定義順のまま）
      break;
  }
  return list;
}

function renderRosterPool(){

function toggleCharacter(id){
  const idx = selectedIds.indexOf(id);
  if(idx >= 0){
    selectedIds.splice(idx, 1);
    delete actionSeikakuMap[id];
    delete equipMap[id];
  } else {
    if(selectedIds.length >= MAX_ROSTER) return; // 満員
    selectedIds.push(id);
    if(!actionSeikakuMap[id]) actionSeikakuMap[id] = DEFAULT_ACTION_SEIKAKU;
    if(!equipMap[id]) equipMap[id] = 'none';
  }
  renderRosterSlots();
  renderRosterPool();
  renderRosterList();
  selectedCountEl.textContent = selectedIds.length;
  toBattleBtn.disabled = selectedIds.length < 3; // 前衛3体分は最低限必要
}

let battleInitialized = false;

function initBattleIfNeeded(){
  if(battleInitialized) return;
  battleInitialized = true;
  startBattleField();
}

function startBattleField(){
  // 編成画面で選んだキャラをそのままパーティにする。
  // 6体に満たない場合は、プールの残りから自動で補充する。
  let chosen = selectedIds.map(id => characterPool.find(c => c.id === id));
  characterPool.forEach(c => {
    if(chosen.length < MAX_ROSTER && !chosen.includes(c)) chosen.push(c);
  });
  chosen = chosen.slice(0, MAX_ROSTER);

  let party = chosen.map((c, i) => {
    const baseStats = c.stats || { chikara:60, mamori:60, youjutsu:60, subayasa:60 };
    const baseHp = c.maxHp || 100;
    const actionSeikakuId = actionSeikakuMap[c.id] || DEFAULT_ACTION_SEIKAKU;
    const { stats: personalityStats, hp } = applyPersonalityBonuses(baseStats, baseHp, actionSeikakuId);
    const equipmentId = equipMap[c.id] || 'none';
    const stats = applyEquipmentBonuses(personalityStats, equipmentId);
    return {
      id:i, cls:c.cls, label:c.label, name:c.name, hp, maxHp:hp, ult:100 /* ←検証用：最初から必殺技ゲージMAX。元に戻す時は 0 に */, rank:c.rank || 'C', zoku:c.zoku || null, stats, possessSkill:c.possess || null, skill:c.skill || null, tokui:c.tokui || null, jaku:c.jaku || null, physicalSkill:c.physical || null, magicSkill:c.magic || null, ultSkill:c.ult || null,
      slackSeikaku: getSlackPersonality(c.slackSeikaku), actionSeikaku: getActionPersonality(actionSeikakuId), charDef: c, equipment: getEquipment(equipmentId)
    };
  });

  // CPU側の編成。プレイヤーと同じく6体（前衛3体・後衛3体）を持たせる。
  // 実在するキャラクター（characterPool）からランダムに選び、CPUの行動性格はランダムに割り当てる。
  const enemyPool = pickEnemyPool(chosen.map(c => c.id));
  let enemyParty = enemyPool.slice(0, MAX_ROSTER).map((c, i) => {
    const baseStats = c.stats || { chikara:60, mamori:60, youjutsu:60, subayasa:60 };
    const baseHp = c.maxHp || 100;
    const enemyActionSeikakuId = ACTION_PERSONALITIES[Math.floor(Math.random() * ACTION_PERSONALITIES.length)].id;
    const { stats, hp } = applyPersonalityBonuses(baseStats, baseHp, enemyActionSeikakuId);
    return {
      id:'e' + i, cls:c.cls, label:c.label, name:c.name, hp, maxHp:hp, ult:100 /* ←検証用：最初から必殺技ゲージMAX。元に戻す時は 0 に */, rank:c.rank || 'C', zoku:c.zoku || null, stats, possessSkill:c.possess || null, skill:c.skill || null, tokui:c.tokui || null, jaku:c.jaku || null, physicalSkill:c.physical || null, magicSkill:c.magic || null, ultSkill:c.ult || null,
      slackSeikaku: getSlackPersonality(c.slackSeikaku || 'sunao'), actionSeikaku: getActionPersonality(enemyActionSeikakuId), charDef: c
    };
  });

  const partyLayer = document.getElementById('partyLayer');
  const enemyLayer = document.getElementById('enemyLayer');
  const commandBar = document.getElementById('commandBar');
  const stage = document.querySelector('.battle-screen .stage');

  const elements = {};
  party.forEach(c => {
    const el = document.createElement('div');
    el.className = 'slot party-member';
    el.dataset.id = c.id;
    el.innerHTML = `
      <div class="token ${c.cls}">${c.label}</div>
      <div class="nameplate">${c.name}</div>
      <div class="hpbar">
        <div class="ultgauge">
          <svg viewBox="0 0 20 24">
            <clipPath id="ultclip-${c.id}">
              <rect x="0" y="${24 - (24 * c.ult / 100)}" width="20" height="${24 * c.ult / 100}"></rect>
            </clipPath>
            <path class="ult-bg" d="M10 1 C 10 1, 18 12.5, 18 17 C 18 21.5, 14.5 23.5, 10 23.5 C 5.5 23.5, 2 21.5, 2 17 C 2 12.5, 10 1, 10 1 Z"></path>
            <path class="ult-fill" clip-path="url(#ultclip-${c.id})" d="M10 1 C 10 1, 18 12.5, 18 17 C 18 21.5, 14.5 23.5, 10 23.5 C 5.5 23.5, 2 21.5, 2 17 C 2 12.5, 10 1, 10 1 Z"></path>
          </svg>
        </div>
        <div style="width:${Math.max(0, Math.min(100, (c.hp / c.maxHp) * 100))}%"></div>
      </div>
    `;
    partyLayer.appendChild(el);
    elements[c.id] = el;
  });

  const enemyElements = {};
  enemyParty.forEach(c => {
    const el = document.createElement('div');
    el.className = 'slot enemy enemy-member';
    el.dataset.id = c.id;
    el.innerHTML = `
      <div class="token ${c.cls}">${c.label}</div>
      <div class="nameplate">${c.name}</div>
      <div class="hpbar">
        <div class="ultgauge">
          <svg viewBox="0 0 20 24">
            <clipPath id="ultclip-${c.id}">
              <rect x="0" y="${24 - (24 * c.ult / 100)}" width="20" height="${24 * c.ult / 100}"></rect>
            </clipPath>
            <path class="ult-bg" d="M10 1 C 10 1, 18 12.5, 18 17 C 18 21.5, 14.5 23.5, 10 23.5 C 5.5 23.5, 2 21.5, 2 17 C 2 12.5, 10 1, 10 1 Z"></path>
            <path class="ult-fill" clip-path="url(#ultclip-${c.id})" d="M10 1 C 10 1, 18 12.5, 18 17 C 18 21.5, 14.5 23.5, 10 23.5 C 5.5 23.5, 2 21.5, 2 17 C 2 12.5, 10 1, 10 1 Z"></path>
          </svg>
        </div>
        <div style="width:${Math.max(0, Math.min(100, (c.hp / c.maxHp) * 100))}%"></div>
      </div>
    `;
    enemyLayer.appendChild(el);
    enemyElements[c.id] = el;
  });

  // 初期表示時点で「陣」が発動しているキャラがいればインジケーターを表示する
  refreshAllZokuJinIndicators();
  // 戦闘開始時点ですでに発動している「陣」があれば、バナーで知らせる
  checkZokuJinActivations();

  // ============================================================
  // とりつき（バフ・デバフ）倍率テーブル
  //   バフ  : 味方に対して行う良いとりつき（ステータス上昇）
  //   デバフ: 敵に対して行う悪いとりつき（ステータス低下）
  // 「1つのステータスのみ」を上げ下げする場合と「全ステータス同時」に
  // 上げ下げする場合とで倍率が異なる。
  // ============================================================
  const BUFF_RATES = {
    small:   { single: null,  all: 0.05 },   // 小アップ
    normal:  { single: 0.10,  all: 0.075 },  // 通常（表記なし）
    large:   { single: 0.15,  all: 0.15 },   // 大アップ
    super:   { single: 0.25,  all: null },   // 超アップ
    ultimate:{ single: 0.50,  all: null },   // 究極アップ（※極一部）
  };
  const DEBUFF_RATES = {
    small:   { single: null,  all: 0.075 },  // 小ダウン
    normal:  { single: 0.15,  all: 0.10 },   // 通常（表記なし）
    large:   { single: 0.25,  all: 0.20 },   // 大ダウン
    super:   { single: 0.40,  all: null },   // 超ダウン
  };

  // とりつき効果を1つ付与する。
  //   kind  : 'buff' | 'debuff'
  //   grade : 'small' | 'normal' | 'large' | 'super' | 'ultimate'
  //   scope : 'single'（1ステータスのみ） | 'all'（全ステータス同時）
  //   stat  : scope==='single' のとき対象ステータス名（chikara/mamori/youjutsu/subayasa）
  //   duration: 効果が続くターン数（自分の行動回数ベース、省略時は3）
  function applyPossessEffect(target, { kind, grade, scope, stat, duration, name, powerMult }){
    const table = kind === 'buff' ? BUFF_RATES : DEBUFF_RATES;
    let rate = table[grade] ? table[grade][scope] : null;
    if(rate == null) return null; // その組み合わせは定義されていない
    // 「ブキミーの陣」：発動側の陣形が揃っているほど、とりつき効果の威力（上げ幅／下げ幅）がアップ
    if(powerMult) rate *= powerMult;
    if(duration == null) duration = kind === 'buff' ? 5 : 3;
    if(!target.possessEffects) target.possessEffects = [];
    const effect = { kind, grade, scope, stat: scope === 'single' ? stat : null, rate, duration, name };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }

  // 「挑発」系のとりつき効果を付与する（ステータス変化はなく、常に狙われるようになる）。
  function applyTauntEffect(target, { duration = 5, name }){
    if(!target.possessEffects) target.possessEffects = [];
    const effect = { kind: 'buff', grade: null, scope: null, stat: null, rate: 0, duration, name, taunt: true };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }

  // 対象に「挑発」効果（常に狙われる）がかかっているか（possessによる一時効果、または挑発魂）
  function hasTaunt(c){
    if(c.possessEffects && c.possessEffects.some(e => e.taunt)) return true;
    if(hasEquipEffect(c, 'taunt')) return true;
    return false;
  }

  // 「隠密魂」を装備しているかどうか（狙われなくなる）
  function hasStealth(c){
    return hasEquipEffect(c, 'stealth');
  }

  // 「いやしのふんいき」等、時間経過でじわじわHPが回復するバフ効果を付与する。
  function applyHotEffect(target, { duration = 5, name, rate = 0.05 }){
    if(!target.possessEffects) target.possessEffects = [];
    const effect = { kind: 'buff', grade: null, scope: null, stat: null, rate: 0, duration, name, hot: true, hotRate: rate };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }

  // 「闇の力」等、時間経過でじわじわHPが減っていくデバフ効果を付与する（デバフなのでずっと解けない）。
  function applyDotEffect(target, { name, rate = 0.05, powerMult }){
    if(!target.possessEffects) target.possessEffects = [];
    // 「ブキミーの陣」：発動側の陣形が揃っているほど、継続ダメージの威力がアップ
    if(powerMult) rate *= powerMult;
    const effect = { kind: 'debuff', grade: null, scope: null, stat: null, rate: 0, duration: null, name, dot: true, dotRate: rate };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }

  // 「行動不能」系のとりつき効果を付与する（デバフなので、いったんかかるとずっと解けない）。
  function applyStunEffect(target, { name }){    if(!target.possessEffects) target.possessEffects = [];
    const effect = { kind: 'debuff', grade: null, scope: null, stat: null, rate: 0, duration: null, name, stun: true };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }

  // 対象が「行動不能」状態かどうか
  function isStunned(c){
    return !!(c.possessEffects && c.possessEffects.some(e => e.stun));
  }

  // 対象が何らかの「デバフ」を受けているかどうか（ステータスダウン・行動不能・継続ダメージ等すべて含む）
  function hasDebuffEffect(c){
    return !!(c.possessEffects && c.possessEffects.some(e => e.kind === 'debuff'));
  }

  // 通常攻撃・妖術攻撃の対象を選ぶ。優先順位は次の通り：
  //   1. 挑発中のキャラ（possessの挑発効果、または「挑発魂」） … 必ずそちらが狙われる
  //   2. 「ねらう」で刺したピンの対象（ただし「隠密魂」持ちは対象から除外される。ピンよりやや優先）
  //   3. 上記がなければ、隠密魂持ちを除いた候補からランダム
  //   4. 隠密魂持ちしか残っていない場合（前衛が全員隠密魂持ちなど）はランダムに狙われる
  function pickAttackTarget(candidates){
    const alive = candidates.filter(c => c.alive);
    if(alive.length === 0) return null;

    const taunting = alive.filter(hasTaunt);
    if(taunting.length > 0){
      return taunting[Math.floor(Math.random() * taunting.length)];
    }

    // 隠密魂持ちを除いた候補（通常はこちらから選ぶ）
    const nonStealth = alive.filter(c => !hasStealth(c));

    if(typeof pinnedTarget !== 'undefined' && pinnedTarget && pinnedTarget.alive && alive.includes(pinnedTarget)){
      // ピンが刺さっていても、その対象が隠密魂持ちなら無効（隠密魂がピンよりやや優先）
      if(!hasStealth(pinnedTarget)) return pinnedTarget;
    }

    if(nonStealth.length > 0){
      return nonStealth[Math.floor(Math.random() * nonStealth.length)];
    }
    // 全員が隠密魂持ちの場合は、隠密を無視してランダムに選ぶ
    return alive[Math.floor(Math.random() * alive.length)];
  }

  // 経過処理：キャラが1行動したタイミングで、そのキャラにかかっている
  // とりつき効果の残りターンを1減らし、0になったものを取り除く。
  function tickPossessEffects(c){
    if(!c.possessEffects || c.possessEffects.length === 0) return;
    // 「いやしのふんいき」等、時間経過で回復する系のバフは、行動のたびにHPを回復させる
    c.possessEffects.forEach(e => {
      if(e.hot && e.kind === 'buff' && c.hp < c.maxHp){
        const healAmount = Math.max(1, Math.round(c.maxHp * e.hotRate));
        const before = c.hp;
        c.hp = Math.min(c.maxHp, c.hp + healAmount);
        const healed = c.hp - before;
        if(healed > 0){
          updateHpBar(c);
          logLine(`${c.name} は${e.name}の効果でHPが${healed}回復した！`, 'heal');
          showDamagePopup(c, `+${healed}`, 'heal');
        }
      }
    });
    // 「闇の力」等、時間経過でHPが減っていく系のデバフは、行動のたびにダメージを与える
    let diedFromDot = false;
    c.possessEffects.forEach(e => {
      if(e.dot && e.kind === 'debuff' && c.alive){
        const dmgAmount = Math.max(1, Math.round(c.maxHp * e.dotRate));
        c.hp = Math.max(0, c.hp - dmgAmount);
        updateHpBar(c);
        logLine(`${c.name} は${e.name}の効果でHPが${dmgAmount}減った…`, 'critical');
        showDamagePopup(c, String(dmgAmount));
        if(c.hp <= 0 && c.alive){
          c.alive = false;
          updateHpBar(c);
          logLine(`${c.name} を倒した！`, 'dead');
          triggerAllyFaintBonus(c);
          diedFromDot = true;
        }
      }
    });
    // デバフは行動回数で切れず、ずっと持続する。バフのみ残り行動回数を減らして消滅させる。
    c.possessEffects.forEach(e => { if(e.kind === 'buff') e.duration -= 1; });
    c.possessEffects = c.possessEffects.filter(e => e.kind !== 'buff' || e.duration > 0);
    updateAuraEffect(c);
    if(diedFromDot){
      forceSwapIfFrontWiped();
      forceSwapEnemyIfFrontWiped();
    }
  }

  // 現在かかっているバフ／デバフの状態に応じて、キャラにオーラのCSSクラスを付け外しする。
  // バフ＝黄色〜橙色のオーラ、デバフ＝薄暗い紫色のオーラ。両方かかっている場合はデバフのオーラを優先表示する。
  function updateAuraEffect(c){
    const el = getCharEl(c);
    if(!el) return;
    const effects = c.possessEffects || [];
    const hasDebuff = effects.some(e => e.kind === 'debuff');
    const hasBuff = effects.some(e => e.kind === 'buff');
    el.classList.toggle('aura-debuff', hasDebuff);
    el.classList.toggle('aura-buff', hasBuff && !hasDebuff);
    // デバフの有無によって必殺技ゲージの色（紫）も連動して切り替える
    updateUltGauge(c);
    // 必殺技が使用可能かどうかの見た目（発光枠など）も、デバフ状態の変化に合わせて更新する
    if(typeof refreshUltReadyHighlights === 'function') refreshUltReadyHighlights();
    // おはらいで選択可能かどうかの見た目も、デバフ状態の変化に合わせて更新する
    if(typeof refreshOharaiSelectableHighlights === 'function') refreshOharaiSelectableHighlights();
  }

  // 「におうだち」等、前衛の真ん中（前2）にいる時だけ発動するスキルの判定。
  // 前衛3体のうち中央（インデックス1）に自分がいるかどうかを、自分の陣営の配列から調べる。
  function isInMiddleFrontPosition(c){
    const arr = c.side === 'enemy' ? enemyParty : party;
    return arr[1] === c && c.alive;
  }

  // ============================================================
  // 種族の陣（同種族の妖怪を前衛で隣り合わせに配置した時のステータス上昇）
  //   ・前衛3体（隊列の先頭3体）で、同じ種族が隣り合っている数によって発動する
  //   ・2体隣り合わせ → 対象ステータスが約1.1倍（10%アップ）
  //   ・3体隣り合わせ → 対象ステータスが約1.2倍（20%アップ）
  //   ・種族によって上昇する対象が異なる（下記 ZOKU_JIN を参照）
  // ============================================================
  const ZOKU_JIN = {
    'イサマシ族': { stat:'chikara',       label:'イサマシの陣', desc:'ちからアップ！' }, // ちから（物理攻撃力）
    'フシギ族':   { stat:'youjutsu',      label:'フシギの陣',   desc:'ようじゅつアップ！' },   // ようりょく（妖術の威力）
    'ゴーケツ族': { stat:'mamori',        label:'ゴーケツの陣', desc:'まもりアップ！' }, // まもり（被ダメージ軽減）
    'プリチー族': { stat:'subayasa',      label:'プリチーの陣', desc:'すばやさアップ！' }, // すばやさ（行動順・回避率）
    'ポカポカ族': { stat:'heal',          label:'ポカポカの陣', desc:'かいふくアップ！' }, // 回復量（HP回復の効き目）
    'ウスラカゲ族': { stat:'possessRate', label:'ウスラカゲの陣', desc:'とりつきやすさアップ！' }, // とりつき成功率
    'ブキミー族': { stat:'possessPower',  label:'ブキミーの陣', desc:'とりつきこうかアップ！' }, // とりつきの威力
    'ニョロロン族': { stat:'possessResist', label:'ニョロロンの陣', desc:'とりつきぼうぎょアップ！' }, // とりつき耐性
  };

  // 指定キャラが現在「陣」の対象になっているかどうかを判定し、
  // { stat, mult, label, count } を返す（対象外なら null）。
  // 前衛（隊列の先頭3体）の中で、自分と隣接する位置（配列インデックスが連続）に
  // 生存中かつ同じ種族のキャラがいる数を左右にたどって数える。
  function getZokuJinMultiplier(c){
    if(!c || !c.alive || !c.zoku) return null;
    const info = ZOKU_JIN[c.zoku];
    if(!info) return null;
    const arr = c.side === 'enemy' ? enemyParty : party;
    const front = arr.slice(0, 3);
    const idx = front.indexOf(c);
    if(idx === -1) return null; // 後衛にいる間は発動しない
    let left = idx, right = idx;
    while(left - 1 >= 0 && front[left - 1] && front[left - 1].alive && front[left - 1].zoku === c.zoku) left--;
    while(right + 1 <= 2 && front[right + 1] && front[right + 1].alive && front[right + 1].zoku === c.zoku) right++;
    const count = right - left + 1;
    if(count >= 3) return { stat: info.stat, mult: 1.2, label: info.label, count: 3 };
    if(count >= 2) return { stat: info.stat, mult: 1.1, label: info.label, count: 2 };
    return null;
  }

  // 「とりつきの威力」の陣（ブキミーの陣）による倍率だけを取り出すヘルパー
  // （applyPossessEffect / applyDotEffect でとりつき効果の強さを底上げするのに使う）
  function getZokuPossessPowerMult(actor){
    const zj = getZokuJinMultiplier(actor);
    return (zj && zj.stat === 'possessPower') ? zj.mult : null;
  }

  // ベースのステータスに、現在有効なとりつき効果をすべて乗算して実効値を算出する。
  // 同じステータスに複数の効果がかかっている場合は倍率を積み重ねる（乗算合成）。
  function getEffectiveStats(c){
    const base = c.stats;
    const result = { chikara: base.chikara, mamori: base.mamori, youjutsu: base.youjutsu, subayasa: base.subayasa };
    // 「〇〇の陣」：前衛で同じ種族が隣り合っている時、対象ステータスが1.1倍（2体）／1.2倍（3体）になる
    const zokuJin = getZokuJinMultiplier(c);
    if(zokuJin && result[zokuJin.stat] !== undefined){
      result[zokuJin.stat] *= zokuJin.mult;
    }
    // 「どんどんフィールド」：場に発動者がいる間、敵味方全員の全ステータスがアップする
    const fieldBoostRate = getAllStatsFieldBoostRate();
    if(fieldBoostRate > 0){
      const fieldMult = 1 + fieldBoostRate;
      result.chikara *= fieldMult;
      result.mamori *= fieldMult;
      result.youjutsu *= fieldMult;
      result.subayasa *= fieldMult;
    }
    // 「におうだち」：前衛の真ん中にいる時だけまもりアップ（通常アップと同じ上げ幅：+10%）
    if(c.skill && c.skill.middleMamoriBoost && isInMiddleFrontPosition(c)){
      result.mamori *= 1.10;
    }
    // 「もえるとうし」：味方が気絶するたびにちからアップ（永続・重複、1回につき+10%）
    if(c.moeruStacks){
      result.chikara *= 1 + 0.10 * c.moeruStacks;
    }
    // 「のろいのおはだ」：自分にデバフ（敵からのとりつき）がかかっている間、全ステータスアップ
    if(c.skill && c.skill.allStatsUpWhileDebuffed && c.possessEffects && c.possessEffects.some(e => e.kind === 'debuff')){
      const mult = 1 + BUFF_RATES.normal.all;
      result.chikara *= mult;
      result.mamori *= mult;
      result.youjutsu *= mult;
      result.subayasa *= mult;
    }
    if(!c.possessEffects) return result;
    c.possessEffects.forEach(e => {
      const sign = e.kind === 'buff' ? 1 : -1;
      const mult = 1 + sign * e.rate;
      if(e.scope === 'all'){
        result.chikara *= mult;
        result.mamori *= mult;
        result.youjutsu *= mult;
        result.subayasa *= mult;
      } else if(e.stat){
        result[e.stat] *= mult;
      }
    });
    return result;
  }

  // ============================================================
  // ステータスに基づく戦闘計算
  //   ちから   : 物理攻撃の威力
  //   ようじゅつ: 妖術攻撃の威力
  //   まもり   : 受けるダメージの軽減
  //   すばやさ : 行動順の速さ、および攻撃の回避しやすさ
  // ============================================================

  // 物理攻撃ダメージ = ちから/2 - (対象のまもり)/4 + 技の威力/2　(±10%のランダムなブレ)
  function calcPhysicalDamage(attacker, defender, power){
    const atkStats = getEffectiveStats(attacker);
    const defStats = getEffectiveStats(defender);
    const base = atkStats.chikara / 2 - defStats.mamori / 4 + power / 2;
    const variance = 1 + (Math.random() * 0.2 - 0.1); // ±10%
    return Math.max(1, Math.round(base * variance));
  }

  // 妖術攻撃ダメージ = ようじゅつ/2 - (対象のまもり)/4 + 技の威力/2　(±10%のランダムなブレ)
  // 「とりつき（デバフ）」の成功率。妖術が高いほど、また対象のすばやさが低いほど成功しやすい。
  function calcPossessSuccessChance(actor, target){
    const atk = getEffectiveStats(actor).youjutsu;
    const def = getEffectiveStats(target).subayasa;
    let chance = 0.75 + (atk - def) / 500;
    // 「ウスラカゲの陣」：発動側の陣形が揃っているほど、とりつきの成功率がアップ
    const actorZokuJin = getZokuJinMultiplier(actor);
    if(actorZokuJin && actorZokuJin.stat === 'possessRate') chance *= actorZokuJin.mult;
    // 「ニョロロンの陣」：対象側の陣形が揃っているほど、とりつきを受けにくくなる（耐性）
    const targetZokuJin = getZokuJinMultiplier(target);
    if(targetZokuJin && targetZokuJin.stat === 'possessResist') chance /= targetZokuJin.mult;
    return Math.max(0.3, Math.min(0.95, chance));
  }

  function calcMagicDamage(attacker, defender, power){
    const atkStats = getEffectiveStats(attacker);
    const defStats = getEffectiveStats(defender);
    const base = atkStats.youjutsu / 2 - defStats.mamori / 4 + power / 2;
    const variance = 1 + (Math.random() * 0.2 - 0.1); // ±10%
    return Math.max(1, Math.round(base * variance));
  }

  // 回復系の妖術による回復量 = ようじゅつ/2 + 技の威力/2　(±10%のランダムなブレ、まもりは関係しない)
  function calcMagicHeal(caster, power){
    const stats = getEffectiveStats(caster);
    let base = stats.youjutsu / 2 + power / 2;
    // 「ポカポカの陣」：陣形が揃っているほど、回復量そのものがアップする
    const zokuJin = getZokuJinMultiplier(caster);
    if(zokuJin && zokuJin.stat === 'heal') base *= zokuJin.mult;
    const variance = 1 + (Math.random() * 0.2 - 0.1); // ±10%
    return Math.max(1, Math.round(base * variance));
  }

  // 「すばやさ」が高いほど攻撃を回避しやすい。
  // 防御側のすばやさが攻撃側より高いほど回避率が上がる（両者の差で判定する）。
  // kind が 'magic' で、防御側が妖術回避系スキルを持つ場合はさらに回避率を上乗せする。
  function calcEvasionChance(attacker, defender, kind){
    const atkStats = getEffectiveStats(attacker);
    const defStats = getEffectiveStats(defender);
    const diff = defStats.subayasa - atkStats.subayasa;
    // 差が大きいほど回避率が上がる。差0（同速）のときは基礎回避率10%。
    let chance = 0.1 + diff / 300;
    const magicEvasionBonus = defender.skill && defender.skill.magicEvasionBonus;
    if(kind === 'magic' && magicEvasionBonus){
      chance += magicEvasionBonus;
      return Math.max(0.02, Math.min(0.9, chance));
    }
    return Math.max(0.02, Math.min(0.6, chance));
  }

  // 属性の一覧（このゲームでは以下の7属性を扱う）
  const ELEMENTS = ['火', '水', '雷', '土', '氷', '風', '吸収'];

  // 「うんちく」等、妖術の属性をすべて無くすパッシブスキルが場（自分・敵どちらでも）に
  // 生きている限り発動しているかどうか。「吸収」「回復」は属性ではなく技の特殊効果なので対象外。
  const NON_ELEMENTAL_MAGIC_TAGS = ['吸収', '回復'];
  function isMagicElementNullified(){
    const all = [...party, ...enemyParty];
    return all.some(c => c.alive && c.skill && c.skill.nullifyMagicElement);
  }

  // 属性相性：攻撃属性が対象の「得意」属性と一致するとダメージ0.5倍、
  // 「弱点」属性と一致すると1.8倍になる。属性が無い攻撃や、
  // どちらにも該当しない場合は等倍（1.0倍）のまま。
  const ATTR_RESIST_MULTIPLIER = 0.5;
  const ATTR_WEAK_MULTIPLIER = 1.8;
  function calcAttributeMultiplier(defender, element){
    if(!element) return { multiplier:1, kind:'none' };
    if(defender.tokui && defender.tokui === element) return { multiplier:ATTR_RESIST_MULTIPLIER, kind:'resist' };
    if(defender.jaku && defender.jaku === element) return { multiplier:ATTR_WEAK_MULTIPLIER, kind:'weak' };
    return { multiplier:1, kind:'none' };
  }

  // クリティカル：通常は5%の確率で1.5倍のダメージ。
  // 「超クリティカル」スキルを持つキャラは、いりょく（倍率）がそのスキルの値に置き換わる。
  const CRIT_CHANCE = 0.05;
  const CRIT_MULTIPLIER_DEFAULT = 1.5;
  function rollCritical(attacker, defender){
    let chance = CRIT_CHANCE;
    if(attacker.skill && attacker.skill.gambler) chance += 0.30; // 自分の攻撃がクリティカルになりやすい
    if(defender && defender.skill && defender.skill.gambler) chance += 0.30; // 相手にクリティカルされやすい
    if(Math.random() >= chance) return { critical:false, multiplier:1 };
    const multiplier = (attacker.skill && attacker.skill.critMultiplier) || CRIT_MULTIPLIER_DEFAULT;
    return { critical:true, multiplier };
  }

  // 攻撃を実際に解決する（回避判定 → 命中していればダメージ計算 → 属性相性 → クリティカル判定）
  // kind: 'physical' | 'magic'　　power: 使用する技の威力　　element: 攻撃の属性（無ければ null/undefined）
  function resolveAttack(attacker, defender, kind, power, element){
    const alwaysHit = attacker.skill && attacker.skill.alwaysHit;
    if(!alwaysHit && Math.random() < calcEvasionChance(attacker, defender, kind)){
      return { hit:false, damage:0, critical:false };
    }
    let effectiveElement = element;
    if(kind === 'magic' && effectiveElement && !NON_ELEMENTAL_MAGIC_TAGS.includes(effectiveElement) && isMagicElementNullified()){
      effectiveElement = null;
    }
    let damage = kind === 'magic'
      ? calcMagicDamage(attacker, defender, power)
      : calcPhysicalDamage(attacker, defender, power);
    // ガード無視系のスキル／効果は、物理攻撃にのみ働く。その代わり物理攻撃の威力が本来の93%にダウンする。
    const hasIgnoreGuard = attacker.skill && attacker.skill.ignoreGuard;
    if(kind === 'physical' && hasIgnoreGuard){
      damage = Math.round(damage * 0.93);
    }
    // 「水あそび」等、自分が使う特定属性の妖術ダメージがアップするパッシブスキル（本人にのみ効果）
    if(kind === 'magic' && attacker.skill && attacker.skill.elementDamageBoost
       && effectiveElement === attacker.skill.elementDamageBoost.element){
      damage = Math.round(damage * (1 + attacker.skill.elementDamageBoost.rate));
    }
    const attr = calcAttributeMultiplier(defender, effectiveElement);
    if(attr.multiplier !== 1){
      damage = Math.max(1, Math.round(damage * attr.multiplier));
    }
    const crit = rollCritical(attacker, defender);
    if(crit.critical){
      damage = Math.round(damage * crit.multiplier);
    }
    return { hit:true, damage, critical:crit.critical, critMultiplier:crit.multiplier, attrKind:attr.kind };
  }

  // 「複数回攻撃」のヒット間隔や、ターンとターンの間隔など、
  // キャラクターの行動全体のテンポをまとめて調整するための倍率。
  // 1 で標準速度、0.75 なら通常の75%の速度（=約1.33倍長い間隔）で行動する。
  const ACTION_SPEED_SCALE = 0.75;

  // 1回の行動で複数回攻撃する技（例：ブシニャンの「閃光ぎり」3回攻撃）の処理。
  // ヒットごとに毎回独立で回避判定・クリティカル判定・属性判定を行う。
  // 対象が途中で倒れた場合は、そこで残りの攻撃を打ち切る。
  // 各ヒットの間には少し間隔（HIT_INTERVAL_MS）を空けて演出し、全ヒット終了後に onDone を呼ぶ。
  const ATTACK_KIND_LABEL = { physical:'物理攻撃', magic:'妖術攻撃' };
  const HIT_INTERVAL_MS = Math.round(140 / ACTION_SPEED_SCALE); // 複数回攻撃の1発ごとの間隔
  function performMultiHitAttack(actor, target, kind, power, element, hits, label, onDone){
    const actionLabel = label || ATTACK_KIND_LABEL[kind] || '攻撃';
    let totalDamage = 0;
    let hitCount = 0;
    let anyCritical = false;
    let i = 0;

    function finish(){
      if(hits > 1 && hitCount > 0){
        logLine(`${actor.name} の${actionLabel}は合計 ${totalDamage} ダメージ！（${hitCount}/${hits}発命中）`, anyCritical ? 'critical' : undefined);
      }
      // このキャラの行動（全ヒット分）が完全に終わったので、途中で倒したキャラの人魂化をここで反映する
      flushPendingFaintVisuals();
      if(onDone) onDone();
    }

    function nextHit(){
      if(i >= hits || !target.alive){
        finish();
        return;
      }
      const result = resolveAttack(actor, target, kind, power, element);
      if(!result.hit){
        logLine(`${actor.name} の${actionLabel}！(${i+1}/${hits}発目) → ${target.name} はかわした！`, 'miss');
        showDamagePopup(target, 'MISS', 'miss');
      } else if(kind === 'magic' && target.guarding && target.skill && target.skill.magicReflect){
        // 「から傘シールド」等：ガード中に受けた妖術を、そのまま反射してダメージを与える（威力は反射倍率をかけた分、乱数の上乗せなし）
        const reflectDamage = Math.max(1, Math.round(result.damage * target.skill.magicReflectMult));
        const dealt = applyDamageTo(actor, reflectDamage, true);
        totalDamage += 0;
        hitCount++;
        showActionBubble(target, 'はねかえす！');
        showDamagePopup(actor, String(dealt));
        const hitTag = hits > 1 ? `(${i+1}/${hits}発目) ` : '';
        logLine(`${actor.name} の${actionLabel}！${hitTag}→ ${target.name} は${target.skill.name}で妖術をはねかえした！ ${actor.name} に ${dealt} ダメージ！`);
      } else {
        const ignoreGuard = kind === 'physical' && actor.skill && actor.skill.ignoreGuard;
        const dmg = applyDamageTo(target, result.damage, ignoreGuard);
        totalDamage += dmg;
        hitCount++;
        if(result.critical) anyCritical = true;
        showDamagePopup(target, String(dmg), result.critical ? 'critical' : undefined);
        // 「吸収」属性の妖術は、与えたダメージの半分だけ自分のHPを回復する
        if(kind === 'magic' && element === '吸収' && dmg > 0){
          const healAmount = Math.max(1, Math.round(dmg / 2));
          const before = actor.hp;
          actor.hp = Math.min(actor.maxHp, actor.hp + healAmount);
          const healed = actor.hp - before;
          if(healed > 0){
            updateHpBar(actor);
            logLine(`${actor.name} は${healed}HP吸収した！`, 'heal');
          }
        }
        const critTag = result.critical ? `【クリティカル！×${result.critMultiplier}】` : '';
        const attrTag = result.attrKind === 'weak' ? '【弱点！】' : (result.attrKind === 'resist' ? '【耐性】' : '');
        if(result.critical) showActionBubble(actor, `クリティカル！`);
        const hitTag = hits > 1 ? `(${i+1}/${hits}発目) ` : '';
        const guardTag = target.guarding ? (ignoreGuard ? '（ガード貫通！）' : '（ガード中）') : '';
