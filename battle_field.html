        logLine(`${actor.name} の${actionLabel}！${hitTag}→ ${target.name} に ${dmg} ダメージ！${critTag}${attrTag}${guardTag}`, result.critical ? 'critical' : undefined);
      }
      i++;
      if(i >= hits || !target.alive || !actor.alive){
        finish();
      } else {
        setTimeout(nextHit, HIT_INTERVAL_MS);
      }
    }

    nextHit();
  }

  // 「すばやさ」が高いキャラほど先に行動する。同値の場合はランダムで順番を決める。
  function getTurnOrder(characters){
    return characters
      .map(c => ({ c, r: Math.random() }))
      .sort((a, b) => (getEffectiveStats(b.c).subayasa - getEffectiveStats(a.c).subayasa) || (a.r - b.r))
      .map(x => x.c);
  }
  function getCharEl(c){
    return c.side === 'enemy' ? enemyElements[c.id] : elements[c.id];
  }

  function updateUltGauge(c){
    const el = getCharEl(c);
    if(!el) return;
    const rect = el.querySelector(`#ultclip-${c.id} rect`);
    if(rect){
      rect.setAttribute('y', 24 - (24 * c.ult / 100));
      rect.setAttribute('height', 24 * c.ult / 100);
    }
    // デバフがかかっている間は必殺技ゲージを紫色にし、満タンでも使用不可であることを視覚的に示す
    const gaugeEl = el.querySelector('.ultgauge');
    if(gaugeEl) gaugeEl.classList.toggle('debuffed', hasDebuffEffect(c));
  }

  // 必殺技メーターは最初は空(0)から始まり、「行動」のたびに少しずつ溜まっていく。
  // ランクごとに満タンになるまでの行動回数が異なる。
  // S:25行動 / A:23行動 / B:20行動 / C:15行動 / D:12行動 / E:10行動
  const ULT_MAX = 100;
  const RANK_ACTIONS_TO_FULL = {
    S: 25, A: 23, B: 20, C: 15, D: 12, E: 10
  };
  function ultGainPerAction(rank){
    const actions = RANK_ACTIONS_TO_FULL[rank] || RANK_ACTIONS_TO_FULL.C;
    return ULT_MAX / actions;
  }

  // キャラクター(味方・敵を問わず)が1行動したときに呼ぶ。
  // 必殺技ゲージがまだ満タンでなければ、そのキャラのランクに応じた量だけ溜める。
  function gainUltOnAction(c){
    if(c.ult >= ULT_MAX) return;
    c.ult = Math.min(ULT_MAX, c.ult + ultGainPerAction(c.rank));
    updateUltGauge(c);
    if(c.side === 'ally' && typeof refreshUltReadyHighlights === 'function') refreshUltReadyHighlights();
  }

  const frontPositions = [
    { top:'70%', left:'25%' },
    { top:'70%', left:'50%' },
    { top:'70%', left:'75%' },
  ];

  function reservePositionPx(i){
    const rect = commandBar.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const spacing = 60;
    const cx = rect.left - stageRect.left + rect.width/2;
    const cy = rect.top - stageRect.top + rect.height/2;
    const x = cx + (i - 1) * spacing;
    return { top: cy + 'px', left: x + 'px' };
  }

  function applyPosition(el, pos){
    el.style.top = pos.top;
    el.style.left = pos.left;
  }

  function render(){
    for(let i=0;i<3;i++){
      const el = elements[party[i].id];
      el.classList.remove('state-reserve');
      el.classList.add('state-front');
      applyPosition(el, frontPositions[i]);
    }
    for(let i=0;i<3;i++){
      const el = elements[party[i+3].id];
      el.classList.remove('state-front');
      el.classList.add('state-reserve');
      applyPosition(el, reservePositionPx(i));
    }
  }
  render();
  window.addEventListener('resize', render);
  requestAnimationFrame(render);

  // ---- CPU（敵）側の前衛/後衛レイアウト ----
  // 敵の前衛は画面奥の3箇所。後衛はさらに奥（上）に控えさせる。
  const enemyFrontPositions = [
    { top:'26%', left:'25%' },
    { top:'26%', left:'50%' },
    { top:'26%', left:'75%' },
  ];
  const enemyReservePositions = [
    { top:'8%', left:'35%' },
    { top:'8%', left:'50%' },
    { top:'8%', left:'65%' },
  ];

  function renderEnemy(){
    for(let i=0;i<3;i++){
      const el = enemyElements[enemyParty[i].id];
      el.classList.remove('state-reserve');
      el.classList.add('state-front');
      applyPosition(el, enemyFrontPositions[i]);
    }
    for(let i=0;i<3;i++){
      const el = enemyElements[enemyParty[i+3].id];
      el.classList.remove('state-front');
      el.classList.add('state-reserve');
      applyPosition(el, enemyReservePositions[i]);
    }
  }
  renderEnemy();
  window.addEventListener('resize', renderEnemy);
  requestAnimationFrame(renderEnemy);

  // CPU側も味方と同じ周回順（前衛左→中央→右→後衛右→中央→左→…）でサークルを回す
  const ENEMY_LOOP_ORDER = [0, 1, 2, 5, 4, 3];

  // 「ブロッカー魂」／innateスキル「ブロッカー」：後衛から前衛に出てきたキャラを自動的にガード状態にする。
  // 回転前後の前衛（インデックス0〜2）を比較し、新しく前衛入りしたキャラだけに適用する。
  function applyBlockerSoulOnRotate(arr, beforeFront){
    for(let i=0;i<3;i++){
      const c = arr[i];
      if(!c || beforeFront.includes(c)) continue;
      if(hasEquipEffect(c, 'guardOnEnterFront')){
        c.guarding = true;
        logLine(`${c.name} の${c.equipment.name}！ → ガード状態で前に出た！`);
      } else if(c.skill && c.skill.guardOnEnterFront){
        c.guarding = true;
        logLine(`${c.name} の${c.skill.name}！ → ガード状態で前に出た！`);
      }
    }
  }

  function rotateEnemyParty(dir){
    const beforeFront = ENEMY_LOOP_ORDER.slice(0, 3).map(idx => enemyParty[idx]);
    const ring = ENEMY_LOOP_ORDER.map(idx => enemyParty[idx]);
    if(dir > 0){
      const last = ring.pop();
      ring.unshift(last);
    } else {
      const first = ring.shift();
      ring.push(first);
    }
    ENEMY_LOOP_ORDER.forEach((idx, i) => { enemyParty[idx] = ring[i]; });
    applyBlockerSoulOnRotate(enemyParty, beforeFront);
    renderEnemy();
    // 前衛の並びが変わったので、種族の「陣」インジケーターも更新する
    refreshAllZokuJinIndicators();
    checkZokuJinActivations();
  }

  // 敵の前衛3体が全員気絶した場合、後衛に生存者がいれば強制的に前衛と後衛を入れ替える。
  // 回転中・クールタイム中であっても、全滅は最優先で即座に反映するが、
  // 見た目はサークル入れ替えと同じ「輪をぐるっと回す」アニメーションにする
  // （rotateEnemyParty を3回連続で呼び、前衛↔後衛がまるごと入れ替わるまで回転させる）。
  let forcedEnemySwapAnimating = false;
  function forceSwapEnemyIfFrontWiped(){
    const frontAlive = enemyParty.slice(0, 3).some(c => c.alive);
    const reserveAlive = enemyParty.slice(3, 6).some(c => c.alive);
    if(frontAlive || !reserveAlive || forcedEnemySwapAnimating) return;

    enemyClearTimer();
    enemyPhase = 'idle';

    logLine('てき軍の前衛が全滅！ 後衛と入れ替わる！', 'dead');
    forcedEnemySwapAnimating = true;
    let remaining = 3;
    const stepOnce = () => {
      if(remaining <= 0){
        forcedEnemySwapAnimating = false;
        return;
      }
      rotateEnemyParty(1);
      remaining--;
      setTimeout(stepOnce, 260);
    };
    stepOnce();
  }

  // CPUのフェーズ管理（プレイヤーのドラッグ操作に相当する自動判断版）
  //   'idle'     : いつでも回転を判断できる状態
  //   'rotating' : 回転を実行している最短の演出時間
  //   'cooldown' : 回転後、次に回すまでのクールタイム（プレイヤー側と同じ長さ）
  let enemyPhase = 'idle';
  let enemyPhaseTimerId = null;

  function enemyClearTimer(){
    if(enemyPhaseTimerId){ clearTimeout(enemyPhaseTimerId); enemyPhaseTimerId = null; }
  }

  function enemyRotateSteps(steps){
    enemyClearTimer();
    enemyPhase = 'rotating';

    let remaining = steps;
    const stepOnce = () => {
      if(remaining <= 0){
        logLine('てき軍は前衛を入れ替えた。');
        enemyPhase = 'cooldown';
        enemyPhaseTimerId = setTimeout(() => { enemyPhase = 'idle'; }, COOLDOWN_MS);
        return;
      }
      rotateEnemyParty(1);
      remaining--;
      enemyPhaseTimerId = setTimeout(stepOnce, 260);
    };
    stepOnce();
  }

  // 輪の周回順：前衛左(0) → 前衛中央(1) → 前衛右(2)
  //   → 後衛右(5) → 後衛中央(4) → 後衛左(3) → 前衛左(0) …
  const LOOP_ORDER = [0, 1, 2, 5, 4, 3];

  const timerRing = document.getElementById('timerRing');
  const timerRingFg = document.getElementById('timerRingFg');
  const timerCountdown = document.getElementById('timerCountdown');
  const cooldownLabel = document.getElementById('cooldownLabel');

  const DRAG_LIMIT_MS = 4000;   // ドラッグできる制限時間
  const COOLDOWN_MS   = 7000;   // 次に回せるようになるまでのクールタイム
  const RING_CIRCUMFERENCE = 276.5; // r=44 の円周（2*PI*44 ≈ 276.46）

  let startX = 0;
  let dragging = false;
  const THRESHOLD = 50;

  let phase = 'idle'; // 'idle' | 'dragging' | 'cooldown'
  let phaseTimerId = null;   // setTimeout: フェーズ終了
  let phaseRafId = null;     // requestAnimationFrame: リング/カウントダウン更新
  let phaseStart = 0;
  let phaseDuration = 0;

  function setRingProgress(remainingRatio){
    // remainingRatio: 1 = 満タン(残り時間いっぱい), 0 = 空
    const offset = RING_CIRCUMFERENCE * (1 - remainingRatio);
    timerRingFg.style.strokeDashoffset = offset;
  }

  function updatePhaseVisual(){
    const elapsed = performance.now() - phaseStart;
    const remaining = Math.max(0, phaseDuration - elapsed);
    const remainingRatio = remaining / phaseDuration;
    setRingProgress(remainingRatio);

    const remainingSec = Math.ceil(remaining / 1000);
    const showCountdown = remaining <= 3000 && remaining > 0;

    if(phase === 'dragging'){
      timerRingFg.classList.toggle('urgent', remaining <= 1000);
      timerRingFg.classList.remove('cooldown');
      timerCountdown.classList.toggle('visible', showCountdown);
      timerCountdown.classList.toggle('urgent', remaining <= 1000);
      timerCountdown.textContent = showCountdown ? remainingSec : '';
    } else if(phase === 'cooldown'){
      timerRingFg.classList.add('cooldown');
      timerRingFg.classList.remove('urgent');
      timerCountdown.classList.toggle('visible', showCountdown);
      timerCountdown.classList.remove('urgent');
      timerCountdown.textContent = showCountdown ? remainingSec : '';
    }

    if(remaining > 0 && phase !== 'idle'){
      phaseRafId = requestAnimationFrame(updatePhaseVisual);
    }
  }

  function clearPhaseTimers(){
    if(phaseTimerId){ clearTimeout(phaseTimerId); phaseTimerId = null; }
    if(phaseRafId){ cancelAnimationFrame(phaseRafId); phaseRafId = null; }
  }

  function enterDraggingPhase(){
    clearPhaseTimers();
    phase = 'dragging';
    phaseStart = performance.now();
    phaseDuration = DRAG_LIMIT_MS;

    commandBar.classList.add('dragging');
    commandBar.classList.remove('locked');
    timerRing.classList.add('visible');
    cooldownLabel.classList.remove('visible');
    setRingProgress(1);
    timerRingFg.classList.remove('cooldown');

    updatePhaseVisual();
    phaseTimerId = setTimeout(forceLockAndStartCooldown, DRAG_LIMIT_MS);
  }

  function forceLockAndStartCooldown(){
    // 4秒経過：その時点のメンバー編成で強制固定してドラッグ終了
    dragging = false;
    commandBar.classList.remove('dragging');
    enterCooldownPhase();
  }

  function enterCooldownPhase(){
    clearPhaseTimers();
    phase = 'cooldown';
    phaseStart = performance.now();
    phaseDuration = COOLDOWN_MS;

    commandBar.classList.add('locked');
    timerRing.classList.add('visible');
    timerRingFg.classList.add('cooldown');
    cooldownLabel.classList.add('visible');
    setRingProgress(1);

    // 隊列が固定された = 前衛3体がそれぞれ1行動したとみなし、必殺技ゲージを溜める
    for(let i=0;i<3;i++){ gainUltOnAction(party[i]); }

    updatePhaseVisual();
    phaseTimerId = setTimeout(endCooldown, COOLDOWN_MS);
  }

  function endCooldown(){
    clearPhaseTimers();
    phase = 'idle';
    commandBar.classList.remove('locked');
    timerRing.classList.remove('visible');
    timerCountdown.classList.remove('visible');
    cooldownLabel.classList.remove('visible');
    setRingProgress(0);
  }

  function rotateParty(dir){
    const beforeFront = LOOP_ORDER.slice(0, 3).map(idx => party[idx]);
    const ring = LOOP_ORDER.map(idx => party[idx]);
    if(dir > 0){
      const last = ring.pop();
      ring.unshift(last);
    } else {
      const first = ring.shift();
      ring.push(first);
    }
    LOOP_ORDER.forEach((idx, i) => { party[idx] = ring[i]; });
    applyBlockerSoulOnRotate(party, beforeFront);
    render();
    // 前衛の並びが変わったので、種族の「陣」インジケーターも更新する
    refreshAllZokuJinIndicators();
    checkZokuJinActivations();
    // 前衛／後衛の並びが変わったので、おはらいで選択できるキャラの見た目も更新する
    if(typeof refreshOharaiSelectableHighlights === 'function') refreshOharaiSelectableHighlights();
  }

  // 前衛3体が全員気絶した場合、後衛に生存者がいれば強制的に前衛と後衛を入れ替える。
  // ドラッグ操作中・クールタイム中であっても、全滅は最優先で即座に反映するが、
  // 見た目はサークルドラッグ入れ替えと同じ「輪をぐるっと回す」アニメーションにする
  // （rotateParty を3回連続で呼び、前衛↔後衛がまるごと入れ替わるまで回転させる）。
  let forcedSwapAnimating = false;
  function forceSwapIfFrontWiped(){
    const frontAlive = party.slice(0, 3).some(c => c.alive);
    const reserveAlive = party.slice(3, 6).some(c => c.alive);
    if(frontAlive || !reserveAlive || forcedSwapAnimating) return;

    // 進行中の操作があれば中断し、輪を回転させて前衛と後衛を入れ替える
    clearPhaseTimers();
    dragging = false;
    phase = 'idle';
    commandBar.classList.remove('dragging', 'locked');
    timerRing.classList.remove('visible');
    timerCountdown.classList.remove('visible');
    cooldownLabel.classList.remove('visible');

    logLine('前衛が全滅！ 後衛と入れ替わる！', 'dead');
    forcedSwapAnimating = true;
    let remaining = 3;
    const stepOnce = () => {
      if(remaining <= 0){
        forcedSwapAnimating = false;
        return;
      }
      rotateParty(1);
      remaining--;
      setTimeout(stepOnce, 260);
    };
    stepOnce();
  }

  // わざ・ねらう・おはらいの各選択/効果モード中はサークル回転（前衛↔後衛の入れ替え操作）を無効化する
  function isCircleRotationLocked(){
    if(typeof ultSelectMode !== 'undefined' && ultSelectMode) return true;
    if(typeof oharaiSelectMode !== 'undefined' && oharaiSelectMode) return true;
    if(typeof nerauMode !== 'undefined' && nerauMode) return true;
    const ultOv = document.getElementById('ultOverlay');
    if(ultOv && ultOv.classList.contains('active')) return true;
    const oharaiOv = document.getElementById('oharaiOverlay');
    if(oharaiOv && oharaiOv.classList.contains('active')) return true;
    return false;
  }

  function pointerDown(e){
    if(phase === 'cooldown') return; // クールタイム中は操作不可
    if(isCircleRotationLocked()) return; // わざ・ねらう・おはらい選択中は操作不可
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    if(phase !== 'dragging') enterDraggingPhase();
  }
  function pointerMove(e){
    if(!dragging || phase !== 'dragging') return;
    if(isCircleRotationLocked()) return; // わざ・ねらう・おはらい選択中は操作不可
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - startX;
    if(Math.abs(dx) > THRESHOLD){
      rotateParty(dx < 0 ? 1 : -1);
      startX = x;
    }
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;
    if(phase === 'dragging'){
      // ユーザーが自分で指を離した場合も、そこでサークルは固定され、
      // 引き続きクールタイムに入る（4秒経過を待たずに固定 → クールタイム開始）
      commandBar.classList.remove('dragging');
      enterCooldownPhase();
    }
  }

  commandBar.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);

  commandBar.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('touchmove', pointerMove, {passive:true});
  window.addEventListener('touchend', pointerUp);

  // ============================================================
  // 自動戦闘ループ
  //   前衛にいる味方・敵キャラのすばやさ順に、自動で行動する。
  //   行動パターン：物理攻撃・妖術攻撃・ガード・取り憑き・サボり（ランダム選択）
  //   ガード中は、次に自分の番が回ってくるまで被ダメージを約50%カットする。
  //   攻撃対象の上には三角矢印（▼）を表示する。
  //   CPU側も6体編成で、状況に応じて自動でサークルを回し前衛を入れ替える。
  // ============================================================
  const BASIC_ATTACK_POWER = 20;
  const TURN_INTERVAL_MS = Math.round(1600 / ACTION_SPEED_SCALE); // 1体の行動が終わってから次の行動までの間隔

  party.forEach(c => { c.side = 'ally'; c.alive = true; c.guarding = false; });
  enemyParty.forEach(c => { c.side = 'enemy'; c.alive = true; c.guarding = false; });

  const battleLogEl = document.getElementById('battleLog');
  function logLine(text, cls){
    const line = document.createElement('div');
    line.className = 'log-line' + (cls ? ' ' + cls : '');
    line.textContent = text;
    battleLogEl.prepend(line);
    while(battleLogEl.children.length > 30) battleLogEl.removeChild(battleLogEl.lastChild);
  }

  function updateHpBar(c){
    const el = getCharEl(c);
    if(!el) return;
    const bar = el.querySelector('.hpbar > div:last-child') || el.querySelector('.hpbar > div');
    if(bar) bar.style.width = Math.max(0, Math.min(100, (c.hp / c.maxHp) * 100)) + '%';
    // 気絶した瞬間に即座に人魂化はさせず、applyFaintVisual() が呼ばれるまでは通常の見た目を保つ。
    // （まだ死んでいない＝alive===true に戻った場合は、待たずに即座に通常表示へ戻す）
    if(c.alive){
      el.classList.remove('dead');
    }
    // 隊列が変わったりHPが変動したりするたびに、「〇〇の陣」が発動中かどうかの見た目も更新する
    updateZokuJinIndicator(c);
  }

  // 「〇〇の陣」バナーの表示キュー（複数の陣が同時に発動しても、順番に1つずつ表示する）
  let zokuJinBannerQueue = [];
  let zokuJinBannerPlaying = false;
  function queueZokuJinBanner(info){
    zokuJinBannerQueue.push(info);
    playNextZokuJinBanner();
  }
  function playNextZokuJinBanner(){
    if(zokuJinBannerPlaying || zokuJinBannerQueue.length === 0) return;
    const banner = document.getElementById('zokuJinBanner');
    const nameEl = document.getElementById('zokuJinName');
    const descEl = document.getElementById('zokuJinDesc');
    if(!banner || !nameEl || !descEl) return;
    zokuJinBannerPlaying = true;
    const info = zokuJinBannerQueue.shift();
    nameEl.textContent = info.label;
    descEl.textContent = info.desc;
    banner.style.setProperty('--zoku-color', info.color);
    banner.classList.remove('show');
    void banner.offsetWidth; // 強制リフローしてアニメーションを再スタートさせる
    banner.classList.add('show');
    setTimeout(() => {
      banner.classList.remove('show');
      zokuJinBannerPlaying = false;
      playNextZokuJinBanner();
    }, 1600);
  }

  // 現在発動中の「陣」（陣営＋種族の組み合わせ）を記録しておき、新しく発動した瞬間だけバナーを出す
  // ※バナー表示は味方側の陣のみが対象（敵側の陣形発動ではバナーを出さない）
  let activeZokuJinState = {};
  function checkZokuJinActivations(){
    const newState = {};
    [['ally', party], ['enemy', enemyParty]].forEach(([side, arr]) => {
      const front = arr.slice(0, 3);
      front.forEach(c => {
        if(!c || !c.alive || !c.zoku) return;
        const zj = getZokuJinMultiplier(c);
        if(!zj) return;
        const key = side + ':' + c.zoku;
        if(!newState[key]) newState[key] = { zoku: c.zoku, label: zj.label, side };
      });
    });
    Object.keys(newState).forEach(key => {
      if(!activeZokuJinState[key]){
        const info = newState[key];
        if(info.side !== 'ally') return; // 敵側の陣形発動ではバナーを出さない
        const jin = ZOKU_JIN[info.zoku];
        queueZokuJinBanner({
          label: info.label,
          desc: (jin && jin.desc) || '',
          color: ZOKU_COLORS[info.zoku] || '#e8c874',
        });
      }
    });
    activeZokuJinState = newState;
  }

  // 「〇〇の陣」が発動中のキャラには、種族のイメージカラーで縁取りしたリングをトークンに表示する
  function updateZokuJinIndicator(c){
    const el = getCharEl(c);
    if(!el) return;
    const token = el.querySelector('.token');
    if(!token) return;
    const zokuJin = getZokuJinMultiplier(c);
    if(zokuJin && ZOKU_COLORS[c.zoku]){
      token.style.boxShadow = `0 0 0 3px ${ZOKU_COLORS[c.zoku]}, 0 0 8px 2px ${ZOKU_COLORS[c.zoku]}`;
      token.title = `${zokuJin.label}発動中（${zokuJin.count}体隣接・${zokuJin.mult}倍）`;
    } else {
      token.style.boxShadow = '';
      token.title = '';
    }
  }

  // 陣営全体（前衛3体＋後衛）の陣インジケーターをまとめて更新する
  function refreshAllZokuJinIndicators(){
    party.forEach(updateZokuJinIndicator);
    enemyParty.forEach(updateZokuJinIndicator);
  }

  // 気絶の見た目（人魂化）を実際に反映する。ロジック上の alive=false とは切り離して、
  // 「攻撃したキャラの行動が完全に終わったタイミング」でまとめて呼び出す。
  function applyFaintVisual(c){
    const el = getCharEl(c);
    if(!el) return;
    if(!c.alive) el.classList.add('dead');
  }

  // 現在「前衛」にいる生存キャラ（味方・敵ともに、それぞれの隊列の先頭3体が前衛）
  function getFrontRowCombatants(){
    const allyFront = party.slice(0, 3).filter(c => c.alive);
    const enemyFront = enemyParty.slice(0, 3).filter(c => c.alive);
    return [...allyFront, ...enemyFront];
  }

  // ---- ターゲット矢印 ----
  let targetArrowEl = null;
  function showTargetArrow(targetChar){
    hideTargetArrow();
    const el = getCharEl(targetChar);
    if(!el) return;
    const arrow = document.createElement('div');
    arrow.className = 'target-arrow';
    arrow.textContent = '▼';
    el.appendChild(arrow);
    targetArrowEl = arrow;
  }
  function hideTargetArrow(){
    if(targetArrowEl && targetArrowEl.parentNode){
      targetArrowEl.parentNode.removeChild(targetArrowEl);
    }
    targetArrowEl = null;
  }

  // ---- とりつき演出：actor の位置から target の位置へ、オーラの玉が飛んでいく ----
  // 到達（またはタイムアウト）したら onArrive を呼ぶ。
  function showPossessTransfer(actor, target, kind, onArrive){
    const actorEl = getCharEl(actor);
    const targetEl = getCharEl(target);
    if(!actorEl || !targetEl){ if(onArrive) onArrive(); return; }

    const stageRect = stage.getBoundingClientRect();
    const startRect = actorEl.getBoundingClientRect();
    const endRect = targetEl.getBoundingClientRect();
    const startX = startRect.left + startRect.width / 2 - stageRect.left;
    const startY = startRect.top + startRect.height / 2 - stageRect.top;
    const endX = endRect.left + endRect.width / 2 - stageRect.left;
    const endY = endRect.top + endRect.height / 2 - stageRect.top;

    const orb = document.createElement('div');
    orb.className = 'possess-orb ' + (kind === 'buff' ? 'buff' : 'debuff');
    orb.style.left = startX + 'px';
    orb.style.top = startY + 'px';
    orb.innerHTML = '<div class="possess-orb-core"></div>';
    stage.appendChild(orb);

    // 位置を変える前に一度強制リフローして、開始位置からのtransitionを確実に発火させる
    void orb.offsetWidth;
    orb.style.left = endX + 'px';
    orb.style.top = endY + 'px';

    let finished = false;
    function finish(){
      if(finished) return;
      finished = true;
      orb.classList.add('arrived');
      setTimeout(() => { if(orb.parentNode) orb.parentNode.removeChild(orb); }, 260);
      if(onArrive) onArrive();
    }
    orb.addEventListener('transitionend', finish, { once:true });
    // transitionendが発火しない環境向けのフォールバック
    setTimeout(finish, 650);
  }

  // ---- 行動種類の吹き出し（物理攻撃以外の行動時にキャラクターの上に表示） ----
  const ACTION_LABELS = {
    physical: '攻撃！',
    magic: '妖術攻撃！',
    guard: 'ガード！',
    possess: '取り憑き！',
    slack: 'サボり…'
  };
  // 行動の吹き出しを見せてから実際にダメージ（や回復）を与えるまでの間（演出のタメ）。
  // ACTION_SPEED_SCALE と連動させ、行動テンポ全体が遅くなればこの間も比例して長くなる。
  const ACTION_BUBBLE_DELAY_MS = Math.round(450 / ACTION_SPEED_SCALE);
  // ============================================================
  // 妖術攻撃の技名別エフェクト演出
  // ============================================================

  // 指定した要素の中心座標を、.stage を基準にした相対座標で返す
  function getStageRelativeCenter(el){
    const stage = document.querySelector('.battle-screen .stage');
    if(!stage || !el) return { x:0, y:0 };
    const stageRect = stage.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    return {
      x: elRect.left + elRect.width / 2 - stageRect.left,
      y: elRect.top + elRect.height / 2 - stageRect.top,
    };
  }

  // magic-fx-〇〇 クラスのエフェクト片を1つ生成し、渡されたアニメーションkeyframesで動かして自動削除する
  function spawnMagicFx(cls, initialStyle, keyframes, duration, easing){
    const layer = document.getElementById('magicFxLayer');
    if(!layer) return null;
    const el = document.createElement('div');
    el.className = 'magic-fx ' + cls;
    Object.assign(el.style, initialStyle);
    layer.appendChild(el);
    const anim = el.animate(keyframes, { duration, easing: easing || 'ease-in', fill:'forwards' });
    anim.onfinish = () => { if(el.parentNode) el.parentNode.removeChild(el); };
    return anim;
  }

  // 妖術のいりょく(power)から、演出の「派手さ」倍率を算出する。
  // 同じ属性でも上位互換の技（いりょく80）ほど倍率が大きくなり、粒の数・大きさ・発光が強くなる。
  // （いりょく50を基準0.7、80を基準1.2として補間。範囲外のいりょくにも対応できるよう0.6〜1.5にクランプ）
  function getFxIntensity(power){
    const p = typeof power === 'number' ? power : 50;
    const raw = 0.7 + ((p - 50) / 30) * 0.5;
    return Math.max(0.6, Math.min(1.5, raw));
  }

  // 大滝の術／水流の術：画面上から対象に向かって水の柱が勢いよく流れ落ちる（いりょくが高いほど太く、発光も強い）
  function playWaterfallFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const w = Math.round(38 * k);
    spawnMagicFx('magic-fx-waterfall',
      { left:(pos.x - w/2) + 'px', top:'-160px', height:'160px', width:w+'px', opacity:'0',
        boxShadow:`0 0 ${Math.round(18*k)}px ${Math.round(6*k)}px rgba(120,200,255,${Math.min(0.9,0.6*k)})` },
      [
        { top:'-160px', height:'160px', opacity:0.9 },
        { top:(pos.y - 260) + 'px', height:'160px', opacity:1 },
        { top:(pos.y - 90) + 'px', height:(170*k)+'px', opacity:1 },
      ], 480, 'cubic-bezier(0.5,0,0.9,1)');
    setTimeout(() => {
      const sw = Math.round(90 * k), sh = Math.round(36 * k);
      spawnMagicFx('magic-fx-splash',
        { left:(pos.x - sw/2) + 'px', top:(pos.y - sh/2) + 'px', width:sw+'px', height:sh+'px', opacity:'0.9', transform:'scale(0.4)' },
        [ { opacity:0.9, transform:'scale(0.4)' }, { opacity:0, transform:`scale(${1.4+0.4*k})` } ], 380, 'ease-out');
    }, 420);
  }

  // いん石の術／落石の術：斜め上から複数の岩塊が降ってくる（いりょくが高いほど岩の数が増え、大きくなる）
  function playRockFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const count = Math.max(3, Math.round(5 * k));
    const size = Math.round(26 * k);
    for(let i = 0; i < count; i++){
      const delay = i * 90;
      const startX = pos.x + (Math.random() * 160 - 80) - 260;
      const startY = -80 - Math.random() * 60;
      setTimeout(() => {
        spawnMagicFx('magic-fx-rock',
          { left:startX + 'px', top:startY + 'px', width:size+'px', height:size+'px', opacity:'1',
            boxShadow:`0 0 ${Math.round(10*k)}px ${Math.round(2*k)}px rgba(80,50,20,0.6)` },
          [
            { left:startX + 'px', top:startY + 'px', transform:'rotate(0deg)' },
            { left:(pos.x - size/2 + (Math.random()*30-15)) + 'px', top:(pos.y - 10) + 'px', transform:'rotate(340deg)' },
          ], 420 + Math.random()*80, 'cubic-bezier(0.6,0,1,1)');
      }, delay);
    }
  }

  // 吹雪の術／氷結の術：四方から氷の結晶が対象に収束する（いりょくが高いほど飛来する方向・数が増える）
  function playIceFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const baseDirs = [[-140,-100],[140,-100],[-140,100],[140,100],[0,-150],[0,150]];
    const extraDirs = [[-200,0],[200,0]];
    const dirs = k >= 1.05 ? baseDirs.concat(extraDirs) : baseDirs;
    const size = Math.round(16 * k);
    dirs.forEach((d, i) => {
      setTimeout(() => {
        spawnMagicFx('magic-fx-ice',
          { left:(pos.x + d[0] - size/2) + 'px', top:(pos.y + d[1] - size/2) + 'px', width:size+'px', height:size+'px', opacity:'0.9' },
          [
            { left:(pos.x + d[0] - size/2) + 'px', top:(pos.y + d[1] - size/2) + 'px', opacity:0.9, transform:'rotate(0deg)' },
            { left:(pos.x - size/2) + 'px', top:(pos.y - size/2) + 'px', opacity:1, transform:'rotate(180deg)' },
          ], 380, 'ease-in');
      }, i * 35);
    });
  }

  // れんごくの術：対象の足元から炎が立ち上る（いりょくが高いほど炎の本数が増え、大きく高く上がる）
  function playFlameFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const count = Math.max(4, Math.round(6 * k));
    const w = Math.round(20 * k), h = Math.round(34 * k);
    for(let i = 0; i < count; i++){
      const offsetX = (Math.random() * 60 - 30);
      setTimeout(() => {
        spawnMagicFx('magic-fx-flame',
          { left:(pos.x + offsetX - w/2) + 'px', top:(pos.y + 30) + 'px', width:w+'px', height:h+'px', opacity:'0.95' },
          [
            { top:(pos.y + 30) + 'px', opacity:0.95, transform:'scale(1)' },
            { top:(pos.y - 40 * k) + 'px', opacity:0, transform:'scale(0.4)' },
          ], 520, 'ease-out');
      }, i * 40);
    }
  }

  // 嵐の術：対象の周りを風が渦巻く（いりょくが高いほど渦の輪の数が増え、大きく広がる）
  function playWindFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const rings = Math.max(2, Math.round(3 * k));
    const size = Math.round(70 * k);
    for(let i = 0; i < rings; i++){
      setTimeout(() => {
        spawnMagicFx('magic-fx-wind',
          { left:(pos.x - size/2) + 'px', top:(pos.y - size/2) + 'px', width:size+'px', height:size+'px', opacity:'0', transform:'scale(0.3) rotate(0deg)' },
          [
            { opacity:0.9, transform:'scale(0.5) rotate(0deg)' },
            { opacity:0.6, transform:`scale(${1.15*k}) rotate(320deg)` },
            { opacity:0, transform:`scale(${1.4*k}) rotate(540deg)` },
          ], 620, 'ease-out');
      }, i * 120);
    }
  }

  // 雷神の術：空から対象へ稲妻が落ちる（いりょくが高いほど雷が太く、発光も強い）
  function playBoltFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const w = Math.round(10 * k);
    spawnMagicFx('magic-fx-bolt',
      { left:(pos.x - w/2) + 'px', top:'-120px', height:'0px', width:w+'px', opacity:'0',
        boxShadow:`0 0 ${Math.round(20*k)}px ${Math.round(8*k)}px rgba(255,240,150,0.8)` },
      [
        { height:'0px', opacity:0 },
        { height:(pos.y + 120) + 'px', opacity:1 },
        { height:(pos.y + 120) + 'px', opacity:1 },
        { height:(pos.y + 120) + 'px', opacity:0 },
      ], 320, 'ease-in');
    if(k >= 1.05){
      // 上位互換（いりょく80）は、着弾と同時にもう一筋の細い雷を添えてより激しく見せる
      setTimeout(() => {
        spawnMagicFx('magic-fx-bolt',
          { left:(pos.x - w/2 + 16) + 'px', top:'-100px', height:'0px', width:Math.round(w*0.6)+'px', opacity:'0' },
          [
            { height:'0px', opacity:0 },
            { height:(pos.y + 100) + 'px', opacity:0.8 },
            { height:(pos.y + 100) + 'px', opacity:0 },
          ], 260, 'ease-in');
      }, 60);
    }
  }

  // （未使用の技名向け）対象を暗い斬撃が斬りつける汎用エフェクト。技名に「斬」を含む場合のフォールバックとして使う
  function playSlashFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const w = Math.round(140 * k);
    spawnMagicFx('magic-fx-slash',
      { left:(pos.x - w/2) + 'px', top:(pos.y - 5) + 'px', width:w+'px', opacity:'0', transform:'rotate(-30deg) scaleX(0.3)' },
      [
        { opacity:0, transform:'rotate(-30deg) scaleX(0.3)' },
        { opacity:1, transform:'rotate(-30deg) scaleX(1)' },
        { opacity:0, transform:'rotate(-30deg) scaleX(1.1)' },
      ], 340, 'ease-out');
  }

  // 回復の術／極楽の術：柔らかい光の粒子が対象を包むように舞い上がる（いりょくが高いほど粒子が増え、より高く舞う）
  function playLightFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const count = Math.max(4, Math.round(7 * k));
    const size = Math.round(14 * k);
    for(let i = 0; i < count; i++){
      const offsetX = (Math.random() * 70 - 35);
      setTimeout(() => {
        spawnMagicFx('magic-fx-light',
          { left:(pos.x + offsetX - size/2) + 'px', top:(pos.y + 35) + 'px', width:size+'px', height:size+'px', opacity:'0' },
          [
            { top:(pos.y + 35) + 'px', opacity:0 },
            { top:(pos.y - 10) + 'px', opacity:1 },
            { top:(pos.y - 55 * k) + 'px', opacity:0 },
          ], 700, 'ease-out');
      }, i * 60);
    }
  }

  // 死神の術など：対象から術者へ向かって小さな玉が飛んでいき、HPを吸い取る様子を表す（いりょくが高いほど玉の数が増える）
  function playAbsorbFx(actorEl, targetEl, intensity){
    const k = intensity || 1;
    const from = getStageRelativeCenter(targetEl);
    const to = getStageRelativeCenter(actorEl);
    const count = Math.max(3, Math.round(4 * k));
    const size = Math.round(14 * k);
    for(let i = 0; i < count; i++){
      setTimeout(() => {
        spawnMagicFx('magic-fx-orb',
          { left:(from.x - size/2) + 'px', top:(from.y - size/2) + 'px', width:size+'px', height:size+'px', opacity:'0.95' },
          [
            { left:(from.x - size/2) + 'px', top:(from.y - size/2) + 'px', opacity:0.95, offset:0 },
            { left:((from.x + to.x) / 2 - size/2) + 'px', top:(Math.min(from.y, to.y) - 60) + 'px', opacity:1, offset:0.5 },
            { left:(to.x - size/2) + 'px', top:(to.y - size/2) + 'px', opacity:0, offset:1 },
          ], 520, 'ease-in-out');
      }, i * 90);
    }
  }

  // 未分類の妖術：対象を中心に魔法陣風のバーストが弾ける汎用エフェクト（いりょくが高いほど大きく広がる）
  function playBurstFx(targetEl, intensity){
    const k = intensity || 1;
    const pos = getStageRelativeCenter(targetEl);
    const size = Math.round(90 * k);
    spawnMagicFx('magic-fx-burst',
      { left:(pos.x - size/2) + 'px', top:(pos.y - size/2) + 'px', width:size+'px', height:size+'px', opacity:'0', transform:'scale(0.3) rotate(0deg)' },
      [
        { opacity:0.9, transform:'scale(0.3) rotate(0deg)' },
        { opacity:0.7, transform:`scale(${1.1*k}) rotate(180deg)` },
        { opacity:0, transform:`scale(${1.3*k}) rotate(320deg)` },
      ], 480, 'ease-out');
  }

  // 技名（または要素・キーワード）から、再生するエフェクトの種類を決めて実行する。
  // いりょく(power)に応じて演出の派手さ（粒の数・大きさ・発光）も変える。
  // 新しい妖術を追加した場合も、名前に含まれるキーワードで自動的に近いエフェクトへ振り分けられる
  function playMagicSkillEffect(actor, target, skillName, power){
    const actorEl = getCharEl(actor);
    const targetEl = getCharEl(target);
    if(!targetEl) return;
    const name = skillName || '';
    const k = getFxIntensity(power);
    // 完全一致の技名テーブル（既存の全妖術を網羅）
    const exactTable = {
      '大滝の術':   () => playWaterfallFx(targetEl, k),
      '水流の術':   () => playWaterfallFx(targetEl, k),
      'いん石の術': () => playRockFx(targetEl, k),
      '落石の術':   () => playRockFx(targetEl, k),
      '吹雪の術':   () => playIceFx(targetEl, k),
      '氷結の術':   () => playIceFx(targetEl, k),
      'れんごくの術': () => playFlameFx(targetEl, k),
      '嵐の術':     () => playWindFx(targetEl, k),
      '雷神の術':   () => playBoltFx(targetEl, k),
      '死神の術':   () => playAbsorbFx(actorEl, targetEl, k),
      '回復の術':   () => playLightFx(targetEl, k),
      '極楽の術':   () => playLightFx(targetEl, k),
    };
    if(exactTable[name]){ exactTable[name](); return; }
    // 未登録の技名は、名前に含まれるキーワードから近いエフェクトを推測する（将来追加される妖術にも対応）
    if(name.includes('吸収') || name.includes('死神')){ playAbsorbFx(actorEl, targetEl, k); return; }
    if(name.includes('滝') || name.includes('水') || name.includes('波')){ playWaterfallFx(targetEl, k); return; }
    if(name.includes('石') || name.includes('岩') || name.includes('隕')){ playRockFx(targetEl, k); return; }
    if(name.includes('氷') || name.includes('雪') || name.includes('吹雪')){ playIceFx(targetEl, k); return; }
    if(name.includes('炎') || name.includes('火') || name.includes('ごく')){ playFlameFx(targetEl, k); return; }
    if(name.includes('嵐') || name.includes('風')){ playWindFx(targetEl, k); return; }
    if(name.includes('雷')){ playBoltFx(targetEl, k); return; }
    if(name.includes('闇') || name.includes('斬')){ playSlashFx(targetEl, k); return; }
    if(name.includes('回復') || name.includes('極楽') || name.includes('光')){ playLightFx(targetEl, k); return; }
    playBurstFx(targetEl, k);
  }

  function showActionBubble(actor, label){
    const el = getCharEl(actor);
    if(!el) return;
    const old = el.querySelector('.action-bubble');
    if(old) old.remove();
    const bubble = document.createElement('div');
    bubble.className = 'action-bubble';
    bubble.textContent = label;
    el.appendChild(bubble);
    setTimeout(() => { if(bubble.parentNode) bubble.parentNode.removeChild(bubble); }, 1600);
  }

  // ---- 被ダメージ（または回復・ミス）の数値をキャラの頭上にポップアップ表示する ----
  function showDamagePopup(target, text, cls){
    const el = getCharEl(target);
    if(!el) return;
    const popup = document.createElement('div');
    popup.className = 'damage-popup' + (cls ? ' ' + cls : '');
    popup.textContent = text;
    // 同時に複数ヒットした時にすべて重ならないよう、横方向に少しランダムなブレを持たせる
    const jitter = (Math.random() - 0.5) * 26;
    popup.style.left = `calc(50% + ${jitter}px)`;
    el.appendChild(popup);
    setTimeout(() => { if(popup.parentNode) popup.parentNode.removeChild(popup); }, 1000);
  }

  // 「もえるとうし」等、味方が気絶した時にちからがアップするパッシブスキルを持つ
  // 生きている同じ陣営のキャラ全員に、ちからアップの蓄積を1つ加える（永続・重複可）。
  function triggerAllyFaintBonus(fainted){
    const arr = fainted.side === 'enemy' ? enemyParty : party;
    arr.forEach(c => {
      if(c === fainted || !c.alive) return;
      if(c.skill && c.skill.chikaraOnAllyFaint){
        c.moeruStacks = (c.moeruStacks || 0) + 1;
        logLine(`${c.name} の${c.skill.name}！ → ちからがアップした！`);
      }
    });
    // 「大将」等、敵を倒すたびちからがアップするパッシブスキルの発動（倒れた側の相手陣営が対象）
    const foeArr = fainted.side === 'enemy' ? party : enemyParty;
    foeArr.forEach(c => {
      if(!c.alive) return;
      if(c.skill && c.skill.chikaraOnEnemyFaint){
        c.moeruStacks = (c.moeruStacks || 0) + 1;
        logLine(`${c.name} の${c.skill.name}！ → ちからがアップした！`);
      }
    });
  }

  // ---- ダメージ適用（ガード中は約50%カット。ただしガード無視スキルを持つ攻撃者には効かない） ----
  let pendingFaintVisuals = []; // このアクター行動中に気絶したが、まだ人魂ビジュアルにしていないキャラ
  function applyDamageTo(defender, rawDamage, ignoreGuard){
    const finalDamage = (defender.guarding && !ignoreGuard) ? Math.round(rawDamage * 0.5) : rawDamage;
    let newHp = defender.hp - finalDamage;
    // 「ガマン魂」：HPが0以下になる一撃を、一度だけHP1で耐える
    if(newHp <= 0 && !defender.usedGamanSoul && hasEquipEffect(defender, 'enduranceOnce')){
      newHp = 1;
      defender.usedGamanSoul = true;
      logLine(`${defender.name} の${defender.equipment.name}！ → こらえた！`);
      showActionBubble(defender, 'こらえた！');
    }
    defender.hp = Math.max(0, newHp);
    updateHpBar(defender);
    if(defender.hp <= 0 && defender.alive){
      defender.alive = false;
      updateHpBar(defender);
      logLine(`${defender.name} を倒した！`, 'dead');
      // 「もえるとうし」等、味方が気絶した時にちからがアップするパッシブスキルの発動
      triggerAllyFaintBonus(defender);
      // 倒したキャラにピンが刺さっていた場合は自動的に外す
      if(typeof pinnedTarget !== 'undefined' && pinnedTarget === defender && typeof clearPin === 'function'){
        clearPin();
      }
      // 人魂化の見た目は、攻撃したキャラの行動が完全に終わるまで保留する
      pendingFaintVisuals.push(defender);
    }
    // 前衛が全滅した側があれば、その場で強制的に前衛と後衛を入れ替える
    forceSwapIfFrontWiped();
    forceSwapEnemyIfFrontWiped();
    // 誰かが倒れた／前衛が入れ替わったことで隣接関係が変わった可能性があるので、陣の見た目を全員分更新する
    refreshAllZokuJinIndicators();
    return finalDamage;
  }

  // 保留中の人魂化をまとめて反映する（攻撃したキャラの行動が終わったタイミングで呼ぶ）
  function flushPendingFaintVisuals(){
    if(pendingFaintVisuals.length === 0) return;
    pendingFaintVisuals.forEach(c => applyFaintVisual(c));
    pendingFaintVisuals = [];
  }

  function pickRandomTarget(candidates){
    const alive = candidates.filter(c => c.alive);
    if(alive.length === 0) return null;
    return alive[Math.floor(Math.random() * alive.length)];
  }

  // 「おせわ」等、両隣にいる味方を回復するパッシブスキル。
  // 本来はスキル所持者自身が行動したときだけ発動していたが、
  // 「誰かが行動するたび」に、場にいる所持者全員（自分自身が行動したときも含む）が発動するようにする。
  // 前衛・後衛の区別なく、隊列上の隣（±1）が対象。
  // healer は所持者、side はそのパーティ（'player'/'enemy'）を指定する。
  function healNeighborsFor(healer, side){
    if(!healer.alive || !healer.skill || !healer.skill.neighborHeal) return;
    const arr = side === 'enemy' ? enemyParty : party;
    const idx = arr.indexOf(healer);
    if(idx < 0) return;
    const rate = healer.skill.neighborHealRate || 0.02;
    const healerZokuJin = getZokuJinMultiplier(healer);
    const healerHealMult = (healerZokuJin && healerZokuJin.stat === 'heal') ? healerZokuJin.mult : 1;
    [idx - 1, idx + 1].forEach(i => {
      if(i < 0 || i >= arr.length) return;
      const neighbor = arr[i];
      if(!neighbor || !neighbor.alive || neighbor.hp >= neighbor.maxHp) return;
      const healAmount = Math.max(1, Math.round(neighbor.maxHp * rate * healerHealMult));
      const before = neighbor.hp;
      neighbor.hp = Math.min(neighbor.maxHp, neighbor.hp + healAmount);
      const healed = neighbor.hp - before;
      if(healed > 0){
        updateHpBar(neighbor);
        logLine(`${healer.name} の${healer.skill.name}！ → ${neighbor.name} が${healed}HP回復した！`, 'heal');
      }
    });
  }

  // 誰か（actor）が行動するたびに呼ぶ。自陣・敵陣どちらの隣接ケアスキル持ちも、
  // 前衛にいれば毎回発動する（actor自身がスキル持ちかどうかは問わない）。
  function healNeighbors(actor){
    party.forEach(c => healNeighborsFor(c, 'player'));
    enemyParty.forEach(c => healNeighborsFor(c, 'enemy'));
  }

  // ---- 行動パターン ----
  const ACTIONS = ['physical', 'magic', 'guard', 'possess', 'slack'];

  // 場（自分・敵どちらでも）に「いあつかん」等、誰もサボらなくなるパッシブスキルを持つ
  // 生きているキャラがいるかどうか。
  function isNoSlackAuraActive(){
    const all = [...party, ...enemyParty];
    return all.some(c => c.alive && c.skill && c.skill.noSlackAura);
  }

  // 場（自分・敵どちらでも）に「どんどんフィールド」等、敵味方全員の全ステータスをアップさせる
  // パッシブスキルを持つ生きているキャラがいるかどうか（アップ幅も一緒に返す）。
  function getAllStatsFieldBoostRate(){
    const all = [...party, ...enemyParty];
    let rate = 0;
    all.forEach(c => {
      if(c.alive && c.skill && c.skill.allStatsUpField){
        rate = Math.max(rate, c.skill.allStatsUpField);
      }
    });
    return rate;
  }

  // サボりやすさ性格＋行動性格の重みに基づいて、このターンの行動を1つ選ぶ
  function chooseAction(actor){
    // 「ガード魂」を装備している場合は、行動性格に関わらず常にガードを選ぶ
    if(hasEquipEffect(actor, 'alwaysGuard')) return 'guard';

    const slackRate = isNoSlackAuraActive() ? 0 : ((actor.slackSeikaku && actor.slackSeikaku.rate) || 0);
    if(Math.random() < slackRate) return 'slack';

    const rateTable = buildActionRateTable(actor);
    const entries = Object.entries(rateTable);
    const total = entries.reduce((sum, [, w]) => sum + w, 0);
    let roll = Math.random() * total;
    for(const [action, w] of entries){
      roll -= w;
      if(roll < 0) return action;
    }
    return entries[entries.length - 1][0];
  }

  function performAction(actor, done){
    done = done || function(){};
    if(!actor.alive){ done(); return; }

    // 自分の番が来た時点でガード状態は解除（「次に番が回ってくるまで」ガードするため）
    actor.guarding = false;
    // 自分にかかっているとりつき効果の残りターンを消化
    tickPossessEffects(actor);
    // 継続ダメージ（DoT）などでここまでに気絶した場合は、以降の行動を行わずに終える
    if(!actor.alive){ done(); return; }
    // 「おせわ」等、行動するたびに発動する隣接ケア系パッシブスキル
    healNeighbors(actor);

    // 「行動不能」状態なら、何もできずにターンを終える
    if(isStunned(actor)){
      const stunEffect = actor.possessEffects.find(e => e.stun);
      const stunName = (stunEffect && stunEffect.name) || '行動不能';
      logLine(`${actor.name} は${stunName}で動けない…！`);
      done();
      return;
    }

    // 「混乱」状態なら、一定確率で行動が空振りに終わる
    if(typeof isConfused === 'function' && isConfused(actor) && Math.random() < 0.5){
      logLine(`${actor.name} は混乱していて行動できなかった…`);
      gainUltOnAction(actor);
      done();
      return;
    }

    const opponents = actor.side === 'ally' ? getFrontRowCombatants().filter(c => c.side === 'enemy') : getFrontRowCombatants().filter(c => c.side === 'ally');
    const action = chooseAction(actor);
    const magicElement = actor.magicSkill && actor.magicSkill.element;
    const isHealMagic = action === 'magic' && magicElement === '回復';

    if((action === 'physical' || (action === 'magic' && !isHealMagic)) && opponents.length === 0){
      // 攻撃対象がいなければサボりに切り替え
      logLine(`${actor.name} は行動できず立ち尽くした…`);
      done();
      return;
    }

    // 攻撃・ガード・取り憑き・サボりを問わず、行動したことに変わりはないので必殺技ゲージを溜めて終了する
    function finishAction(){
      gainUltOnAction(actor);
      done();
    }

    switch(action){
      case 'physical': {
        const target = pickAttackTarget(opponents);
        showTargetArrow(target);
        showActionBubble(actor, ACTION_LABELS.physical);
        const physicalElement = actor.physicalSkill && actor.physicalSkill.element;
        const hits = (actor.physicalSkill && actor.physicalSkill.hits) || 1;
        // 吹き出しを見せてから少し間を置いてダメージを与える
        setTimeout(() => {
          performMultiHitAttack(actor, target, 'physical', BASIC_ATTACK_POWER, physicalElement, hits, '物理攻撃', finishAction);
        }, ACTION_BUBBLE_DELAY_MS);
        return;
      }
      case 'magic': {
        const magicName = (actor.magicSkill && actor.magicSkill.name) || ACTION_LABELS.magic;
        const magicPower = (actor.magicSkill && actor.magicSkill.power) || BASIC_ATTACK_POWER;
        showActionBubble(actor, magicName);
        if(isHealMagic){
          // 回復系の妖術：敵ではなく、自分の側で一番HP割合が低い前衛（自分含む）を回復する
          const allyFront = getFrontRowCombatants().filter(c => c.side === actor.side);
          const injured = allyFront.filter(c => c.hp < c.maxHp);
          const healTarget = injured.length > 0
            ? injured.reduce((worst, c) => (c.hp / c.maxHp < worst.hp / worst.maxHp ? c : worst))
            : actor;
          showTargetArrow(healTarget);
          // 吹き出しを見せてから少し間を置いて回復を適用する
          setTimeout(() => {
            playMagicSkillEffect(actor, healTarget, magicName, magicPower);
            const healAmount = calcMagicHeal(actor, BASIC_ATTACK_POWER);
            const before = healTarget.hp;
            healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + healAmount);
            const healed = healTarget.hp - before;
            updateHpBar(healTarget);
            const skillName = actor.magicSkill && actor.magicSkill.name || '回復の術';
            logLine(`${actor.name} の${skillName}！ → ${healTarget.name} が${healed}HP回復した！`, 'heal');
            finishAction();
          }, ACTION_BUBBLE_DELAY_MS);
          return;
        }
        const target = pickAttackTarget(opponents);
        showTargetArrow(target);
        const hits = (actor.magicSkill && actor.magicSkill.hits) || 1;
        // 吹き出しを見せてから少し間を置いてダメージを与える
        setTimeout(() => {
          playMagicSkillEffect(actor, target, magicName, magicPower);
          performMultiHitAttack(actor, target, 'magic', BASIC_ATTACK_POWER, magicElement, hits, '妖術攻撃', finishAction);
        }, ACTION_BUBBLE_DELAY_MS);
        return;
      }
      case 'guard': {
        actor.guarding = true;
        showActionBubble(actor, ACTION_LABELS.guard);
        logLine(`${actor.name} はガードの構えを取った。`);
        finishAction();
        return;
      }
      case 'possess': {
        showActionBubble(actor, ACTION_LABELS.possess);
        // 味方への「とりつき」はバフ、敵への「とりつき」はデバフとして扱う。
        // 対象は自分の側（バフ）または相手の側（デバフ）の前衛からランダムに選ぶ。
        const allies = actor.side === 'ally' ? getFrontRowCombatants().filter(c => c.side === 'ally') : getFrontRowCombatants().filter(c => c.side === 'enemy');
        const foes = opponents;
        // キャラ固有のとりつき技を持つ場合は、必ずその技の種類（バフ／デバフ）に従う。
        // （黒鬼の「鬼の力」はバフ専用なのにデバフを撃つ…といった矛盾を防ぐため）
        // 固有技を持たない場合のみ、行動性格の possessBias に従ってランダムに決める。
        const presetKind = actor.possessSkill && actor.possessSkill.kind;
        let doBuff;
        if(presetKind === 'buff') doBuff = true;
        else if(presetKind === 'debuff') doBuff = false;
        else {
          const possessBias = (actor.actionSeikaku && actor.actionSeikaku.possessBias != null) ? actor.actionSeikaku.possessBias : 0.5;
          doBuff = Math.random() < possessBias && allies.length > 0;
        }
        const pool = doBuff ? allies : foes;
        const target = pickRandomTarget(pool);
        if(!target){
          logLine(`${actor.name} は取り憑く相手がおらず不発に終わった…`);
          finishAction();
          return;
        }

        showTargetArrow(target);
        const kind = doBuff ? 'buff' : 'debuff';
        // とりつきの成功判定（デバフ＝敵への取り憑きのみ失敗しうる。味方へのバフは常に成功）。
        // 「きゅうきょくのヤミ」等のスキルを持つ場合は必ず成功する。
        const alwaysSucceeds = actor.skill && actor.skill.possessAlwaysSucceeds;
        if(kind === 'debuff' && !alwaysSucceeds && Math.random() >= calcPossessSuccessChance(actor, target)){
          logLine(`${actor.name} の取り憑きは${target.name}に効かなかった…`);
          finishAction();
          return;
        }

        // ここから先は成功確定。自分から対象へオーラの玉が飛んでいく演出を挟んでから効果を適用する。
        function applyPossessResultAndLog(){
          // キャラ固有のとりつき技があればそれを使い、無ければ標準的な効果からランダムに選ぶ。
          const preset = actor.possessSkill;
          if(preset && preset.kind === kind && preset.taunt){
            // 「挑発」系のとりつき：ステータス変化はなく、対象が常に狙われるようになる
            applyTauntEffect(target, { duration: 5, name: preset.name });
            logLine(`${actor.name} の${preset.name}！ → ${target.name} は常に敵から狙われるようになった！`);
            return;
          }
          if(preset && preset.kind === kind && preset.stun){
            // 「行動不能」系のとりつき：対象は次の行動から動けなくなる
            applyStunEffect(target, { name: preset.name });
            logLine(`${actor.name} の${preset.name}！ → ${target.name} は行動不能になった！`);
            return;
          }
          if(preset && preset.kind === kind && preset.hot){
            // 「継続回復」系のとりつき：対象は自分の行動のたびにHPが少しずつ回復するようになる
            applyHotEffect(target, { duration: 5, name: preset.name, rate: preset.hotRate });
            logLine(`${actor.name} の${preset.name}！ → ${target.name} はじわじわHPが回復するようになった！`);
            return;
          }
          if(preset && preset.kind === kind && preset.dot){
            // 「継続ダメージ」系のとりつき：対象は自分の行動のたびにHPが少しずつ減っていくようになる
            applyDotEffect(target, { name: preset.name, rate: preset.dotRate, powerMult: getZokuPossessPowerMult(actor) });
            logLine(`${actor.name} の${preset.name}！ → ${target.name} はじわじわHPが減っていくようになった！`);
            return;
          }
          let grade, scope, stat, name;
          if(preset && preset.kind === kind){
            grade = preset.grade; scope = preset.scope; stat = preset.stat; name = preset.name;
          } else {
            grade = 'normal';
            scope = Math.random() < 0.5 ? 'all' : 'single';
            stat = ['chikara','mamori','youjutsu','subayasa'][Math.floor(Math.random()*4)];
            name = kind === 'buff' ? '通常アップ' : '通常ダウン';
          }
          const effect = applyPossessEffect(target, { kind, grade, scope, stat, duration: kind === 'buff' ? 5 : 3, name, powerMult: getZokuPossessPowerMult(actor) });
          if(effect){
            const gradeLabel = { small:'小', normal:'', large:'大', super:'超', ultimate:'究極' }[grade];
            const dirLabel = kind === 'buff' ? 'アップ' : 'ダウン';
            const statLabel = { chikara:'ちから', mamori:'まもり', youjutsu:'ようじゅつ', subayasa:'すばやさ' }[stat];
            const scopeLabel = scope === 'all' ? '全ステータス' : statLabel;
            logLine(`${actor.name} の${name}！ → ${target.name} の${scopeLabel}が${gradeLabel}${dirLabel}（約${Math.round(effect.rate*1000)/10}%）！`);
          } else {
            logLine(`${actor.name} は${target.name}に取り憑いた…！`);
          }
        }

        showPossessTransfer(actor, target, kind, () => {
          applyPossessResultAndLog();
          finishAction();
        });
        return;
      }
      case 'slack': {
        showActionBubble(actor, ACTION_LABELS.slack);
        logLine(`${actor.name} はサボった。`);
        break;
      }
    }

    // 攻撃・ガード・取り憑き・サボりを問わず、行動したことに変わりはないので必殺技ゲージを溜める
    // （physical/magic の攻撃系は performMultiHitAttack のコールバックで既に finishAction 済みのため return 済み。
    //  ここに到達するのは possess / slack など同期的に完結する行動のみ）
    finishAction();
  }

  // ============================================================
  // CPU側のサークル操作（前衛/後衛の入れ替え）
  //   プレイヤーの「輪をドラッグして回す」操作をCPUが自動で行う。
  //   状況（前衛の残りHPやピンチ度合い）を見て、入れ替えるかどうか・
  //   何回転させるかを判断する。
  // ============================================================
  function evaluateEnemyFrontRowDanger(){
    // 前衛3体（生存者のみ）の残りHP割合の平均が低いほど「危険」と判断する
    const front = enemyParty.slice(0, 3).filter(c => c.alive);
    if(front.length === 0) return 0;
    const avgHpRatio = front.reduce((sum, c) => sum + c.hp / c.maxHp, 0) / front.length;
    return 1 - avgHpRatio; // 0=安全, 1=全員瀕死
  }

  function cpuMaybeRotate(){
    if(battleOver) return;
    if(enemyPhase !== 'idle') return; // すでに回転中/クールタイム中なら何もしない

    const danger = evaluateEnemyFrontRowDanger();
    const frontAlive = enemyParty.slice(0, 3).filter(c => c.alive).length;
    const reserveAlive = enemyParty.slice(3, 6).filter(c => c.alive).length;

    // 前衛に生存者がいない、または前衛が十分危険で、交代できる後衛がいる場合に輪を回す
    const shouldRotate = reserveAlive > 0 && (frontAlive === 0 || danger > 0.55 || Math.random() < 0.12);
    if(!shouldRotate) return;

    // 危険度が高いほど、多めに回して後衛を前に出す（1〜3回転）
    const steps = frontAlive === 0 ? 3 : (danger > 0.75 ? 2 : 1);
    enemyRotateSteps(steps);
  }

  // ---- ターン進行 ----
  let battleLoopTimerId = null;
  let battleOver = false;

  function checkBattleEnd(){
    const alliesAlive = party.some(c => c.alive);
    const enemiesAlive = enemyParty.some(c => c.alive);
    if(!alliesAlive || !enemiesAlive){
      battleOver = true;
      logLine(!alliesAlive ? '味方は全滅した…' : '敵を全滅させた！', 'dead');
      return true;
    }
    return false;
  }

  let turnQueue = [];

  // ============================================================
  // 必殺技（わざ）まわり
  //   ・現在行動中のキャラを追跡し、その行動が終わってから必殺技を発動する
  //   ・チャージが完了したキャラは pendingUltimates に積まれ、順番に処理される
  // ============================================================
  let actingCharacter = null;      // 現在 performAction 実行中のキャラ
  let pendingUltimates = [];       // チャージ完了済み・発動待ちのキャラ一覧
  let ultBusy = false;             // 必殺技演出の再生中かどうか

  // 必殺技チャージが完了した時に呼ばれる。行動中のキャラでなければ即座に発動を試みる。
  function onUltChargeComplete(actor){
    if(!actor.alive){ return; }
    pendingUltimates.push(actor);
    logLine(`${actor.name} の必殺技チャージが完了した！`);
    tryFirePendingUltimates();
  }

  // 行動中のキャラがいなければ、待機中の必殺技を順に発動する。
  function tryFirePendingUltimates(){
    if(battleOver || ultBusy) return;
    if(actingCharacter) return; // 誰かが行動の最中は、その行動が終わるまで待つ
    if(pendingUltimates.length === 0) return;

    const actor = pendingUltimates.shift();
    if(!actor.alive){
      tryFirePendingUltimates();
      return;
    }
    ultBusy = true;
    if(battleLoopTimerId){ clearTimeout(battleLoopTimerId); battleLoopTimerId = null; }
    playUltimateCastBanner(actor, () => {
      performUltimate(actor, () => {
        ultBusy = false;
        if(checkBattleEnd()) return;
        tryFirePendingUltimates();
        if(pendingUltimates.length === 0){
          battleLoopTimerId = setTimeout(processTurnQueue, TURN_INTERVAL_MS);
        }
      });
    });
  }

  function playUltimateCastBanner(actor, done){
    const banner = document.getElementById('ultCastBanner');
    const who = document.getElementById('ultCastWho');
    const nameEl = document.getElementById('ultCastName');
    const ultName = (actor.ultSkill && actor.ultSkill.name) || '必殺技';
    who.textContent = `${actor.name} の必殺技！`;
    nameEl.textContent = ultName;
    banner.classList.remove('show');
    // 強制リフローしてアニメーションを再スタートさせる
    void banner.offsetWidth;
    banner.classList.add('show');
    showActionBubble(actor, ultName);
    setTimeout(() => { banner.classList.remove('show'); done(); }, 1300);
  }

  // 必殺技本体の効果処理。ult データ（power / hits / target / heal / revive / buffAll / debuff）を見て分岐する。
  function performUltimate(actor, done){
    done = done || function(){};
    if(!actor.alive){ done(); return; }
    const ult = actor.ultSkill;
    if(!ult){ logLine(`${actor.name} は必殺技を発動した！`); done(); return; }

    const isAlly = actor.side === 'ally';
    const ownFront = (isAlly ? party : enemyParty).slice(0, 3).filter(c => c.alive);
    const foeFront = (isAlly ? enemyParty : party).slice(0, 3).filter(c => c.alive);

    // ---- 自分（またはHP0の前衛を含む味方全体）を対象にする系 ----
    if(ult.target === 'self'){
      if(ult.heal === 'full'){
        actor.hp = actor.maxHp;
        updateHpBar(actor);
      }
      if(ult.buffAll){
        applyPossessEffect(actor, { kind:'buff', grade:'large', scope:'all', duration: 5, name: ult.name, powerMult: getZokuPossessPowerMult(actor) });
      }
      // 「から傘バリケード」等：単一ステータスのみを指定倍率でアップさせる自己バフ（grade/scope/statを個別指定）
      if(ult.selfBuff){
        applyPossessEffect(actor, { kind:'buff', grade: ult.selfBuff.grade, scope: ult.selfBuff.scope, stat: ult.selfBuff.stat, duration: 5, name: ult.name, powerMult: getZokuPossessPowerMult(actor) });
      }
      // 「から傘バリケード」等：自分自身に挑発をかけ、常に狙われるようにする
      if(ult.selfTaunt){
        applyTauntEffect(actor, { duration: 5, name: ult.name });
      }
      logLine(`${actor.name} の${ult.name}！ → 自身が復活の力に満ちた！`, 'heal');
      done();
      return;
    }

    if(ult.target === 'ally-front'){
      const arr = isAlly ? party : enemyParty;
      const frontSlots = arr.slice(0, 3);
      if(ult.revive){
        frontSlots.forEach(c => {
          if(!c.alive){
            c.alive = true;
            c.hp = Math.max(1, Math.round(c.maxHp * 0.3));
            updateHpBar(c);
            logLine(`${c.name} は${ult.name}の力で復活した！`, 'heal');
          }
        });
      }
      const ultHealZokuJin = getZokuJinMultiplier(actor);
      const ultHealMult = (ultHealZokuJin && ultHealZokuJin.stat === 'heal') ? ultHealZokuJin.mult : 1;
      const healAmount = ult.healAll ? Math.round((getEffectiveStats(actor).youjutsu / 2 + 125) * ultHealMult * (0.9 + Math.random()*0.2)) : 0;
      frontSlots.forEach(c => {
        if(!c.alive) return;
        const before = c.hp;
        c.hp = ult.heal === 'full' || !ult.healAll ? c.maxHp : Math.min(c.maxHp, c.hp + healAmount);
        if(ult.heal === 'full') c.hp = c.maxHp;
        updateHpBar(c);
        const healed = c.hp - before;
        if(healed > 0) logLine(`${actor.name} の${ult.name}！ → ${c.name} が${healed}HP回復した！`, 'heal');
      });
      done();
      return;
    }

    // ---- 敵を対象にする攻撃系（単体 or 全体、複数ヒット対応） ----
    const targets = ult.target === 'all' ? foeFront : [pickAttackTarget(foeFront)].filter(Boolean);
    if(targets.length === 0){
      logLine(`${actor.name} の${ult.name}！ → しかし相手がいなかった…`);
      done();
      return;
    }
    const hits = ult.hits || 1;

    function applyDebuffsAndFinish(){
      // ---- 追加デバフ ----
      if(ult.debuff === 'stun'){
        targets.forEach(t => { if(t.alive) applyStunEffect(t, { name: `${ult.name}の衝撃` }); });
        logLine(`${ult.name}の余波で敵は行動不能になった！`);
      } else if(ult.debuff === 'confuse'){
        targets.forEach(t => { if(t.alive) applyConfuseEffect(t, { name: `${ult.name}の混乱`, duration: 3 }); });
        logLine(`${ult.name}の余波で敵は混乱した！`);
      } else if(ult.debuff === 'all-stats-down'){
        const ultPowerMult = getZokuPossessPowerMult(actor);
        targets.forEach(t => { if(t.alive) applyPossessEffect(t, { kind:'debuff', grade:'large', scope:'all', duration: 3, name: `${ult.name}の呪縛`, powerMult: ultPowerMult }); });
        logLine(`${ult.name}の余波で敵の全ステータスがダウンした！`);
      }
      done();
    }

    // 複数対象がいる場合（全体攻撃）は、対象全員に同時にダメージを与える。
    // （単体対象の場合はそのまま1体だけ処理する。複数回攻撃の発ごとの間隔は維持される）
    let remaining = targets.filter(t => t.alive).length;
    if(remaining === 0){
      applyDebuffsAndFinish();
      return;
    }
    targets.forEach(target => {
      if(!target.alive) return;
      performMultiHitAttack(actor, target, 'physical', ult.power || 0, null, hits, ult.name, () => {
        remaining--;
        if(remaining <= 0) applyDebuffsAndFinish();
      });
    });
  }

  // 「混乱」デバフ：一定確率で行動が不発になる、簡易な独自効果。既存のとりつき効果配列に相乗りする。
  function applyConfuseEffect(target, { duration = 3, name }){
    if(!target.possessEffects) target.possessEffects = [];
    const effect = { kind: 'debuff', grade: null, scope: null, stat: null, rate: 0, duration, name, confuse: true, confuseDuration: duration };
    target.possessEffects.push(effect);
    updateAuraEffect(target);
    return effect;
  }
  function isConfused(c){
    return !!(c.possessEffects && c.possessEffects.some(e => e.confuse));
  }

  function processTurnQueue(){
    if(battleOver) return;
    if(ultBusy || pendingUltimates.length > 0) return; // 必殺技の処理を優先し、通常ターンは一時停止
    hideTargetArrow();

    if(checkBattleEnd()) return;

    // キューが空になったら、次のラウンドの行動順を新たに作り直す
    if(turnQueue.length === 0){
      cpuMaybeRotate();
      const front = getFrontRowCombatants();
      // 「閃光」等、一度だけ先制攻撃できるスキル・装備（閃光魂）を持つキャラがいれば、
      // まだ使っていない場合に限り、その回だけ行動順の先頭に割り込ませる。
      const preemptChar = front.find(c => c.alive && !c.usedPreemptiveStrike &&
        ((c.skill && c.skill.preemptiveStrike) || hasEquipEffect(c, 'preemptiveStrike')));
      if(preemptChar){
        preemptChar.usedPreemptiveStrike = true;
        const rest = getTurnOrder(front.filter(c => c !== preemptChar));
        turnQueue = [preemptChar, ...rest];
        const preemptSkillName = (preemptChar.skill && preemptChar.skill.preemptiveStrike) ? preemptChar.skill.name : preemptChar.equipment.name;
        logLine(`${preemptChar.name} の${preemptSkillName}！ → 先制攻撃！`);
      } else {
        turnQueue = getTurnOrder(front);
      }
      // 前衛に誰もいない等で組めない場合は、少し待って再チェックする
      if(turnQueue.length === 0){
        battleLoopTimerId = setTimeout(processTurnQueue, TURN_INTERVAL_MS);
        return;
      }
    }

    const actor = turnQueue.shift();
    // ラウンド開始時に前衛にいても、途中で倒れていたり、
    // 前衛全滅による強制入れ替えで後衛に下がっていたりしたら行動をスキップして次へ
    const stillInFront = (actor.side === 'ally' ? party : enemyParty).slice(0, 3).includes(actor);
    if(!actor.alive || !stillInFront){
      battleLoopTimerId = setTimeout(processTurnQueue, 0);
      return;
    }

    actingCharacter = actor;
    performAction(actor, () => {
      actingCharacter = null;

      if(checkBattleEnd()) return;

      // この行動が終わったタイミングで、発動待ちの必殺技があれば優先して処理する
      if(pendingUltimates.length > 0){
        tryFirePendingUltimates();
        return;
      }

      battleLoopTimerId = setTimeout(processTurnQueue, TURN_INTERVAL_MS);
    });
  }

  // ============================================================
  // 「わざ」ボタン：必殺技ゲージが満タンのキャラをタップで選び、
  // 4種類のミニゲームのいずれかでチャージを行う。
  // ============================================================
  const wazaBtn = document.querySelector('.battle-screen .btn-waza');
  const ultSelectHint = document.getElementById('ultSelectHint');
  let ultSelectMode = false;

  function getAllUltReadyAllies(){
    return party.filter(c => c.alive && c.ult >= ULT_MAX && !hasDebuffEffect(c));
  }

  function refreshUltReadyHighlights(){
    party.forEach(c => {
      const el = elements[c.id];
      if(!el) return;
      const ready = c.alive && c.ult >= ULT_MAX && !hasDebuffEffect(c);
      el.classList.toggle('ult-ready', ready && !ultSelectMode);
      el.classList.toggle('ult-selectable', ready && ultSelectMode);
    });
  }

  function setUltSelectMode(on){
    ultSelectMode = on;
    if(on && typeof setOharaiSelectMode === 'function') setOharaiSelectMode(false); // おはらい選択とは排他
    wazaBtn.classList.toggle('ult-armed', on);
    ultSelectHint.style.display = on ? 'block' : 'none';
    commandBar.classList.toggle('selection-passthrough', on);
    refreshUltReadyHighlights();
  }

  wazaBtn.addEventListener('click', () => {
    if(battleOver) return;
    const readyChars = getAllUltReadyAllies();
    if(!ultSelectMode){
      if(readyChars.length === 0){
        logLine('必殺技ゲージが満タンのキャラがいない…');
        return;
      }
      setUltSelectMode(true);
    } else {
      setUltSelectMode(false);
    }
  });

  party.forEach(c => {
    const el = elements[c.id];
    if(!el) return;
    el.addEventListener('click', () => {
      if(!ultSelectMode) return;
      if(!c.alive || c.ult < ULT_MAX) return;
      if(hasDebuffEffect(c)){
        logLine(`${c.name} はデバフを受けていて必殺技を発動できない…`);
        return;
      }
      setUltSelectMode(false);
      startUltChargeMinigame(c);
    });
  });

  // ============================================================
  // 「おはらい」ボタン：後衛にいるデバフ中の味方を選んで、とりつきを解除するミニゲーム
  // ============================================================
  const oharaiBtn = document.querySelector('.battle-screen .btn-oharai');
  const oharaiSelectHint = document.getElementById('oharaiSelectHint');
  let oharaiSelectMode = false;

  // 後衛（インデックス3〜5）にいて、かつデバフを受けている生存中の味方だけが対象
  function getBackRowDebuffedAllies(){
    return party.filter((c, idx) => idx >= 3 && c.alive && hasDebuffEffect(c));
  }

  function refreshOharaiSelectableHighlights(){
    party.forEach((c, idx) => {
      const el = elements[c.id];
      if(!el) return;
      const eligible = idx >= 3 && c.alive && hasDebuffEffect(c);
      el.classList.toggle('oharai-selectable', eligible && oharaiSelectMode);
    });
  }

  function setOharaiSelectMode(on){
    oharaiSelectMode = on;
    if(on && typeof setUltSelectMode === 'function') setUltSelectMode(false); // 必殺技選択とは排他
    oharaiBtn.classList.toggle('oharai-armed', on);
    oharaiSelectHint.style.display = on ? 'block' : 'none';
    commandBar.classList.toggle('selection-passthrough', on);
    refreshOharaiSelectableHighlights();
  }

  oharaiBtn.addEventListener('click', () => {
    if(battleOver) return;
    if(!oharaiSelectMode){
      const targets = getBackRowDebuffedAllies();
      if(targets.length === 0){
        logLine('後衛にデバフを受けているキャラがいない…');
        return;
      }
      setOharaiSelectMode(true);
    } else {
      setOharaiSelectMode(false);
    }
  });

  party.forEach((c, idx) => {
    const el = elements[c.id];
    if(!el) return;
    el.addEventListener('click', () => {
      if(!oharaiSelectMode) return;
      if(idx < 3) return; // 前衛は対象外
      if(!c.alive || !hasDebuffEffect(c)) return;
      setOharaiSelectMode(false);
      startOharaiMinigame(c);
    });
  });

  // ============================================================
  // 「ねらう」ボタン：スコープを動かして敵にピンを刺し、狙う対象を指定する
  // ============================================================
  const nerauBtn = document.querySelector('.battle-screen .btn-nerau');
  const nerauScope = document.getElementById('nerauScope');
  let nerauMode = false;
  let pinnedTarget = null; // ピンが刺さっている敵キャラ（enemyParty の要素）
  let pinEl = null;        // ピンのDOM要素
  let hoveredEnemyEl = null;

  function stagePointFromEvent(ev){
    const rect = stage.getBoundingClientRect();
    const point = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function findEnemyElUnderPoint(clientX, clientY){
    const els = document.elementsFromPoint(clientX, clientY);
    const hit = els.find(el => el.classList && el.classList.contains('enemy-member') && !el.classList.contains('dead'));
    return hit || null;
  }

  function moveScopeTo(x, y){
    nerauScope.style.left = x + 'px';
    nerauScope.style.top = y + 'px';
  }

  function setNerauHover(el){
    if(hoveredEnemyEl === el) return;
    if(hoveredEnemyEl) hoveredEnemyEl.classList.remove('nerau-hover');
    hoveredEnemyEl = el;
    if(hoveredEnemyEl) hoveredEnemyEl.classList.add('nerau-hover');
    nerauScope.classList.toggle('locked-on', !!hoveredEnemyEl);
  }

  function clearPin(){
    if(pinEl && pinEl.parentNode) pinEl.parentNode.removeChild(pinEl);
    pinEl = null;
    pinnedTarget = null;
  }

  function setPinOn(enemyChar){
    clearPin();
    pinnedTarget = enemyChar;
    const el = enemyElements[enemyChar.id];
    if(!el) return;
    const pin = document.createElement('div');
    pin.className = 'target-pin';
    pin.innerHTML = `
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="6" fill="#ff4646" stroke="#7a1010" stroke-width="1.5"></circle>
        <path d="M12 14 L12 22" stroke="#7a1010" stroke-width="2.5" stroke-linecap="round"></path>
        <circle cx="10" cy="6" r="1.6" fill="rgba(255,255,255,0.85)"></circle>
      </svg>
    `;
    el.appendChild(pin);
    pinEl = pin;
    logLine(`${enemyChar.name} にねらいを定めた！`);
  }

  function isPinned(c){
    return pinnedTarget === c && c.alive;
  }

  function setNerauMode(on){
    nerauMode = on;
    nerauBtn.classList.toggle('nerau-armed', on);
    stage.classList.toggle('nerau-active', on);
    nerauScope.classList.toggle('visible', on);
    if(!on){
      setNerauHover(null);
      nerauScope.classList.remove('locked-on');
    }
  }

  nerauBtn.addEventListener('click', () => {
    if(battleOver) return;
    setNerauMode(!nerauMode);
  });

  function handleNerauMove(ev){
    if(!nerauMode) return;
    const p = stagePointFromEvent(ev);
    moveScopeTo(p.x, p.y);
    const rawPoint = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const el = findEnemyElUnderPoint(rawPoint.clientX, rawPoint.clientY);
    setNerauHover(el);
  }

  function handleNerauTap(ev){
    if(!nerauMode) return;
    const rawPoint = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
    const el = findEnemyElUnderPoint(rawPoint.clientX, rawPoint.clientY);
    if(!el) return;
    const id = el.dataset.id;
    const enemyChar = enemyParty.find(c => c.id === id);
    if(!enemyChar || !enemyChar.alive) return;

    if(pinnedTarget === enemyChar){
      // 既にピンが刺さっているキャラを再度タップ → ピンを抜く
      clearPin();
      logLine(`${enemyChar.name} へのねらいを外した。`);
    } else {
      // 別のキャラに刺し直す（すでにピンがあれば自動的に付け替わる）
      setPinOn(enemyChar);
    }
  }

  stage.addEventListener('mousemove', handleNerauMove);
  stage.addEventListener('touchmove', handleNerauMove, { passive:true });
  stage.addEventListener('click', handleNerauTap);
  stage.addEventListener('touchend', handleNerauTap);

  // ------------------------------------------------------------
  // ミニゲーム共通の土台
  // ------------------------------------------------------------
  const ultOverlay = document.getElementById('ultOverlay');
  const ultFrame = document.getElementById('ultFrame');
  const ultInstruction = document.getElementById('ultInstruction');
  const ultCasterName = document.getElementById('ultCasterName');
  const ultOverlayTitle = document.getElementById('ultOverlayTitle');
  const ultProgressFg = document.getElementById('ultProgressFg');
  const ULT_PROGRESS_CIRC = 2 * Math.PI * 150;

  const ULT_MINIGAMES = ['tap', 'trace', 'spin', 'clock'];
  const ultChargeFill = document.getElementById('ultChargeFill');
  let currentMinigameCleanup = null;

  function setUltProgress(ratio){
    const clamped = Math.max(0, Math.min(1, ratio));
    ultProgressFg.style.strokeDashoffset = String(ULT_PROGRESS_CIRC * (1 - clamped));
    // 枠内の背景も、必殺技ゲージと同じ水色で下から満ちていくように連動させる
    if(ultChargeFill) ultChargeFill.style.height = (clamped * 100) + '%';
  }

  // ミニゲーム用に差し込んだ子要素だけを取り除く（水位エフェクト用の ultChargeFill は残す）
  function clearUltFrameContent(){
    Array.from(ultFrame.children).forEach(child => {
      if(child !== ultChargeFill) child.remove();
    });
  }

  function startUltChargeMinigame(actor){

  // ---- ①「打て！」：飛び交う黄色円盤をすべてタップ ----
  function startTapMinigame(onComplete){
    ultOverlayTitle.textContent = '必殺技チャージ「打て！」';
    ultInstruction.textContent = '飛び交う円盤をすべてタップ！';
    const DISC_COUNT = 8;
    const frameW = 320, frameH = 320;
    const discs = [];
    let remaining = DISC_COUNT;
    let rafId = null;
    let stopped = false;

    for(let i = 0; i < DISC_COUNT; i++){
      const disc = document.createElement('div');
      disc.className = 'ult-disc';
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.4 + Math.random() * 1.6;
      const state = {
        el: disc,
        x: 60 + Math.random() * (frameW - 120),
        y: 60 + Math.random() * (frameH - 120),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        hit: false
      };
      disc.addEventListener('pointerdown', (ev) => {
        ev.stopPropagation();
        if(state.hit) return;
        state.hit = true;
        disc.classList.add('hit');
        // タップ済みの円盤はポインタイベントを無効化し、透明になったあとDOMから完全に取り除く。
        // これをしないと、透明な当たり判定だけが残り続けて後から重なる円盤へのタップを奪ってしまい、
        // 「打つたびに飛び交う範囲がどんどん狭くなる」ように見えるバグの原因になっていた。
        disc.style.pointerEvents = 'none';
        setTimeout(() => { if(disc.parentNode) disc.parentNode.removeChild(disc); }, 200);
        remaining--;
        setUltProgress((DISC_COUNT - remaining) / DISC_COUNT);
        if(remaining <= 0){
          stopped = true;
          if(rafId) cancelAnimationFrame(rafId);
          setTimeout(onComplete, 250);
        }
      });
      ultFrame.appendChild(disc);
      discs.push(state);
    }

    function tick(){
      if(stopped) return;
      discs.forEach(s => {
        if(s.hit) return;
        s.x += s.vx; s.y += s.vy;
        if(s.x < 24 || s.x > frameW - 24) s.vx *= -1;
        if(s.y < 24 || s.y > frameH - 24) s.vy *= -1;
        s.el.style.left = s.x + 'px';
        s.el.style.top = s.y + 'px';
      });
      rafId = requestAnimationFrame(tick);
    }
    tick();

    currentMinigameCleanup = () => { stopped = true; if(rafId) cancelAnimationFrame(rafId); };
  }

  // ---- ②「なぞれ！」：指定図形を一筆でなぞるのを3回 ----
  function startTraceMinigame(onComplete){
    ultOverlayTitle.textContent = '必殺技チャージ「なぞれ！」';
    ultInstruction.textContent = '光る図形を指でなぞろう！（3回）';

    const SHAPES = [
      // 三角形
      [[160,60],[250,240],[70,240],[160,60]],
      // 星型（簡易5角形の星）
      [[160,50],[190,140],[285,140],[208,195],[238,285],[160,230],[82,285],[112,195],[35,140],[130,140],[160,50]],
      // 円
      (() => { const pts = []; for(let i=0;i<=32;i++){ const a = (i/32)*Math.PI*2; pts.push([160+95*Math.cos(a),160+95*Math.sin(a)]); } return pts; })(),
    ];

    let round = 0;
    const TOTAL_ROUNDS = 3;
    const svgNS = 'http://www.w3.org/2000/svg';

    function playRound(){
      ultFrame.querySelectorAll('svg').forEach(s => s.remove());
      const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 320 320');
      svg.classList.add('ult-trace-svg');
      const targetPath = document.createElementNS(svgNS, 'polyline');
      targetPath.setAttribute('points', shape.map(p => p.join(',')).join(' '));
      targetPath.classList.add('ult-trace-target');
      svg.appendChild(targetPath);
      const drawnPath = document.createElementNS(svgNS, 'polyline');
      drawnPath.classList.add('ult-trace-drawn');
      svg.appendChild(drawnPath);
      ultFrame.appendChild(svg);

      let drawing = false;
      let drawnPts = [];
      let coveredCount = 0;
      const covered = new Array(shape.length).fill(false);

      function svgPoint(ev){
        const rect = svg.getBoundingClientRect();
        const x = ((ev.clientX - rect.left) / rect.width) * 320;
        const y = ((ev.clientY - rect.top) / rect.height) * 320;
        return [x, y];
      }
      function updateDrawn(){
        drawnPath.setAttribute('points', drawnPts.map(p => p.join(',')).join(' '));
      }
      function checkNear(pt){
        shape.forEach((sp, i) => {
          const dx = sp[0]-pt[0], dy = sp[1]-pt[1];
          if(!covered[i] && Math.sqrt(dx*dx+dy*dy) < 26){
            covered[i] = true; coveredCount++;
          }
        });
      }
      function onDown(ev){
        drawing = true; drawnPts = [svgPoint(ev)];
        checkNear(drawnPts[0]);
        updateDrawn();
      }
      function onMove(ev){
        if(!drawing) return;
        const pt = svgPoint(ev);
        drawnPts.push(pt);
        checkNear(pt);
        updateDrawn();
      }
      function onUp(){
        if(!drawing) return;
        drawing = false;
        const ratio = coveredCount / shape.length;
        if(ratio >= 0.7){
          round++;
          setUltProgress(round / TOTAL_ROUNDS);
          svg.remove();
          cleanupRound();
          if(round >= TOTAL_ROUNDS){
            setTimeout(onComplete, 200);
          } else {
            setTimeout(playRound, 200);
          }
        } else {
          drawnPts = [];
          coveredCount = 0;
          covered.fill(false);
          updateDrawn();
        }
      }
      svg.addEventListener('pointerdown', onDown);
      svg.addEventListener('pointermove', onMove);
      svg.addEventListener('pointerup', onUp);
      svg.addEventListener('pointerleave', onUp);

      function cleanupRound(){
        svg.removeEventListener('pointerdown', onDown);
        svg.removeEventListener('pointermove', onMove);
        svg.removeEventListener('pointerup', onUp);
        svg.removeEventListener('pointerleave', onUp);
      }
      currentMinigameCleanup = cleanupRound;
    }
    playRound();
  }

  // ---- ③「回せ！」：枠内をぐるぐる回して一定量ためる ----
  function startSpinMinigame(onComplete){
    ultOverlayTitle.textContent = '必殺技チャージ「回せ！」';

    dot.setAttribute('r','12');
    dot.classList.add('ult-spin-dot');
    svg.appendChild(dot);

    let dragging = false;
    let lastAngle = null;
    let totalRotation = 0;
    const NEEDED_ROTATION = Math.PI * 2 * 3; // 3周分

    function angleFromEvent(ev){
      const rect = svg.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      return Math.atan2(ev.clientY - cy, ev.clientX - cx);
    }
    function updateDot(angle){
      dot.setAttribute('cx', 160 + 110*Math.cos(angle));
      dot.setAttribute('cy', 160 + 110*Math.sin(angle));
    }
    updateDot(-Math.PI/2);

    function onDown(ev){ dragging = true; lastAngle = angleFromEvent(ev); }
    function onMove(ev){
      if(!dragging) return;
      const angle = angleFromEvent(ev);
      let delta = angle - lastAngle;
      if(delta > Math.PI) delta -= Math.PI*2;
      if(delta < -Math.PI) delta += Math.PI*2;
      totalRotation += Math.abs(delta);
      lastAngle = angle;
      updateDot(angle);
      setUltProgress(totalRotation / NEEDED_ROTATION);
      if(totalRotation >= NEEDED_ROTATION){
        cleanup();
        setTimeout(onComplete, 200);
      }

    function onUp(){ dragging = false; lastAngle = null; }
    svg.addEventListener('pointerdown', onDown);

    window.addEventListener('pointerup', onUp);

    function cleanup(){
      svg.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }

  // ---- ④「合わせろ！」：光る数字に針を合わせるのを3回 ----
  function startClockMinigame(onComplete){
    ultOverlayTitle.textContent = '必殺技チャージ「合わせろ！」';
    ultInstruction.textContent = '光っている数字に針を合わせよう！（3回）';
    const svgNS = 'http://www.w3.org/2000/svg';
    let round = 0;
    const TOTAL_ROUNDS = 3;

    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 320 320');
    svg.classList.add('ult-clock-svg');
    const face = document.createElementNS(svgNS, 'circle');
    face.setAttribute('cx','160'); face.setAttribute('cy','160'); face.setAttribute('r','120');
    face.classList.add('ult-clock-face');
    svg.appendChild(face);

    const numEls = [];
    for(let n = 1; n <= 12; n++){
      const a = (n/12) * Math.PI*2 - Math.PI/2;
      const x = 160 + 98*Math.cos(a), y = 160 + 98*Math.sin(a);
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.classList.add('ult-clock-num');
      t.textContent = String(n);
      svg.appendChild(t);
      numEls.push(t);
    }
    const hand = document.createElementNS(svgNS, 'line');
    hand.setAttribute('x1','160'); hand.setAttribute('y1','160');
    hand.classList.add('ult-clock-hand');
    svg.appendChild(hand);
    ultFrame.appendChild(svg);

    let targetNum = 0;
    let dragging = false;

    function pickTarget(){
      numEls.forEach(t => t.classList.remove('glow'));
      targetNum = 1 + Math.floor(Math.random()*12);
      numEls[targetNum-1].classList.add('glow');
    }
    function setHandAngle(angle){
      hand.setAttribute('x2', 160 + 95*Math.cos(angle));
      hand.setAttribute('y2', 160 + 95*Math.sin(angle));
    }
    setHandAngle(-Math.PI/2);
    pickTarget();

    function angleFromEvent(ev){
      const rect = svg.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      return Math.atan2(ev.clientY - cy, ev.clientX - cx);
    }
    function nearestNumberFromAngle(angle){
      let norm = angle + Math.PI/2;
      if(norm < 0) norm += Math.PI*2;
      let n = Math.round(norm / (Math.PI*2/12));
      if(n === 0) n = 12;
      if(n > 12) n -= 12;
      return n;
    }
    function onDown(ev){ dragging = true; onMove(ev); }
    function onMove(ev){
      if(!dragging) return;
      const angle = angleFromEvent(ev);
      setHandAngle(angle);
      const n = nearestNumberFromAngle(angle);
      if(n === targetNum){
        round++;
        setUltProgress(round / TOTAL_ROUNDS);
        dragging = false;
        if(round >= TOTAL_ROUNDS){
          cleanup();
          setTimeout(onComplete, 200);
        } else {
          setTimeout(pickTarget, 150);
        }
      }
    }
    function onUp(){ dragging = false; }
    svg.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);

    function cleanup(){
      svg.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    currentMinigameCleanup = cleanup;
  }

  function setOharaiProgress(ratio){
    const clamped = Math.max(0, Math.min(1, ratio));
    oharaiProgressFg.style.strokeDashoffset = String(OHARAI_PROGRESS_CIRC * (1 - clamped));
    // 進み具合に応じて紫のモヤを薄くしていき、完了で完全に晴れるようにする

  // ミニゲーム用に差し込んだ子要素だけを取り除く（モヤ用の oharaiMist は残す）
  function clearOharaiFrameContent(){
    Array.from(oharaiFrame.children).forEach(child => {
      if(child !== oharaiMist) child.remove();
    });
  }

  const OHARAI_MINIGAMES = ['spin', 'crush', 'mash', 'slash'];
  const OHARAI_LUCKY_CHANCE = 0.05; // 低確率（5%）で「超ラッキー！」

  function startOharaiMinigame(actor){
    oharaiCasterName.textContent = `${actor.name} のおはらい！`;
    clearOharaiFrameContent();
